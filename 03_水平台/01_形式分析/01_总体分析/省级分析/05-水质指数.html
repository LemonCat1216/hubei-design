<script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleSidebarBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    let isCollapsed = false;

    const chartInstances = {};
    const charts = [];

    // 侧边栏折叠逻辑
    toggleBtn.addEventListener('click', () => {
        isCollapsed = !isCollapsed;
        if (isCollapsed) {
            sidebar.classList.remove('w-[270px]');
            sidebar.classList.add('w-[80px]', 'hide-text', 'collapsed-sidebar');
            toggleIcon.style.transform = 'rotate(180deg)';
        } else {
            sidebar.classList.remove('w-[80px]', 'hide-text', 'collapsed-sidebar');
            sidebar.classList.add('w-[270px]');
            toggleIcon.style.transform = 'rotate(0deg)';
        }
        setTimeout(() => resizeAllCharts(), 300);
    });

    // 菜单展开/收起
    function toggleSubmenu(id) {
        if (isCollapsed) return;
        const submenu = document.getElementById(id);
        const btn = submenu.previousElementSibling;
        const chevron = btn.querySelector('.sidebar-chevron');
        if (submenu.style.maxHeight) {
            submenu.style.maxHeight = null;
            chevron.style.transform = 'rotate(0deg)';
        } else {
            submenu.style.maxHeight = submenu.scrollHeight + "px";
            chevron.style.transform = 'rotate(180deg)';
        }
    }

    // 初始化展开指定菜单
    window.addEventListener('load', () => {
        const provincialSubmenu = document.getElementById('submenu-provincial');
        if (provincialSubmenu) {
            provincialSubmenu.style.maxHeight = provincialSubmenu.scrollHeight + "px";
        }
    });

    // 切换 累计月/当前月
    function setMonthMode(mode) {
        const btnCurrent = document.getElementById('btn-current');
        const btnCumulative = document.getElementById('btn-cumulative');
        const monthSelect = document.getElementById('month-select');

        if (mode === 'current') {
            btnCurrent.classList.remove('inactive'); btnCurrent.classList.add('active');
            btnCumulative.classList.remove('active'); btnCumulative.classList.add('inactive');
            Array.from(monthSelect.options).forEach(opt => { opt.text = opt.text.replace('1-', ''); });
        } else {
            btnCumulative.classList.remove('inactive'); btnCumulative.classList.add('active');
            btnCurrent.classList.remove('active'); btnCurrent.classList.add('inactive');
            Array.from(monthSelect.options).forEach(opt => {
                if (!opt.text.startsWith('1-')) opt.text = '1-' + opt.text;
            });
        }
    }

    // 通用图表 Tooltip 样式配置
    const getTooltipConfig = () => ({
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        borderColor: '#e2e8f0',
        textStyle: { color: '#334155' },
        extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-radius: 6px;'
    });

    // 初始化图表
    function initCharts() {
        const textCol = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
        const color2025 = '#3b82f6'; // 蓝色
        const color2024 = '#06b6d4'; // 青色
        const colorLine = '#fbbf24'; // 黄色线

        // 1. 断面水质指数同比变化
        const domYoy = document.getElementById('chart-yoy');
        const chartYoy = echarts.init(domYoy);
        chartInstances['chartYoy'] = chartYoy;
        charts.push(chartYoy);
        chartYoy.setOption({
            tooltip: getTooltipConfig(),
            legend: { top: 0, right: '2%', icon: 'roundRect', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 11, color: textCol } },
            grid: { top: '15%', left: '1%', right: '2%', bottom: '2%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['1月', '1-2月', '1-3月', '1-4月', '1-5月', '1-6月', '1-7月', '1-8月', '1-9月', '1-10月', '1-11月', '1-12月'],
                axisLabel: { color: textCol, fontSize: 11 }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 4,
                interval: 1,
                axisLabel: { color: textCol },
                splitLine: { lineStyle: { type: 'dashed', color: '#e2e8f0' } }
            },
            series: [
                { name: '2025', type: 'bar', barWidth: '15%', data: [3.7, 3.65, 3.65, 3.7, 3.75, 3.8, 3.9, 3.95, 3.9, 3.9, 3.85, 3.85], itemStyle: { color: color2025, borderRadius: [2, 2, 0, 0] } },
                { name: '2024', type: 'bar', barWidth: '15%', data: [3.7, 3.7, 3.75, 3.8, 3.8, 3.8, 3.85, 3.9, 3.95, 3.9, 3.9, 3.85], itemStyle: { color: color2024, borderRadius: [2, 2, 0, 0] } }
            ]
        });

        // 2. 各地市水质指数排名统计 (双轴: 柱状图 + 折线图)
        const domCityRank = document.getElementById('chart-city-rank');
        const chartCityRank = echarts.init(domCityRank);
        chartInstances['chartCityRank'] = chartCityRank;
        charts.push(chartCityRank);

    // 下载图表
    function downloadChart(chartKey) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
        const a = document.createElement('a');
        a.href = url;
        a.download = chartKey + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // 展现图表对应的表格数据
    function showChartData(chartKey, titleText) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const option = chart.getOption();
        const series = option.series;

        let categories = [];
        if (option.xAxis && option.xAxis[0] && option.xAxis[0].data) {
            categories = option.xAxis[0].data;
        }

        document.getElementById('modal-title').innerText = titleText;

        let rowHeaderName = '类目';
        if (chartKey === 'chartYoy') rowHeaderName = '月份';
        else if (chartKey === 'chartCityRank') rowHeaderName = '地市名称';
        else if (chartKey === 'chartSectionRank') rowHeaderName = '断面名称';

        const thead = document.getElementById('modal-thead');
        let theadHTML = `<tr>
            <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
            <th class="px-6 py-4 font-bold w-48">${rowHeaderName}</th>`;
        series.forEach(s => {
            theadHTML += `<th class="px-6 py-4 font-bold">${s.name}</th>`;
        });
        theadHTML += '</tr>';
        thead.innerHTML = theadHTML;

        const tbody = document.getElementById('modal-tbody');
        let tbodyHTML = '';
        if(categories && categories.length > 0) {
            categories.forEach((cat, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-[#fcfcfc] dark:bg-slate-800/50';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 dark:hover:bg-slate-700/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700 dark:text-slate-300">${cat}</td>`;
                series.forEach(s => {
                    let val = (s.data[idx] !== undefined && s.data[idx] !== null) ? s.data[idx] : '-';
                    // 如果是变化率给加个单位
                    if(s.name === 'ΔCWQI' && val !== '-') val += '%';
                    tbodyHTML += `<td class="px-6 py-4">${val}</td>`;
                });
                tbodyHTML += '</tr>';
            });
        }
        tbody.innerHTML = tbodyHTML;

        const modal = document.getElementById('data-table-modal');
        modal.classList.remove('hidden');
        void modal.offsetWidth;
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    }

    // 导出 Excel (CSV格式)
    function exportExcel() {
        const table = document.querySelector('#data-table-modal table');
        if (!table) return;

        let csv = [];
        const rows = table.querySelectorAll('tr');

        for (let i = 0; i < rows.length; i++) {
            let row = [];
            const cols = rows[i].querySelectorAll('td, th');
            for (let j = 0; j < cols.length; j++) {
                let data = cols[j].innerText.trim();
                if (i === 0 && j === 0 && data === "") data = "序号";
                data = data.replace(/"/g, '""'); // 转义引号
                row.push('"' + data + '"');
            }
            csv.push(row.join(','));
        }

        const csvFile = new Blob(['\uFEFF' + csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement("a");
        const title = document.getElementById('modal-title').innerText || '导出数据';

        downloadLink.download = title + ".csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    // 关闭数据表模态框
    function closeModal() {
        const modal = document.getElementById('data-table-modal');
        modal.classList.add('opacity-0');
        modal.querySelector('div').classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    // 窗口尺寸自适应
    function resizeAllCharts() { charts.forEach(chart => { if (chart) chart.resize(); }); }

    window.addEventListener('load', initCharts);
    window.addEventListener('resize', resizeAllCharts);
</script>
