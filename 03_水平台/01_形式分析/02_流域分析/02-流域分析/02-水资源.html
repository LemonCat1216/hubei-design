<script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleSidebarBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    let isCollapsed = false;

    toggleBtn.addEventListener('click', () => {
        isCollapsed = !isCollapsed;
        if (isCollapsed) {
            sidebar.classList.remove('w-[270px]');
            sidebar.classList.add('w-[80px]', 'hide-text', 'collapsed-sidebar');
            toggleIcon.style.transform = 'rotate(180deg)';
        } else {
            sidebar.classList.remove('w-[80px]', 'hide-text', 'collapsed-sidebar');
            sidebar.classList.add('w-[270px]');
            toggleIcon.style.transform = 'rotate(0deg)';
        }
        setTimeout(() => resizeAllCharts(), 300);
    });

    function toggleSubmenu(id) {
        if (isCollapsed) return;
        const submenu = document.getElementById(id);
        const btn = submenu.previousElementSibling;
        const chevron = btn.querySelector('.sidebar-chevron');
        if (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') {
            submenu.style.maxHeight = '0px';
            chevron.style.transform = 'rotate(0deg)';
        } else {
            submenu.style.maxHeight = submenu.scrollHeight + "px";
            chevron.style.transform = 'rotate(180deg)';
        }
    }

    // 默认展开流域分析
    window.addEventListener('load', () => {
        const submenu = document.getElementById('submenu-analysis');
        if(submenu) submenu.style.maxHeight = submenu.scrollHeight + "px";

        checkValue('one');
        handleLevelOneChange();
    });

    /* ---------------- Cascade Select Logic (流域选择) ---------------- */
    const subBasinData = {
        'changjiang': [
            {val: 'hanjiang', text: '汉江水系'},
            {val: 'minjiang', text: '岷江水系'},
            {val: 'jialing', text: '嘉陵江水系'}
        ],
        'huaihe': [
            {val: 'yishu', text: '沂沭泗水系'},
            {val: 'huaihe_main', text: '淮河干流'}
        ],
        'huanghe': [
            {val: 'weihe', text: '渭河水系'},
            {val: 'fenhe', text: '汾河水系'}
        ]
    };

    const elOne = document.getElementById('river-select-one');
    const elTwo = document.getElementById('river-select-two');
    const wrapOne = document.getElementById('wrapper-one');
    const wrapTwo = document.getElementById('wrapper-two');

    function handleLevelOneChange() {
        const selectedValue = elOne.value;
        checkValue('one');

        // Reset Level 2
        elTwo.innerHTML = '<option value="" disabled selected hidden>请选择二级流域</option>';
        elTwo.value = "";
        checkValue('two');

        if (selectedValue && subBasinData[selectedValue]) {
            elTwo.disabled = false;
            elTwo.classList.remove('text-slate-400');
            elTwo.classList.add('text-slate-700', 'font-medium');
            subBasinData[selectedValue].forEach(item => {
                const option = document.createElement('option');
                option.value = item.val;
                option.textContent = item.text;
                elTwo.appendChild(option);
            });
        } else {
            elTwo.disabled = true;
            elTwo.classList.add('text-slate-400');
            elTwo.classList.remove('text-slate-700', 'font-medium');
        }
    }

    function clearSelection(level) {
        if (level === 'one') {
            elOne.value = "";
            handleLevelOneChange();
        } else {
            elTwo.value = "";
            checkValue('two');
        }
    }

    function checkValue(level) {
        const wrapper = level === 'one' ? wrapOne : wrapTwo;
        const select = level === 'one' ? elOne : elTwo;
        if (select.value && select.value !== "") {
            wrapper.classList.add('has-value');
        } else {
            wrapper.classList.remove('has-value');
        }
    }

    const chartInstances = {};
    const charts = [];
    const textCol = '#64748b';
    const gridLineCol = '#f1f5f9';

    const commonTooltip = {
        trigger: 'axis',
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        borderColor: '#e2e8f0',
        textStyle: { color: '#334155' },
        extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px;'
    };

    const commonXAxis = {
        type: 'category',
        data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
        axisLabel: { color: textCol, margin: 12 },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e2e8f0' } },
        boundaryGap: false
    };

    function initCharts() {
        const colorBlue = '#3b82f6';
        const colorYellow = '#f59e0b'; // 配色适配06

        // 1. 流域流量月均同比变化
        const cFlow = echarts.init(document.getElementById('chart-flow'));
        chartInstances['chartFlow'] = cFlow;
        charts.push(cFlow);
        cFlow.setOption({
            tooltip: commonTooltip,
            legend: {
                data: ['2025流量', '2024流量'],
                top: 0, right: 10,
                icon: 'circle', itemWidth: 8,
                textStyle: { color: textCol, fontSize: 12 }
            },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: commonXAxis,
            yAxis: {
                type: 'value', name: 'm³/s', nameTextStyle: { color: textCol, padding: [0, 30, 0, 0] },
                min: 0, max: 30000, interval: 5000,
                axisLabel: { color: textCol }, splitLine: { lineStyle: { color: gridLineCol } }
            },
            series: [
                {
                    name: '2025流量', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorBlue }, lineStyle: { width: 2 },
                    data: [11000, 14000, 12000, 23000, 27000, 25000, 0, 0, 0, 0, 0, 0]
                },
                {
                    name: '2024流量', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorYellow }, lineStyle: { width: 2 },
                    data: [11000, 14000, 12000, 23000, 27000, 25000, 0, 0, 0, 0, 0, 0]
                }
            ]
        });

        // 2. 流域水位月均同比变化
        const cLevel = echarts.init(document.getElementById('chart-level'));
        chartInstances['chartLevel'] = cLevel;
        charts.push(cLevel);
        cLevel.setOption({
            tooltip: commonTooltip,
            legend: {
                data: ['2025水位', '2024水位'],
                top: 0, right: 10,
                icon: 'circle', itemWidth: 8,
                textStyle: { color: textCol, fontSize: 12 }
            },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: commonXAxis,
            yAxis: {
                type: 'value', name: 'm', nameTextStyle: { color: textCol, padding: [0, 20, 0, 0] },
                min: 0, max: 70, interval: 10,
                axisLabel: { color: textCol }, splitLine: { lineStyle: { color: gridLineCol } }
            },
            series: [
                {
                    name: '2025水位', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorBlue }, lineStyle: { width: 2 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                            { offset: 1, color: 'rgba(59, 130, 246, 0)' }
                        ])
                    },
                    data: [18, 19, 20, 20, 22, 53, 61, null, null, null, null, null]
                },
                {
                    name: '2024水位', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorYellow }, lineStyle: { width: 2 },
                    data: [20, 21, 20, 24, 25, 25, 30, 27, 21, 19, 18, 18]
                }
            ]
        });

        // 3. 流域气象降雨月均同比变化
        const cRain = echarts.init(document.getElementById('chart-rain'));
        chartInstances['chartRain'] = cRain;
        charts.push(cRain);
        cRain.setOption({
            tooltip: commonTooltip,
            legend: {
                data: ['2025降雨', '2024降雨'],
                top: 0, right: 10,
                icon: 'circle', itemWidth: 8,
                textStyle: { color: textCol, fontSize: 12 }
            },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: commonXAxis,
            yAxis: {
                type: 'value', name: 'mm', nameTextStyle: { color: textCol, padding: [0, 25, 0, 0] },
                min: 0, max: 400, interval: 100,
                axisLabel: { color: textCol }, splitLine: { lineStyle: { color: gridLineCol } }
            },
            series: [
                {
                    name: '2025降雨', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorBlue }, lineStyle: { width: 2 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                            { offset: 1, color: 'rgba(59, 130, 246, 0)' }
                        ])
                    },
                    data: [0, 15, 65, 70, 130, 350, 50, null, null, null, null, null]
                },
                {
                    name: '2024降雨', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorYellow }, lineStyle: { width: 2 },
                    data: [40, 85, 45, 110, 40, 210, 215, 70, 15, 40, 10, 0]
                }
            ]
        });

        // 4. 气象站
        const cStation = echarts.init(document.getElementById('chart-station'));
        chartInstances['chartStation'] = cStation;
        charts.push(cStation);
        cStation.setOption({
            tooltip: commonTooltip,
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['2025-03', '2025-05', '2025-07', '2025-09', '2025-11', '2026-01', '2026-03'],
                axisLabel: { color: textCol, margin: 12 },
                axisTick: { show: false },
                axisLine: { lineStyle: { color: '#e2e8f0' } },
                boundaryGap: false
            },
            yAxis: {
                type: 'value', name: 'mm', nameTextStyle: { color: textCol, padding: [0, 25, 0, 0] },
                axisLabel: { color: textCol }, splitLine: { lineStyle: { color: gridLineCol } },
                min: 13, max: 197, interval: 30
            },
            series: [
                {
                    name: '降雨量', type: 'line', symbol: 'emptyCircle', symbolSize: 6,
                    itemStyle: { color: colorBlue }, lineStyle: { width: 2 },
                    data: [55, 55, 30, 110, 90, 170, 180, 80, 40, 25, 15]
                }
            ]
        });
    }

    // 显示图表数据表格
    function showChartData(chartKey, titleText) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const option = chart.getOption();
        const series = option.series;

        let categories = [];
        if (option.xAxis && option.xAxis[0] && option.xAxis[0].data) {
            categories = option.xAxis[0].data;
        }

        document.getElementById('modal-title').innerText = titleText;
        let rowHeaderName = chartKey === 'chartStation' ? '日期' : '月份';

        const thead = document.getElementById('modal-thead');
        let theadHTML = `<tr>
            <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
            <th class="px-6 py-4 font-bold w-48">${rowHeaderName}</th>`;
        series.forEach(s => {
            theadHTML += `<th class="px-6 py-4 font-bold">${s.name}</th>`;
        });
        theadHTML += '</tr>';
        thead.innerHTML = theadHTML;

        const tbody = document.getElementById('modal-tbody');
        let tbodyHTML = '';
        if(categories && categories.length > 0) {
            categories.forEach((cat, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-[#fcfcfc] dark:bg-slate-800/50';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 dark:hover:bg-slate-700/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700 dark:text-slate-300">${cat}</td>`;
                series.forEach(s => {
                    const val = (s.data[idx] !== undefined && s.data[idx] !== null) ? s.data[idx] : '-';
                    tbodyHTML += `<td class="px-6 py-4">${val}</td>`;
                });
                tbodyHTML += '</tr>';
            });
        }
        tbody.innerHTML = tbodyHTML;

        const modal = document.getElementById('data-table-modal');
        modal.classList.remove('hidden');
        void modal.offsetWidth;
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    }

    // 导出 Excel
    function exportExcel() {
        const table = document.querySelector('#data-table-modal table');
        if (!table) return;

        let csv = [];
        const rows = table.querySelectorAll('tr');

        for (let i = 0; i < rows.length; i++) {
            let row = [];
            const cols = rows[i].querySelectorAll('td, th');
            for (let j = 0; j < cols.length; j++) {
                let data = cols[j].innerText.trim();
                if (i === 0 && j === 0 && data === "") data = "序号";
                data = data.replace(/"/g, '""');
                row.push('"' + data + '"');
            }
            csv.push(row.join(','));
        }

        const csvFile = new Blob(['\uFEFF' + csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement("a");
        const title = document.getElementById('modal-title').innerText || '导出数据';

        downloadLink.download = title + ".csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function closeModal() {
        const modal = document.getElementById('data-table-modal');
        modal.classList.add('opacity-0');
        modal.querySelector('div').classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    // 下载图表
    function downloadChart(chartKey) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
        const a = document.createElement('a');
        a.href = url;
        a.download = chartKey + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function resizeAllCharts() { charts.forEach(chart => { if (chart) chart.resize(); }); }

    window.addEventListener('load', initCharts);
    window.addEventListener('resize', resizeAllCharts);
</script>

</body>
</html>
