    function getFilteredData() {
        let data = rawData[currentPeriod] || [];
        // 1. 流域筛选
        if (filterB1) data = data.filter(r => r.basin1 === filterB1);
        if (filterB2) data = data.filter(r => r.basin2 === filterB2);
        // 2. 图表联动筛选
        if (chartFilter) {
            if (chartFilter.type === 'cls') data = data.filter(r => r.cls === chartFilter.value);
            else if (chartFilter.type === 'bqi') data = data.filter(r => r.bqi === chartFilter.value);
        }
        // 3. Tab筛选
        if (currentTab === 'lake') return data.filter(r => r.trophic !== '-1');
        if (currentTab === 'river') return data.filter(r => r.trophic === '-1');
        if (currentTab === 'problem') return data.filter(r => ['较差','很差'].includes(r.overlay));
        return data;

    function initCharts() {

    function renderCharts() {
        const data = getFilteredData();
        const textCol = '#64748b';

        // --- 1. 气泡矩阵图 (彻底解决文字遮挡和左侧留白问题) ---
        const cities = [...new Set(data.map(r => r.city))];
        const overlayLevels = ['优秀', '良好', '一般', '较差', '很差'];

        const bubbleData = [];
        let maxCount = 0;

        cities.forEach((city, xIndex) => {
            overlayLevels.forEach((level, yIndex) => {
                const count = data.filter(d => d.city === city && d.overlay === level).length;
                if (count > 0) {
                    bubbleData.push([xIndex, yIndex, count]);
                    if (count > maxCount) maxCount = count;
                }
            });
        });

        chartInstances.chartMatrix.setOption({
            tooltip: {
                position: 'top',
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#e2e8f0',
                textStyle: { color: '#334155' },
                formatter: function (params) {
                    return `<div class="font-bold mb-1">${cities[params.value[0]]}</div>
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full" style="background:${overlayColors[params.value[1]]}"></span>
                                ${overlayLevels[params.value[1]]}: <span class="font-bold">${params.value[2]}</span> 个
                            </div>`;
                }
            },
            // [修复] 调整 left 缩小空白，调整 bottom 留出足够倾斜文字空间
            grid: { top: '8%', left: '3%', right: '5%', bottom: '18%', containLabel: true },
            xAxis: {
                type: 'category',
                data: cities,
                // [修复] boundaryGap 开启，两端留出半个格子的空间，不再紧贴边缘发生遮挡
                boundaryGap: true,
                splitLine: { show: true, lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: { color: textCol, interval: 0, rotate: 35, fontSize: 11 }
            },
            yAxis: {
                type: 'category',
                data: overlayLevels,
                // [修复] boundaryGap 同样开启，保护上下边缘气泡
                boundaryGap: true,
                axisLine: { show: false },
                axisTick: { show: false },
                // [修复] margin 加大，强制拉开文字与气泡的距离
                axisLabel: { color: textCol, fontWeight: 'bold', margin: 12 },
                splitLine: { show: true, lineStyle: { color: '#f1f5f9' } }
            },
            series: [{
                name: 'Punch Card',
                type: 'scatter',
                symbolSize: function (val) {
                    // [修复] 稍微控制最大气泡的半径，防止互相压盖太严重
                    return (val[2] / (maxCount || 1)) * 20 + 8;
                },
                itemStyle: {
                    color: function(params) { return overlayColors[params.value[1]]; },
                    shadowBlur: 10,
                    shadowColor: 'rgba(0, 0, 0, 0.1)'
                },
                data: bubbleData,
                animationDelay: function (idx) { return idx * 20; }
            }]
        }, true);

        // --- 2. 环形占比图 (与 BQI 色彩完全一致) ---
        const pieData = overlayLevels.map((l, i) => ({
            name: l, value: data.filter(d=>d.overlay===l).length, itemStyle: {color: overlayColors[i]}
        })).filter(d => d.value > 0);

        chartInstances.chartPie.setOption({
            tooltip: { trigger: 'item', backgroundColor: 'rgba(255,255,255,0.95)', textStyle: { color: '#334155' } },
            legend: { orient: 'vertical', right: '5%', top: 'center', icon: 'circle', textStyle: { color: textCol } },
            series: [{
                type: 'pie', radius: ['45%', '70%'], center: ['40%', '50%'],
                itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 6 },
                label: { show: false },
                data: pieData
            }]
        }, true);

        // --- 3. 水质类别分布 (渐变色 + 点击联动) ---
        const wcCount = {};
        data.forEach(r => { wcCount[r.cls] = (wcCount[r.cls] || 0) + 1; });
        const wcOrder = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', '劣Ⅴ'];
        const wcKeys = wcOrder.filter(k => wcCount[k] !== undefined);

        chartInstances.chartWaterClass.setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(241, 245, 249, 0.4)' } },
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#e2e8f0',
                padding: [10, 16],
                textStyle: { color: '#334155' },
                extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 8px;'
            },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: {
                type: 'category',
                data: wcKeys,
                axisTick: { show: false },
                axisLine: { lineStyle: { color: '#e2e8f0' } },
                axisLabel: { color: '#64748b', fontWeight: 'bold', margin: 12, fontSize: 13 }
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                axisLabel: { color: '#94a3b8' }
            },
            series: [{
                name: '断面数量',
                type: 'bar',
                barWidth: '40%',
                barMaxWidth: 32, // 自适应宽度，但不超过32px
                showBackground: true, // 开启背景槽
                backgroundStyle: { color: 'rgba(241, 245, 249, 0.6)', borderRadius: [6, 6, 0, 0] },
                label: {
                    show: true,
                    position: 'top',
                    distance: 8,
                    fontWeight: '900',
                    fontSize: 14,
                    color: '#475569' // 深灰色的字体让数据更清晰
                },
                itemStyle: {
                    borderRadius: [6, 6, 0, 0], // 增加圆角显得更圆润
                    color: function(params) {
                        const c = natWaterClassColors[params.name];
                        if (!c) return '#ccc';
                        return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: c.top },
                            { offset: 1, color: c.bottom }
                        ]);
                    },
                    shadowBlur: 8,
                    shadowColor: 'rgba(0,0,0,0.08)',
                    shadowOffsetY: 2
                },
                emphasis: {
                    itemStyle: { shadowBlur: 15, shadowColor: 'rgba(0,0,0,0.2)' }
                },
                data: wcKeys.map(k => wcCount[k])
            }]
        }, true);

        // 点击联动 (这部分保留你原有的代码)
        chartInstances.chartWaterClass.off('click');
        chartInstances.chartWaterClass.on('click', function(params) {
            if (chartFilter && chartFilter.type === 'cls' && chartFilter.value === params.name) {
                chartFilter = null;
            } else {
                chartFilter = { type: 'cls', value: params.name };
            }
            syncChartHighlight();
            refreshTable();
            renderKpiCards();
            updateFilterBadge();
        });

        // --- 4. BQI评价结果分布 (渐变色 + 点击联动) ---
        // 同样对 BQI 的色彩做高级感柔和处理
        const bqiGradients = {
            '优秀': { top: '#6ee7b7', bottom: '#059669' },
            '良好': { top: '#93c5fd', bottom: '#2563eb' },
            '一般': { top: '#fde047', bottom: '#d97706' },
            '较差': { top: '#fdba74', bottom: '#ea580c' },
            '很差': { top: '#fca5a5', bottom: '#dc2626' }
        };
        const bqiCount = {};
        data.filter(r => r.bqi && r.bqi !== '/').forEach(r => { bqiCount[r.bqi] = (bqiCount[r.bqi] || 0) + 1; });
        const bqiKeys = overlayLevels.filter(k => bqiCount[k] !== undefined);

        chartInstances.chartBqi.setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(241, 245, 249, 0.4)' } },
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#e2e8f0',
                padding: [10, 16],
                textStyle: { color: '#334155' },
                extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 8px;'
            },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: {
                type: 'category',
                data: bqiKeys,
                axisTick: { show: false },
                axisLine: { lineStyle: { color: '#e2e8f0' } },
                axisLabel: { color: '#64748b', fontWeight: 'bold', margin: 12, fontSize: 13 }
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                axisLabel: { color: '#94a3b8' }
            },
            series: [{
                name: '断面数量',
                type: 'bar',
                barWidth: '40%',
                barMaxWidth: 32,
                showBackground: true,
                backgroundStyle: { color: 'rgba(241, 245, 249, 0.6)', borderRadius: [6, 6, 0, 0] },
                label: {
                    show: true,
                    position: 'top',
                    distance: 8,
                    fontWeight: '900',
                    fontSize: 14,
                    color: '#475569'
                },
                itemStyle: {
                    borderRadius: [6, 6, 0, 0],
                    color: function(params) {
                        const c = bqiGradients[params.name];
                        if (!c) return '#ccc';
                        return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: c.top },
                            { offset: 1, color: c.bottom }
                        ]);
                    },
                    shadowBlur: 8,
                    shadowColor: 'rgba(0,0,0,0.08)',
                    shadowOffsetY: 2
                },
                emphasis: {
                    itemStyle: { shadowBlur: 15, shadowColor: 'rgba(0,0,0,0.2)' }
                },
                data: bqiKeys.map(k => bqiCount[k])
            }]
        }, true);

        // 点击联动 (这部分保留你原有的代码)
        chartInstances.chartBqi.off('click');
        chartInstances.chartBqi.on('click', function(params) {
            if (chartFilter && chartFilter.type === 'bqi' && chartFilter.value === params.name) {
                chartFilter = null;
            } else {
                chartFilter = { type: 'bqi', value: params.name };
            }
            syncChartHighlight();
            refreshTable();
            renderKpiCards();
            updateFilterBadge();
        });
    }

    /* ================================================================
       CHART LINKAGE HELPERS
       ================================================================ */
    function syncChartHighlight() {
        // 水质类别分布高亮
        if (chartInstances.chartWaterClass) {
            const wcData = chartInstances.chartWaterClass.getOption().series[0].data;
            chartInstances.chartWaterClass.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            if (chartFilter && chartFilter.type === 'cls') {
                const idx = (chartInstances.chartWaterClass.getOption().xAxis[0].data || []).indexOf(chartFilter.value);
                if (idx >= 0) chartInstances.chartWaterClass.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: idx });
            }
        }
        // BQI分布高亮
        if (chartInstances.chartBqi) {
            chartInstances.chartBqi.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            if (chartFilter && chartFilter.type === 'bqi') {
                const idx = (chartInstances.chartBqi.getOption().xAxis[0].data || []).indexOf(chartFilter.value);
                if (idx >= 0) chartInstances.chartBqi.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: idx });
            }
        }
    }

    function updateFilterBadge() {
        const badge = document.getElementById('chart-filter-badge');
        if (!badge) return;
        if (chartFilter) {
            const label = chartFilter.type === 'cls' ? '水质类别' : 'BQI评价';
            badge.innerHTML = `<span class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-[12px] font-bold border border-blue-200 cursor-pointer hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-colors" onclick="clearChartFilter()">
                ${label}: ${chartFilter.value} <i class="ri-close-line text-[14px]"></i>
            </span>`;
            badge.style.display = 'flex';
        } else {
            badge.innerHTML = '';
            badge.style.display = 'none';
        }
    }

    function clearChartFilter() {
        chartFilter = null;
        syncChartHighlight();
        refreshTable();
        renderKpiCards();
        updateFilterBadge();
    }

    /* ================================================================
       TABLE & SMART PAGINATION
       ================================================================ */
    const rowsPerPage = 10;
    let currentPage = 1;
    let currentTableData = [];

    function switchTab(tabId, btn) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.add('inactive'); });
        btn.classList.remove('inactive'); btn.classList.add('active');
        refreshTable();
    }

    function refreshTable() {
        currentTableData = getFilteredData();
        document.getElementById('total-items').innerText = currentTableData.length;
        currentPage = 1;
        renderTablePage();
    }

    function renderTablePage() {
        const thead = document.getElementById('dynamic-thead');
        const tbody = document.getElementById('dynamic-tbody');
        thead.innerHTML = `<tr><th>序号</th><th>责任城市</th><th>河流/湖库</th><th>断面名称</th><th>水质类别</th><th>湖库营养状态</th><th>BQI评价</th><th>叠加评价结果</th></tr>`;

        const start = (currentPage - 1) * rowsPerPage;
        const pageData = currentTableData.slice(start, start + rowsPerPage);

        let html = '';
        pageData.forEach((r, i) => {
            let badgeMap = {'优秀':'badge-excellent','良好':'badge-good','一般':'badge-fair','较差':'badge-poor','很差':'badge-very-poor'};
            const trophic = r.trophic === '-1' ? '-' : r.trophic;
            const bqi = r.bqi === '/' || !r.bqi ? '-' : r.bqi;
            html += `<tr>
                <td class="text-slate-400 font-medium">${start + i + 1}</td>
                <td class="font-bold text-slate-700">${r.city}</td><td>${r.river}</td><td>${r.section}</td>
                <td><span class="font-bold">${r.cls}</span></td>
                <td>${trophic}</td><td>${bqi}</td>
                <td><span class="badge ${badgeMap[r.overlay]||'badge-fair'}">${r.overlay}</span></td>
            </tr>`;
        });
        tbody.innerHTML = html || '<tr><td colspan="8" class="py-12 text-center text-slate-400">暂无符合条件的数据</td></tr>';

        renderPaginationUI();
    }

    function renderPaginationUI() {
        const totalPages = Math.ceil(currentTableData.length / rowsPerPage) || 1;
        const container = document.getElementById('pagination-controls');
        let html = '';

        const prevDis = currentPage === 1;
        html += `<button onclick="goToPage(${currentPage-1})" ${prevDis?'disabled':''} class="px-3 py-1.5 text-[13px] border border-slate-200 rounded-md ${prevDis?'text-slate-400 bg-slate-50 cursor-not-allowed':'text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-colors'}">上一页</button>`;

        let pages = [];
        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
            if (currentPage <= 4) pages = [1, 2, 3, 4, 5, '...', totalPages];
            else if (currentPage >= totalPages - 3) pages = [1, '...', totalPages-4, totalPages-3, totalPages-2, totalPages-1, totalPages];
            else pages = [1, '...', currentPage-1, currentPage, currentPage+1, '...', totalPages];
        }

        pages.forEach(p => {
            if (p === '...') html += `<span class="px-2 text-slate-400 flex items-end pb-1 font-bold tracking-widest">...</span>`;
            else if (p === currentPage) html += `<button class="px-3 py-1.5 text-[13px] font-bold border border-blue-500 bg-blue-500 text-white rounded-md shadow-sm">${p}</button>`;
            else html += `<button onclick="goToPage(${p})" class="px-3 py-1.5 text-[13px] border border-slate-200 rounded-md text-slate-600 hover:bg-slate-50 transition-colors">${p}</button>`;
        });

        const nextDis = currentPage === totalPages;
        html += `<button onclick="goToPage(${currentPage+1})" ${nextDis?'disabled':''} class="px-3 py-1.5 text-[13px] border border-slate-200 rounded-md ${nextDis?'text-slate-400 bg-slate-50 cursor-not-allowed':'text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-colors'}">下一页</button>`;

        container.innerHTML = html;
    }

    function goToPage(page) {
        const totalPages = Math.ceil(currentTableData.length / rowsPerPage);
        if (page >= 1 && page <= totalPages) { currentPage = page; renderTablePage(); }
    }

    /* ================================================================
       MODAL & EXPORT
       ================================================================ */
    function showChartData(chartKey, titleText) {
        document.getElementById('modal-title').innerText = titleText + " 基础数据";
        const modal = document.getElementById('data-table-modal');
        modal.classList.remove('hidden'); void modal.offsetWidth;
        modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95');
    }
    function closeModal() {
        const modal = document.getElementById('data-table-modal');
        modal.classList.add('opacity-0'); modal.querySelector('div').classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }
    function downloadChart(chartKey) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const a = document.createElement('a');
        a.href = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
        a.download = chartKey + '.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function exportExcel() { alert("导出功能模拟执行成功"); }

    /* ================================================================
       INIT
       ================================================================ */
    function refreshAll() { renderKpiCards(); renderCharts(); refreshTable(); }

    window.addEventListener('load', () => { initCharts(); refreshAll(); });
    window.addEventListener('resize', () => { Object.values(chartInstances).forEach(c => c && c.resize()); });
</script>

</body>
</html>
