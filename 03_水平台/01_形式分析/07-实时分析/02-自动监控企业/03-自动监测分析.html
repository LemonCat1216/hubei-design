            sidebar.classList.remove('w-[270px]');
            sidebar.classList.add('w-[80px]', 'hide-text', 'collapsed-sidebar');
            toggleIcon.style.transform = 'rotate(180deg)';
        } else {
            sidebar.classList.remove('w-[80px]', 'hide-text', 'collapsed-sidebar');
            sidebar.classList.add('w-[270px]');
            toggleIcon.style.transform = 'rotate(0deg)';
        }
        setTimeout(() => resizeAllCharts(), 300);
    });

    function toggleSubmenu(id) {
        if (isCollapsed) return;
        const submenu = document.getElementById(id);
        const btn = submenu.previousElementSibling;
        const chevron = btn.querySelector('.sidebar-chevron');
        if (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') {
            submenu.style.maxHeight = '0px';
            chevron.style.transform = 'rotate(0deg)';
        } else {
            submenu.style.maxHeight = submenu.scrollHeight + "px";
            chevron.style.transform = 'rotate(180deg)';
        }
    }

    // 默认展开
    window.addEventListener('load', () => {
        const realtimeSub = document.getElementById('submenu-realtime');
        if(realtimeSub) realtimeSub.style.maxHeight = realtimeSub.scrollHeight + "px";
    });

    // === ECharts 初始化与配置 ===
    const chartInstances = {};
    const charts = [];
    const textCol = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
    const axisLineColor = '#e2e8f0';
    const commonGrid = { top: 35, bottom: 25, left: 40, right: 30, containLabel: true };

    function initCharts() {
        // 1. 饼图：报警污染物占比
        const cPie = echarts.init(document.getElementById('chart-pie'));
        chartInstances['chartPie'] = cPie;
        charts.push(cPie);
        cPie.setOption({
            tooltip: { trigger: 'item', backgroundColor: 'rgba(255, 255, 255, 0.95)', extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);', textStyle: { color: '#334155' } },
            legend: { top: 'middle', right: '5%', orient: 'vertical', icon: 'circle', itemGap: 15, textStyle: { color: textCol } },
            series: [{
                name: '报警因子', type: 'pie', radius: ['45%', '70%'], center: ['35%', '50%'],
                itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 },
                label: { show: false, position: 'center' },
                emphasis: { label: { show: true, fontSize: '16', fontWeight: 'bold', color: '#333' } },
                data: [
                    { value: 65, name: '化学需氧量', itemStyle: { color: '#3b82f6' } },
                    { value: 45, name: '氨氮', itemStyle: { color: '#10b981' } },
                    { value: 30, name: '总磷', itemStyle: { color: '#f59e0b' } },
                    { value: 16, name: '总氮', itemStyle: { color: '#ef4444' } }
                ]
            }]
        });

        // 2. 柱状图：各类污染物报警次数
        const cBar = echarts.init(document.getElementById('chart-bar'));
        chartInstances['chartBar'] = cBar;
        charts.push(cBar);
        cBar.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: 'rgba(255, 255, 255, 0.95)', extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);' },
            grid: commonGrid,
            xAxis: { type: 'category', data: ['化学需氧量', '氨氮', '总磷', '总氮'], axisLine: { lineStyle: { color: axisLineColor } }, axisLabel: { color: textCol } },
            yAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed', color: '#f1f5f9' } }, axisLabel: { color: textCol } },
            series: [{
                name: '报警次数', data: [65, 45, 30, 16], type: 'bar', barWidth: 32,
                itemStyle: {
                    borderRadius: [4, 4, 0, 0],
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#60a5fa' },
                        { offset: 1, color: '#1e6ceb' }
                    ])
                },
                label: { show: true, position: 'top', color: '#1e6ceb' }
            }]
        });

        // 3. 折线图：报警次数时间变化趋势
        const cLine = echarts.init(document.getElementById('chart-line'));
        chartInstances['chartLine'] = cLine;
        charts.push(cLine);
        renderLineChart('全部'); // 初始渲染全部

        // 4. 排名图（横向滚动）
        const cRank = echarts.init(document.getElementById('chart-rank'));
        chartInstances['chartRank'] = cRank;
        charts.push(cRank);
        cRank.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: 'rgba(255,255,255,0.95)' },
            grid: { top: 10, bottom: 10, left: 10, right: 40, containLabel: true },
            xAxis: { type: 'value', show: false },
            yAxis: {
                type: 'category', inverse: true,
                data: ['武汉市', '宜昌市', '襄阳市', '荆州市', '黄冈市', '孝感市', '黄石市', '十堰市', '荆门市', '咸宁市', '随州市', '鄂州市', '恩施州', '仙桃市', '潜江市', '天门市', '神农架'],
                axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: textCol, fontWeight: 500, fontSize: 12 }
            },
            dataZoom: [
                { type: 'slider', yAxisIndex: 0, width: 8, right: 10, top: 10, bottom: 10, start: 0, end: 40, handleSize: 0, showDetail: false, borderColor: 'transparent', backgroundColor: '#f1f5f9', fillerColor: '#cbd5e1' },
                { type: 'inside', yAxisIndex: 0, start: 0, end: 40 }
            ],
            series: [{
                name: '报警次数', type: 'bar', barWidth: 14,
                data: [170, 55, 50, 32, 29, 26, 21, 20, 19, 17, 14, 12, 11, 9, 8, 8, 4],
                label: { show: true, position: 'right', color: textCol },
                itemStyle: {
                    borderRadius: [0, 4, 4, 0],
                    color: function(params) {
                        const colorList = ['#ef4444', '#f97316', '#f59e0b', '#10b981'];
                        return colorList[params.dataIndex] || '#10b981';
                    }
                },
                showBackground: true, backgroundStyle: { color: '#f8fafc', borderRadius: [0, 4, 4, 0] }
            }]
        });
    }

    // 切换折线图数据
    function switchTrendData(type, btnObj) {
        // 更新按钮 UI
        const container = document.getElementById('trend-toggles');
        const btns = container.querySelectorAll('button');
        btns.forEach(b => { b.classList.remove('active'); b.classList.add('inactive'); });
        btnObj.classList.remove('inactive'); btnObj.classList.add('active');

        // 更新图表
        renderLineChart(type);
    }

    function renderLineChart(type) {
        const chart = chartInstances['chartLine'];
        let data = [];
        for (let i = 0; i < 15; i++) {
            let base = type === '全部' ? 15 : 5;
            data.push(Math.floor(Math.random() * 10 + base));
        }
        const dates = Array.from({length: 15}, (_, i) => `12-${i + 8}`);

        // 颜色映射配置：与左侧饼图色系保持一致
        const colorMap = {
            '全部': { hex: '#8b5cf6', rgb: '139, 92, 246' }, // 紫色
            'COD': { hex: '#3b82f6', rgb: '59, 130, 246' },  // 蓝色
            '氨氮': { hex: '#10b981', rgb: '16, 185, 129' },   // 翠绿色
            '总磷': { hex: '#f59e0b', rgb: '245, 158, 11' },   // 琥珀色
            '总氮': { hex: '#ef4444', rgb: '239, 68, 68' }     // 红色
        };

        const themeColor = colorMap[type] || colorMap['全部'];

        chart.setOption({
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(255,255,255,0.95)', extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);' },
            grid: { top: 35, bottom: 25, left: 40, right: 20, containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: dates, axisLine: { lineStyle: { color: axisLineColor } }, axisLabel: { color: textCol } },
            yAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed', color: '#f1f5f9' } }, axisLabel: { color: textCol } },
            series: [{
                name: type + '报警数',
                type: 'line',
                smooth: true,
                showSymbol: false,
                itemStyle: { color: themeColor.hex },
                lineStyle: { width: 3, color: themeColor.hex },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: `rgba(${themeColor.rgb}, 0.3)` },
                        { offset: 1, color: `rgba(${themeColor.rgb}, 0.0)` }
                    ])
                },
                data: data
            }]
        });
    }

    // === 表格展示逻辑 ===
    function showChartData(chartKey, titleText) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const option = chart.getOption();

        document.getElementById('modal-title').innerText = titleText;
        const thead = document.getElementById('modal-thead');
        const tbody = document.getElementById('modal-tbody');

        let theadHTML = '';
        let tbodyHTML = '';

        // 特殊处理饼图
        if (option.series[0].type === 'pie') {
            const data = option.series[0].data;
            theadHTML = `<tr>
                <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
                <th class="px-6 py-4 font-bold w-48">污染因子</th>
                <th class="px-6 py-4 font-bold">占比值 (%)</th>
            </tr>`;
            data.forEach((item, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white' : 'bg-[#fcfcfc]';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700">${item.name}</td>
                    <td class="px-6 py-4">${item.value}</td>
                </tr>`;
            });
        }
        // 柱状图/折线图通用处理
        else {
            let categories = option.xAxis[0]?.data || option.yAxis[0]?.data || []; // 适配横向柱状图
            let rowHeaderName = chartKey === 'chartLine' ? '日期' : '类目';
            if (chartKey === 'chartRank') rowHeaderName = '地市';

            theadHTML = `<tr>
                <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
                <th class="px-6 py-4 font-bold w-48">${rowHeaderName}</th>`;
            option.series.forEach(s => { theadHTML += `<th class="px-6 py-4 font-bold">${s.name}</th>`; });
            theadHTML += '</tr>';

            categories.forEach((cat, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white' : 'bg-[#fcfcfc]';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700">${cat}</td>`;
                option.series.forEach(s => {
                    const val = (s.data[idx] !== undefined && s.data[idx] !== null) ? s.data[idx] : '-';
                    tbodyHTML += `<td class="px-6 py-4">${val}</td>`;
                });
                tbodyHTML += '</tr>';
            });
        }

        thead.innerHTML = theadHTML;
        tbody.innerHTML = tbodyHTML;

        const modal = document.getElementById('data-table-modal');
        modal.classList.remove('hidden');
        void modal.offsetWidth;
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    }

    function exportExcel() {
        const table = document.querySelector('#data-table-modal table');
        if (!table) return;
        let csv = [];
        const rows = table.querySelectorAll('tr');
        for (let i = 0; i < rows.length; i++) {
            let row = [];
            const cols = rows[i].querySelectorAll('td, th');
            for (let j = 0; j < cols.length; j++) {
                let data = cols[j].innerText.trim();
                if (i === 0 && j === 0 && data === "") data = "序号";
                data = data.replace(/"/g, '""');
                row.push('"' + data + '"');
            }
            csv.push(row.join(','));
        }
        const csvFile = new Blob(['\uFEFF' + csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement("a");
        downloadLink.download = (document.getElementById('modal-title').innerText || '导出数据') + ".csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function closeModal() {
        const modal = document.getElementById('data-table-modal');
        modal.classList.add('opacity-0');
        modal.querySelector('div').classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    function downloadChart(chartKey) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
        const a = document.createElement('a');
        a.href = url;
        a.download = chartKey + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function resizeAllCharts() { charts.forEach(chart => { if (chart) chart.resize(); }); }

    // 初始化调用
    window.addEventListener('load', () => {
        initCharts();
    });
    window.addEventListener('resize', resizeAllCharts);
</script>

</body>
</html>
