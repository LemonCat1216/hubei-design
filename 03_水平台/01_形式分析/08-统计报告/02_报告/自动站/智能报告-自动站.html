<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <title>湖北省地表水水质自动站实时形势分析日报</title>
    <style>
        /* ================= 基础公文样式设定 ================= */
        :root {
            --a4-portrait-width: 210mm;
            --a4-portrait-height: 297mm;
            --a4-landscape-width: 297mm;
            --a4-landscape-height: 210mm;
            --portrait-padding-y: 25mm;
            --portrait-padding-x: 22mm;
            --landscape-padding-y: 22mm;
            --landscape-padding-x: 25mm;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background-color: #525659;
        }

        body {
            font-family: "FangSong", "仿宋", "SimSun", "宋体", serif;
            font-size: 16pt;
            line-height: 1.8;
            color: #000;
            background-color: #525659;
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .export-module {
            position: fixed;
            right: 30px;
            top: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
        }
        .export-actions {
            display: flex;
            gap: 8px;
        }
        .export-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            font-family: "SimHei", sans-serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            background-color: #c9302c;
            transform: translateY(-2px);
        }
        .export-btn:disabled {
            background-color: #777;
            cursor: not-allowed;
            transform: none;
        }
        .word-export-btn {
            background-color: #2f7d32;
        }
        .word-export-btn:hover {
            background-color: #256d28;
        }
        .word-export-btn:disabled {
            background-color: #777;
        }
        .export-tip {
            margin-top: 8px;
            color: #fff;
            font-size: 12px;
            font-family: sans-serif;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            text-align: right;
            max-width: 200px;
        }

        .document-container {
            background-color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .portrait-page {
            width: var(--a4-portrait-width);
            height: var(--a4-portrait-height);
            padding: var(--portrait-padding-y) var(--portrait-padding-x);
        }

        .landscape-page {
            width: var(--a4-landscape-width);
            height: var(--a4-landscape-height);
            padding: var(--landscape-padding-y) var(--landscape-padding-x);
        }

        @media print {
            html {
                background: #fff;
            }
            body {
                background-color: transparent;
                padding: 0;
                gap: 0;
                display: block;
            }
            .export-module, .print-tip {
                display: none !important;
            }
            .document-container {
                box-shadow: none;
                margin: 0;
                overflow: hidden !important;
                break-after: page;
                page-break-after: always;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .document-container:last-of-type {
                break-after: auto;
                page-break-after: auto;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
            @page portrait_layout {
                size: A4 portrait;
                margin: 0;
            }
            @page landscape_layout {
                size: A4 landscape;
                margin: 0;
            }

            .portrait-page {
                page: portrait_layout;
                width: var(--a4-portrait-width) !important;
                height: var(--a4-portrait-height) !important;
                padding: var(--portrait-padding-y) var(--portrait-padding-x) !important;
            }

            .landscape-page {
                page: landscape_layout;
                width: var(--a4-landscape-width) !important;
                height: var(--a4-landscape-height) !important;
                padding: var(--landscape-padding-y) var(--landscape-padding-x) !important;
            }
        }

        .header-title {
            color: red;
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 32pt;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .header-line {
            border-top: 2px solid red;
            margin-bottom: 30px;
        }
        .report-info {
            text-align: center;
            font-family: "Kaiti", "楷体", serif;
            font-size: 16pt;
            margin-bottom: 30px;
        }

        h1 {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 22pt;
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 18pt;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        h3 {
            font-family: "Kaiti", "楷体", serif;
            font-size: 16pt;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }

        p {
            text-indent: 2em;
            margin-bottom: 1em;
            text-align: justify;
        }
        .highlight {
            font-weight: bold;
            font-family: "SimHei", "黑体", sans-serif;
        }

        .table-title {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 16pt;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12pt;
            font-family: "SimSun", "宋体", serif;
            margin-bottom: 35px;
            table-layout: auto;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px 6px;
            text-align: center;
            vertical-align: middle;
            word-wrap: break-word;
        }
        th {
            font-weight: bold;
            font-family: "SimHei", "黑体", sans-serif;
            background-color: #f5f5f5;
        }

        .level-1 { background-color: #ccffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .level-2 { background-color: #00ccff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .level-3 { background-color: #00ff00 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .level-4 { background-color: #ffff00 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .level-5 { background-color: #ff9900 !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .level-bad-5 { background-color: #ff0000 !important; color: white; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

        .note {
            font-size: 12pt;
            font-family: "Kaiti", "楷体", serif;
            color: #333;
            text-indent: 0;
            text-align: left;
            margin-top: -20px;
        }
        h2, h3, .table-title {
            break-after: avoid;
            page-break-after: avoid;
        }
        p {
            orphans: 2;
            widows: 2;
        }
        table {
            break-inside: auto;
            page-break-inside: auto;
        }
        thead {
            display: table-header-group;
        }
        tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .mini-panel {
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            padding: 10px 12px;
            margin: 12px 0 18px;
            font-family: "SimSun", "宋体", serif;
        }
        .mini-title {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 12pt;
            margin: 4px 0 6px;
        }
        .quality-strip {
            display: flex;
            width: 100%;
            min-height: 24px;
            margin-bottom: 8px;
            border: 1px solid #999;
            overflow: hidden;
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 10pt;
            line-height: 24px;
            text-align: center;
        }
        .quality-strip span {
            display: block;
            min-width: 58px;
            white-space: nowrap;
            border-right: 1px solid rgba(0,0,0,0.25);
        }
        .quality-strip span:last-child { border-right: 0; }
        .level-none { background-color: #e9ecef !important; color: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .report-table { font-size: 9.5pt; line-height: 1.35; }
        .data-table { font-size: 7.8pt; line-height: 1.2; }
        .missing-table { font-size: 9pt; line-height: 1.3; }
        .continuous-table { font-size: 9pt; line-height: 1.3; }
        .focus-table { font-size: 9pt; line-height: 1.3; }
        .factor-chart, .mini-bar-chart { display: grid; gap: 5px; font-family: "SimHei", "黑体", sans-serif; font-size: 10pt; }
        .factor-row, .mini-bar-row { display: grid; grid-template-columns: 96px 1fr 28px; gap: 8px; align-items: center; }
        .factor-row span, .mini-bar-row span { text-align: right; white-space: nowrap; }
        .factor-row b, .mini-bar-row b { height: 12px; border: 1px solid #999; background: #f2f2f2; display: block; }
        .factor-row i, .mini-bar-row i { height: 100%; display: block; background: #d9534f; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .factor-row em, .mini-bar-row em { font-style: normal; }
        .calendar-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 8px 0 14px; }
        .calendar-card { border: 1px solid #999; padding: 7px; break-inside: avoid; page-break-inside: avoid; }
        .calendar-title { font-family: "SimHei", "黑体", sans-serif; font-size: 10pt; font-weight: bold; margin-bottom: 5px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
        .cal-day { border: 1px solid #c8c8c8; text-align: center; font-size: 8pt; line-height: 16px; background: #f7f7f7; }
        .mini-bar-chart { display: grid; gap: 5px; font-family: "SimHei", "黑体", sans-serif; font-size: 10pt; }
        .mini-bar-row { display: grid; grid-template-columns: 74px 1fr 28px; gap: 8px; align-items: center; }
        .mini-bar-row span { text-align: right; white-space: nowrap; }
        .mini-bar-row b { height: 12px; border: 1px solid #999; background: #f2f2f2; display: block; }
        .mini-bar-row i { height: 100%; display: block; background: #d9534f; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .mini-bar-row em { font-style: normal; }
        .report-table th, .report-table td, .data-table th, .data-table td, .missing-table th, .missing-table td, .continuous-table th, .continuous-table td, .focus-table th, .focus-table td { padding: 5px 3px; }

    </style>
</head>
<body>

<div class="export-module">
    <div class="export-actions">
        <button class="export-btn" id="exportPdfBtn" type="button">PDF 导出</button>
        <button class="export-btn word-export-btn" id="exportWordBtn" type="button">Word 导出</button>
    </div>
    <div class="export-tip">PDF 可点击按钮使用浏览器导出，也可运行本目录 export-wysiwyg-pdf.mjs 外部脚本导出；Word 可直接下载 .doc 文件。</div>
</div>

<div class="document-container portrait-page" id="page1"></div>
<div class="document-container portrait-page" id="page2"></div>
<div class="document-container landscape-page" id="page3"></div>

<script src="report-data.js"></script>
<script>
(function() {
  var R = window.__REPORT_DATA__;
  if (!R) return;

  var levelClass = function(lv) {
    if (lv === 1) return 'level-1';
    if (lv === 2) return 'level-2';
    if (lv === 3) return 'level-3';
    if (lv === 4) return 'level-4';
    if (lv === 5) return 'level-5';
    if (lv === 'bad-5') return 'level-bad-5';
    return '';
  };
  var esc = function(s) { return String(s == null ? '' : s); };
  var tr = function(cells, cls) { return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + cells.join('') + '</tr>'; };
  var td = function(content, cls) { return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(content) + '</td>'; };
  var th = function(content, attrs) { return '<th' + (attrs || '') + '>' + esc(content) + '</th>'; };

  function renderQualityStrip(items, total) {
    var spans = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var pct = total > 0 ? (it.count / total * 100).toFixed(2) : '0';
      spans.push('<span class="' + levelClass(it.level) + '" style="width:' + pct + '%">' + esc(it.cls) + ' ' + it.count + '</span>');
    }
    return '<div class="quality-strip">' + spans.join('') + '</div>';
  }

  function renderFactorChart(factors) {
    var max = factors[0] ? factors[0].count : 1;
    var rows = [];
    for (var i = 0; i < factors.length; i++) {
      var f = factors[i];
      var pct = (f.count / max * 100).toFixed(2);
      rows.push('<div class="factor-row"><span>' + esc(f.name) + '</span><b><i style="width:' + pct + '%"></i></b><em>' + f.count + '</em></div>');
    }
    return '<div class="factor-chart">' + rows.join('') + '</div>';
  }

  function renderCalendarCards(items) {
    var cards = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var days = [];
      for (var j = 0; j < it.calendar.length; j++) {
        var d = it.calendar[j];
        var cls = d.level ? levelClass(d.level) : '';
        days.push('<span class="cal-day ' + cls + '">' + d.day + '</span>');
      }
      cards.push('<div class="calendar-card"><div class="calendar-title">' + (i + 1) + '. ' + esc(it.name) + '（' + esc(it.city) + '）近30天超标' + it.exceedDays + '天</div><div class="calendar-grid">' + days.join('') + '</div></div>');
    }
    return '<div class="calendar-panel">' + cards.join('') + '</div>';
  }

  function renderContinuousSection(items) {
    var parts = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      parts.push('<p><span class="highlight">' + esc(it.name) + '：</span>' + esc(it.city) + '，<span class="highlight">连续' + it.days + '天不达标</span>。</p>');
      var rows = [];
      for (var j = 0; j < it.detail.length; j++) {
        var d = it.detail[j];
        rows.push(tr([td(d.date), td(d.cls, levelClass(d.level)), td(d.target, levelClass(d.targetLevel)), td(d.compliant), td(d.pollutant)]));
      }
      parts.push('<table class="continuous-table"><thead>' + tr([th('日期'), th('水质类别'), th('水质目标'), th('是否达标'), th('主要污染指标')]) + '</thead><tbody>' + rows.join('') + '</tbody></table>');
    }
    return parts.join('');
  }

  function renderCityParagraphs(cities) {
    var parts = [];
    for (var i = 0; i < cities.length; i++) {
      var c = cities[i];
      if (c.isSpecial) {
        var subs = [];
        for (var j = 0; j < c.subCities.length; j++) {
          var sc = c.subCities[j];
          subs.push(esc(sc.name) + sc.provincialCount + '条、不达标' + sc.nonCompliantCount + '条');
        }
        parts.push('<p><span class="highlight">省直管县市及林区：</span>' + subs.join('；') + '。</p>');
      } else {
        var stationDescs = [];
        for (var j = 0; j < c.stations.length; j++) {
          var s = c.stations[j];
          if (s.highlight) {
            stationDescs.push('<span class="highlight">' + esc(s.name) + '（' + esc(s.cls) + '）</span>');
          } else {
            stationDescs.push(esc(s.name) + '（' + esc(s.cls) + '）');
          }
        }
        var class5Part = c.class5Count > 0 ? '，其中<span class="highlight">Ⅴ类及劣Ⅴ类' + c.class5Count + '条</span>' : '，其中Ⅴ类及劣Ⅴ类0条';
        parts.push('<p><span class="highlight">' + esc(c.name) + '：</span>国控自动站' + c.nationalCount + '个；省控自动站' + c.provincialCount + '条，优良' + c.goodCount + '条，<span class="highlight">不达标' + c.nonCompliantCount + '条</span>' + class5Part + '，涉及' + stationDescs.join('、') + '。</p>');
      }
    }
    return parts.join('');
  }

  function renderReportTable(rows) {
    var bodyRows = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      bodyRows.push(tr([td(r.seq), td(r.river), td(r.attr), td(r.name), td(r.city), td(r.dailyClass, levelClass(r.dailyLevel)), td(r.dailyChange), td(r.dailyFactors), td(r.monthlyClass, levelClass(r.monthlyLevel)), td(r.monthlyFactors), td(r.target, levelClass(r.targetLevel))]));
    }
    return '<table class="report-table"><thead>' + tr([th('序号', ' rowspan="2"'), th('所在河流', ' rowspan="2"'), th('自动站属性', ' rowspan="2"'), th('点位名称', ' rowspan="2"'), th('责任城市', ' rowspan="2"'), th('当日', ' colspan="3"'), th('本月累计', ' colspan="2"'), th('十四五考核<br>目标', ' rowspan="2"')]) + tr([th('水质类别'), th('环比变化'), th('主要超标项目'), th('水质类别'), th('主要超标项目')]) + '</thead><tbody>' + bodyRows.join('') + '</tbody></table>';
  }

  function renderDataTable(rows, isCompliant) {
    var dateCol = isCompliant ? th('监测时间') : '';
    var headerCells = [th('序号'), th('自动站名称'), th('所在地市')];
    if (isCompliant) headerCells.push(dateCol);
    headerCells.push(th('水质类别'), th('水质目标'), th('是否达标'), th('溶解氧'), th('总氮(mg/L)'), th('电导率'), th('总磷(mg/L)'), th('水温'), th('高锰酸盐指数(mg/L)'), th('PH值'), th('浊度'), th('氨氮(mg/L)'), th('超标因子'));
    var bodyRows = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var cells = [td(r.seq), td(r.name), td(r.city)];
      if (isCompliant) cells.push(td(r.date));
      cells.push(td(r.cls, levelClass(r.level)), td(r.target, levelClass(r.targetLevel)), td(r.compliant), td(r["do"]), td(r.tn), td(r.cond), td(r.tp), td(r.temp), td(r.codmn), td(r.ph), td(r.turb), td(r.nh3n), td(r.factors));
      bodyRows.push(tr(cells));
    }
    return '<table class="data-table"><thead><tr>' + headerCells.join('') + '</tr></thead><tbody>' + bodyRows.join('') + '</tbody></table>';
  }

  function renderNoDataTable(rows) {
    var bodyRows = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      bodyRows.push(tr([td(r.seq), td(r.source), td(r.station), td(r.city), td(r.target), td(r.date), td(r.note)]));
    }
    return '<table class="missing-table"><thead>' + tr([th('序号'), th('数据来源'), th('自动站/断面名称'), th('责任地市'), th('水质目标'), th('监测时间'), th('无数据说明')]) + '</thead><tbody>' + bodyRows.join('') + '</tbody></table>';
  }

  var page1 = document.getElementById('page1');
  var page2 = document.getElementById('page2');
  var page3 = document.getElementById('page3');
  if (!page1 || !page2 || !page3) return;
  var s = R.summary, nat = s.national, prov = s.provincial, qd = R.qualityDist;

  page1.innerHTML =
    '<div class="header-title">湖北省水生态环境综合管理系统</div>' +
    '<div class="header-line"></div>' +
    '<h1>湖北省地表水水质自动站实时形势分析日报</h1>' +
    '<div class="report-info"><span>数据日期：' + esc(R.meta.reportDate) + '</span></div>' +
    '<h2>一、 总体情况</h2>' +
    '<p>' + esc(R.meta.reportDate) + '，国控、省控自动站共收集有效数据' + s.totalValid + '条，无监测数据自动站' + s.noData + '条。<span class="highlight">本日超标自动站' + s.dailyExceed + '个，本月累计超标自动站' + s.monthlyExceed + '个</span>。</p>' +
    '<p>其中，国控自动站' + nat.total + '个，达标' + nat.compliant + '条、<span class="highlight">不达标' + nat.nonCompliant + '条</span>，Ⅰ-Ⅲ类水质' + nat.class1to3 + '个，占比' + nat.ratio1to3 + '%，<span class="highlight">环比下降' + nat.declined + '个</span>、好转' + nat.improved + '个，<span class="highlight">主要污染指标为' + nat.mainPollutants + '</span>；省控自动站' + prov.total + '个，达标' + prov.compliant + '条、<span class="highlight">不达标' + prov.nonCompliant + '条</span>，Ⅰ-Ⅲ类水质' + prov.class1to3 + '条，占比' + prov.ratio1to3 + '%，<span class="highlight">环比下降' + prov.declined + '个</span>、好转' + prov.improved + '个，<span class="highlight">主要污染指标为' + prov.mainPollutants + '</span>。</p>' +
    '<div class="mini-panel"><div class="mini-title">国控自动站水质分布</div>' + renderQualityStrip(qd.national, nat.total) + '<div class="mini-title">省控自动站水质分布</div>' + renderQualityStrip(qd.provincial, prov.total) + '</div>' +
    '<p><span class="highlight">超标因子：</span>' + esc(R.pollutionFactors.description) + '</p>' +
    '<div class="mini-panel"><div class="mini-title">主要污染指标出现次数</div>' + renderFactorChart(R.pollutionFactors.factors) + '</div>' +
    '<h2>二、 需重点关注自动站</h2>' +
    '<h3>2.1 Ⅴ类及劣Ⅴ类自动站</h3>' +
    '<p>省控自动站中<span class="highlight">Ⅴ类及劣Ⅴ类不达标记录' + R.focusClass5.count + '条</span>，<span class="highlight">需优先关注</span>。</p>' +
    (function() {
      var rows = [], sts = R.focusClass5.stations;
      for (var i = 0; i < sts.length; i++) {
        var st = sts[i];
        rows.push(tr([td(i + 1), td(st.name), td(st.city), td(st.cls, levelClass(st.level)), td(st.target, levelClass(st.targetLevel)), td(st.factors)]));
      }
      return '<table class="focus-table"><thead>' + tr([th('序号'), th('自动站名称'), th('所在地市'), th('水质类别'), th('水质目标'), th('超标因子')]) + '</thead><tbody>' + rows.join('') + '</tbody></table>';
    })() +
    '<h3>2.2 近30天超标超过5天断面</h3>' +
    '<p>近30天超标超过5天断面按月历形式展示，着色日期表示超标日，颜色对应当日水质类别。</p>' +
    renderCalendarCards(R.calendarExceed) +
    '<h3>2.3 连续不达标断面</h3>' +
    '<p>选取<span class="highlight">连续不达标自动站5个</span>进行重点展示，按连续天数从高到低排序。</p>' +
    renderContinuousSection(R.continuousNonCompliance);

  page2.innerHTML = '<h2>三、 各地市水质情况</h2>' + renderCityParagraphs(R.cities);

  page3.innerHTML =
    '<h1>附表及数据明细</h1>' +
    '<div class="table-title">附表1：超标自动站报表</div>' + renderReportTable(R.exceedReport) +
    '<div class="table-title">附表2：超标自动站数据表</div>' + renderDataTable(R.exceedData, false) +
    '<div class="table-title">附表3：未超标自动站报表</div>' + renderReportTable(R.compliantReport) +
    '<div class="table-title">附表4：未超标自动站数据表</div>' + renderDataTable(R.compliantData, true) +
    '<div class="table-title">附表5：无监测数据自动站表</div>' + renderNoDataTable(R.noData) +
    '<p class="note">' + esc(R.note) + '</p>';
})();
</script>
<script>
    (function () {
        var isPaginating = false;
        var originalPages = [];

        function collectOriginalPages() {
            if (originalPages.length) {
                return;
            }
            originalPages = Array.prototype.map.call(document.querySelectorAll('.document-container'), function (page) {
                return {
                    orientation: page.classList.contains('landscape-page') ? 'landscape' : 'portrait',
                    html: page.innerHTML
                };
            });
        }

        function createPage(orientation) {
            var page = document.createElement('div');
            page.className = 'document-container ' + (orientation === 'landscape' ? 'landscape-page' : 'portrait-page');
            return page;
        }

        function getPages() {
            return Array.prototype.slice.call(document.querySelectorAll('.document-container'));
        }

        function overflows(page) {
            return page.scrollHeight > page.clientHeight + 1;
        }

        function removeEmptyPage(page) {
            if (!page || page.childNodes.length) {
                return;
            }
            page.parentNode.removeChild(page);
        }

        function appendPageAfter(currentPage, orientation) {
            var nextPage = createPage(orientation);
            currentPage.parentNode.insertBefore(nextPage, currentPage.nextSibling);
            return nextPage;
        }

        function cloneTableShell(table) {
            var clone = table.cloneNode(false);
            var thead = table.querySelector('thead');
            var tbody = document.createElement('tbody');
            if (thead) {
                clone.appendChild(thead.cloneNode(true));
            }
            clone.appendChild(tbody);
            return clone;
        }

        function appendTableInChunks(page, table, title) {
            var orientation = page.classList.contains('landscape-page') ? 'landscape' : 'portrait';
            var rows = Array.prototype.slice.call(table.querySelectorAll('tbody > tr'));
            var shell = cloneTableShell(table);
            var currentPage = page;
            var currentTable = shell;
            var currentBody = currentTable.querySelector('tbody');
            var titleNode = title ? title.cloneNode(true) : null;

            if (titleNode) {
                currentPage.appendChild(titleNode);
                if (overflows(currentPage)) {
                    currentPage.removeChild(titleNode);
                    currentPage = appendPageAfter(currentPage, orientation);
                    currentPage.appendChild(titleNode);
                }
            }
            currentPage.appendChild(currentTable);

            rows.forEach(function (row) {
                currentBody.appendChild(row.cloneNode(true));
                if (overflows(currentPage)) {
                    currentBody.removeChild(currentBody.lastChild);
                    if (!currentBody.children.length) {
                        currentPage.removeChild(currentTable);
                        if (titleNode && titleNode.parentNode === currentPage) {
                            currentPage.removeChild(titleNode);
                        }
                    }
                    currentPage = appendPageAfter(currentPage, orientation);
                    if (titleNode && !titleNode.parentNode) {
                        currentPage.appendChild(titleNode);
                    }
                    currentTable = cloneTableShell(table);
                    currentBody = currentTable.querySelector('tbody');
                    currentPage.appendChild(currentTable);
                    currentBody.appendChild(row.cloneNode(true));
                }
            });

            return currentPage;
        }

        function appendBlock(page, block) {
            var orientation = page.classList.contains('landscape-page') ? 'landscape' : 'portrait';
            if (block.tagName && block.tagName.toLowerCase() === 'table') {
                return appendTableInChunks(page, block);
            }

            page.appendChild(block.cloneNode(true));
            if (!overflows(page)) {
                return page;
            }

            page.removeChild(page.lastChild);
            var nextPage = appendPageAfter(page, orientation);
            nextPage.appendChild(block.cloneNode(true));
            return nextPage;
        }

        function paginateGroup(groupPages) {
            var firstPage = groupPages[0];
            var orientation = firstPage.orientation;
            var currentPage = createPage(orientation);
            var source = document.createElement('div');

            groupPages.forEach(function (page) {
                var wrapper = document.createElement('div');
                wrapper.innerHTML = page.html;
                Array.prototype.slice.call(wrapper.children).forEach(function (child) {
                    source.appendChild(child);
                });
            });

            document.body.appendChild(currentPage);
            var children = Array.prototype.slice.call(source.children);
            for (var i = 0; i < children.length; i++) {
                var child = children[i];
                var nextChild = children[i + 1];
                if (child.classList && child.classList.contains('table-title') && nextChild && nextChild.tagName && nextChild.tagName.toLowerCase() === 'table') {
                    currentPage = appendTableInChunks(currentPage, nextChild, child);
                    i++;
                } else {
                    currentPage = appendBlock(currentPage, child);
                }
            }
            removeEmptyPage(currentPage);
        }

        function paginate() {
            if (isPaginating) {
                return;
            }
            window.__reportPaginationReady = false;
            isPaginating = true;
            collectOriginalPages();
            getPages().forEach(function (page) {
                page.parentNode.removeChild(page);
            });

            var group = [];
            originalPages.forEach(function (page) {
                if (group.length && group[group.length - 1].orientation !== page.orientation) {
                    paginateGroup(group);
                    group = [];
                }
                group.push(page);
            });
            if (group.length) {
                paginateGroup(group);
            }
            isPaginating = false;
            window.__reportPaginationReady = true;
            window.__reportPageCount = getPages().length;
        }

        window.__reportPaginate = paginate;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', paginate);
        } else {
            paginate();
        }
        window.addEventListener('beforeprint', paginate);
        window.addEventListener('resize', function () {
            window.clearTimeout(window.__reportPaginateTimer);
            window.__reportPaginateTimer = window.setTimeout(paginate, 150);
        });
    }());
</script>
<script>
    (function () {
        var exportPdfBtn = document.getElementById('exportPdfBtn');
        if (!exportPdfBtn) {
            return;
        }

        exportPdfBtn.addEventListener('click', function () {
            exportPdfBtn.disabled = true;
            var originalText = exportPdfBtn.textContent;
            exportPdfBtn.textContent = '正在导出...';

            try {
                if (typeof window.__reportPaginate === 'function') {
                    window.__reportPaginate();
                }
                window.setTimeout(function () {
                    exportPdfBtn.disabled = false;
                    exportPdfBtn.textContent = originalText;
                    window.print();
                }, 80);
            } catch (error) {
                exportPdfBtn.disabled = false;
                exportPdfBtn.textContent = originalText;
                window.print();
            }
        });
    }());
</script>
<script>
    (function () {
        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function collectStyles() {
            return Array.prototype.map.call(document.querySelectorAll('style'), function (style) {
                return style.textContent || '';
            }).join('\n');
        }

        function getWordSectionClass(page, index, pages) {
            var orientation = page.classList.contains('landscape-page') ? 'landscape' : 'portrait';
            var isLast = index === pages.length - 1;
            return 'word-page word-' + orientation + (isLast ? ' word-last' : '');
        }

        function buildWordHtml() {
            if (typeof window.__reportPaginate === 'function') {
                window.__reportPaginate();
            }

            var title = document.title || '智能报告-自动站';
            var pages = Array.prototype.slice.call(document.querySelectorAll('.document-container'));
            var bodyHtml = pages.map(function (page, index) {
                return '<div class="' + getWordSectionClass(page, index, pages) + '">' + page.innerHTML + '</div>';
            }).join('\n');
            var sourceStyles = collectStyles();
            var wordStyles = [
                '@page WordPortrait { size: 210mm 297mm; margin: 25mm 22mm 25mm 22mm; }',
                '@page WordLandscape { size: 297mm 210mm; margin: 22mm 25mm 22mm 25mm; }',
                'html, body { background: #fff !important; margin: 0; padding: 0; display: block; }',
                '.export-module { display: none !important; }',
                '.word-page { background: #fff !important; box-shadow: none !important; overflow: visible !important; box-sizing: border-box; }',
                '.word-portrait { page: WordPortrait; width: auto !important; min-height: auto !important; height: auto !important; padding: 0 !important; mso-page-orientation: portrait; }',
                '.word-landscape { page: WordLandscape; width: auto !important; min-height: auto !important; height: auto !important; padding: 0 !important; mso-page-orientation: landscape; }',
                '.word-page:not(.word-last) { page-break-after: always; }',
                'table { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }',
                'thead { display: table-header-group; }',
                'tr { page-break-inside: avoid; }'
            ].join('\n');

            return [
                '<!DOCTYPE html>',
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">',
                '<head>',
                '<meta charset="utf-8">',
                '<meta name="ProgId" content="Word.Document">',
                '<meta name="Generator" content="Microsoft Word">',
                '<meta name="Originator" content="Microsoft Word">',
                '<title>' + escapeHtml(title) + '</title>',
                '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->',
                '<style>',
                sourceStyles,
                wordStyles,
                '</style>',
                '</head>',
                '<body>',
                bodyHtml,
                '</body>',
                '</html>'
            ].join('\n');
        }

        function downloadWord() {
            var button = document.getElementById('exportWordBtn');
            if (button) {
                button.disabled = true;
                button.textContent = '正在导出...';
            }

            try {
                var title = (document.title || '智能报告-自动站').replace(/[\\/:*?"<>|]/g, '_');
                var html = buildWordHtml();
                var blob = new Blob(['﻿', html], { type: 'application/msword;charset=utf-8' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = title + '.doc';
                document.body.appendChild(link);
                link.click();
                window.setTimeout(function () {
                    URL.revokeObjectURL(link.href);
                    link.parentNode.removeChild(link);
                }, 0);
            } finally {
                if (button) {
                    window.setTimeout(function () {
                        button.disabled = false;
                        button.textContent = 'Word 导出';
                    }, 300);
                }
            }
        }

        var exportWordBtn = document.getElementById('exportWordBtn');
        if (exportWordBtn) {
            exportWordBtn.addEventListener('click', downloadWord);
        }
    }());
</script>
