    // 分页：每页10条
    const rowsPerPage = 10;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.getElementById('opinion-table-body');
        let html = '';

            html += `
            <tr class="hover:bg-blue-50/50 transition-colors border-b border-slate-50 dark:border-slate-700/50">
                <td class="text-center font-bold text-slate-500">${index + 1}</td>
                <td class="font-medium text-slate-700 dark:text-slate-300">${item.name}</td>

    function initPagination() {
        renderTable();
        document.getElementById('total-items').innerText = mockOpinionData.length;
        displayPage(1);
    }

    function displayPage(page) {
        const tbody = document.getElementById('opinion-table-body');
        const rows = Array.from(tbody.getElementsByTagName('tr'));
        const totalPages = Math.ceil(rows.length / rowsPerPage);

        if(page < 1) page = 1;
        if(page > totalPages) page = totalPages;
        currentPage = page;

        rows.forEach((row, index) => {
            if (index >= (page - 1) * rowsPerPage && index < page * rowsPerPage) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
        updatePaginationUI(totalPages);
    }

    function updatePaginationUI(totalPages) {
        const paginationContainer = document.getElementById('pagination-controls');
        let html = '';

        const prevDisabled = currentPage === 1;
        html += `<button onclick="displayPage(${currentPage - 1})" ${prevDisabled ? 'disabled' : ''} class="px-3 py-1.5 text-[13px] border border-slate-200 dark:border-slate-700 rounded-md transition-colors ${prevDisabled ? 'text-slate-400 bg-slate-50 cursor-not-allowed dark:bg-slate-800' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-600 dark:text-slate-300 dark:hover:bg-slate-700'}">上一页</button>`;

        for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
                html += `<button onclick="displayPage(${i})" class="px-3 py-1.5 text-[13px] border border-blue-500 bg-blue-500 text-white rounded-md">${i}</button>`;
            } else {
                html += `<button onclick="displayPage(${i})" class="px-3 py-1.5 text-[13px] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700 transition-colors">${i}</button>`;
            }
        }

        const nextDisabled = currentPage === totalPages;
        html += `<button onclick="displayPage(${currentPage + 1})" ${nextDisabled ? 'disabled' : ''} class="px-3 py-1.5 text-[13px] border border-slate-200 dark:border-slate-700 rounded-md transition-colors ${nextDisabled ? 'text-slate-400 bg-slate-50 cursor-not-allowed dark:bg-slate-800' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-600 dark:text-slate-300 dark:hover:bg-slate-700'}">下一页</button>`;

        paginationContainer.innerHTML = html;
    }

    // --- ECharts 图表初始化与功能 ---

        extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px;'

            {value: 1, name: '黄鹤云'}

        // 从大到小排序
        platformDataRaw.sort((a, b) => b.value - a.value);

        const c2 = echarts.init(document.getElementById('chart-platform-dist'));
        chartInstances['chartPlatformDist'] = c2;
        charts.push(c2);

        c2.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { top: '5%', left: '2%', right: '12%', bottom: '5%', containLabel: true },
            xAxis: {
                type: 'value',

    // --- 图表工具功能 ---
    function showChartData(chartKey, titleText) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const option = chart.getOption();
        const series = option.series;

        document.getElementById('modal-title').innerText = titleText;
        const thead = document.getElementById('modal-thead');
        const tbody = document.getElementById('modal-tbody');
        let theadHTML = '';
        let tbodyHTML = '';

        // 分类处理不同图表的数据展示逻辑
        if (chartKey === 'chartOpinionTrend') {
            let categories = option.xAxis[0].data;
            theadHTML = `<tr>
                <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
                <th class="px-6 py-4 font-bold w-48">日期</th>
                <th class="px-6 py-4 font-bold">${series[0].name}</th>
            </tr>`;
            categories.forEach((cat, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-[#fcfcfc] dark:bg-slate-800/50';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 dark:hover:bg-slate-700/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700 dark:text-slate-300">${cat}</td>
                    <td class="px-6 py-4">${series[0].data[idx]}</td>
                </tr>`;
            });
        } else if (chartKey === 'chartPlatformDist') {
            let dataArr = series[0].data;
            theadHTML = `<tr>
                <th class="px-6 py-4 font-bold whitespace-nowrap w-16">序号</th>
                <th class="px-6 py-4 font-bold w-48">平台名称</th>
                <th class="px-6 py-4 font-bold">舆情数量</th>
            </tr>`;
            dataArr.forEach((item, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-[#fcfcfc] dark:bg-slate-800/50';
                tbodyHTML += `<tr class="${bgClass} hover:bg-blue-50/50 dark:hover:bg-slate-700/50 transition-colors">
                    <td class="px-6 py-4 text-slate-500">${idx + 1}</td>
                    <td class="px-6 py-4 text-slate-700 dark:text-slate-300">${item.name}</td>
                    <td class="px-6 py-4">${item.value}</td>
                </tr>`;
            });
        }

        thead.innerHTML = theadHTML;
        tbody.innerHTML = tbodyHTML;

        const modal = document.getElementById('data-table-modal');
        modal.classList.remove('hidden');
        void modal.offsetWidth; // 触发重绘
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    }

    function exportExcel() {
        const table = document.querySelector('#data-table-modal table');
        if (!table) return;
        let csv = [];
        const rows = table.querySelectorAll('tr');
        for (let i = 0; i < rows.length; i++) {
            let row = [];
            const cols = rows[i].querySelectorAll('td, th');
            for (let j = 0; j < cols.length; j++) {
                let data = cols[j].innerText.trim();
                if (i === 0 && j === 0 && data === "") data = "序号";
                data = data.replace(/"/g, '""');
                row.push('"' + data + '"');
            }
            csv.push(row.join(','));
        }
        const csvFile = new Blob(['\uFEFF' + csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement("a");
        const title = document.getElementById('modal-title').innerText || '导出数据';
        downloadLink.download = title + ".csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function closeModal() {
        const modal = document.getElementById('data-table-modal');
        modal.classList.add('opacity-0');
        modal.querySelector('div').classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    function downloadChart(chartKey) {
        const chart = chartInstances[chartKey];
        if (!chart) return;
        const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
        const a = document.createElement('a');
        a.href = url;
        a.download = chartKey + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function resizeAllCharts() { charts.forEach(chart => { if (chart) chart.resize(); }); }

    // --- 初始化 ---
    window.addEventListener('load', () => {
        initCharts();
        initPagination();
    });
    window.addEventListener('resize', resizeAllCharts);
</script>
