<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>全国水生态环境综合管理平台 - 问题聚焦</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="tailwind-build/tailwind.css"/>

    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .section-title-bar {
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, #93c5fd, #3b82f6);
            border-radius: 4px;
            margin-right: 8px;
        }

        #sidebar { transition: width 0.3s ease; }
        .sidebar-text { transition: opacity 0.2s ease; white-space: nowrap; }
        .hide-text .sidebar-text { display: none; opacity: 0; }
        .collapsed-sidebar .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .collapsed-sidebar .nav-item span.material-symbols-outlined { margin-right: 0; }

        /* 优化后的柔和阴影 */
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); }
        .popover-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }

        /* 来源分段按钮 */
        .source-btn {
            padding: 0.25rem 0.5rem; font-size: 12px; transition: all 0.2s; font-weight: 500;
            color: #64748b; cursor: pointer; white-space: nowrap;
        }
        .source-btn:hover { color: #2563eb; }
        .source-btn.active { color: #2563eb; font-weight: 700; }

        /* 月份翻页箭头 */
        .month-nav-btn {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; transition: color 0.2s; font-size: 22px; padding: 2px;
        }
        .month-nav-btn:hover:not(:disabled) { color: #2563eb; }
        .month-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 清单状态选项卡（下划线样式，无背景） */
        .status-tab {
            padding: 0.5rem 1.25rem; font-size: 13px; font-weight: 500; border-radius: 0;
            color: #64748b; transition: color 0.2s; cursor: pointer; white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .status-tab:hover { color: #2563eb; }
        .status-tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 700; }
        .status-tab .tab-count { font-weight: 500; opacity: 0.85; font-size: 12px; margin-left: 3px; }

        /* 复杂表格专业样式 */
        .data-table { border-spacing: 0; width: 100%; }
        .data-table th, .data-table td { background-clip: padding-box; }
        .data-table th {
            color: #475569; font-weight: 700; padding: 0.875rem 1rem; text-align: center; font-size: 14px;
            border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10;
            background-color: rgba(248, 250, 252, 0.9); backdrop-filter: blur(4px);
        }
        .data-table td { padding: 0.875rem 1rem; text-align: center; font-size: 13px; color: #475569; border-bottom: 1px solid #f1f5f9; }
        .data-table tbody tr:hover { background-color: rgba(239, 246, 255, 0.5); transition: background-color 0.15s; }

        /* 标签样式 */
        .type-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .reject-reason {
            display: block; max-width: 80px; margin: 0 auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #dc2626; font-size: 12px; font-weight: 500;
        }

        .status-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .status-pending { color: #d97706; }
        .status-done { color: #10b981; }
        .status-closed { color: #64748b; }
        .status-na { color: #94a3b8; }
        .status-reject { color: #dc2626; font-weight: 600; }

        .closed-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .closed-yes { color: #10b981; }
        .closed-no { color: #94a3b8; }

        /* 预警级别标识（仅 水质类别变化报警 / 浓度变化预警 记录带级别） */
        .level-tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; line-height: 1; padding: 2px 8px; border-radius: 9999px; margin-left: 6px; vertical-align: middle; border: 1px solid; }
        .level-lv1 { color: #dc2626; background: #fef2f2; border-color: #fecaca; }
        .level-lv2 { color: #d97706; background: #fffbeb; border-color: #fcd34d; }
        .level-lv3 { color: #2563eb; background: #eff6ff; border-color: #bfdbfe; }

        /* 时间筛选框激活态（主框选日期或三角频率下拉展开时） */
        .dp-open { border-color: #3b82f6 !important; box-shadow: 0 0 0 1px #3b82f6; }
        #dp-freq-trigger:hover #dp-freq-label, #dp-freq-trigger:hover #dp-freq-caret { color: #3b82f6; }

        /* 操作列按钮（参照平台浅色底+彩色边框标签风格，不同角色操作用不同颜色区分） */
        .op-btn {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; padding: 4px 10px; white-space: nowrap; line-height: 1.2;
            border: 1px solid; border-radius: 6px; cursor: pointer;
            transition: color .15s, border-color .15s, background-color .15s;
        }
        .op-btn i { font-size: 13px; }
        .op-btn + .op-btn { margin-left: 10px; }
        .op-reject { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
        .op-reject:hover { color: #b91c1c; border-color: #f87171; background: #fee2e2; }
        .op-close { color: #059669; border-color: #a7f3d0; background: #ecfdf5; }
        .op-close:hover { color: #047857; border-color: #34d399; background: #d1fae5; }
        .op-feedback { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
        .op-feedback:hover { color: #1d4ed8; border-color: #60a5fa; background: #dbeafe; }
        .op-refeedback { color: #d97706; border-color: #fcd34d; background: #fffbeb; }
        .op-refeedback:hover { color: #b45309; border-color: #fbbf24; background: #fef3c7; }
        .op-addlist { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
        .op-addlist:hover { color: #1d4ed8; border-color: #60a5fa; background: #dbeafe; }
        .op-delete { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
        .op-delete:hover { color: #b91c1c; border-color: #f87171; background: #fee2e2; }

        /* ===== 问题底单 · 问题详情弹框（外观参照清单页弹框；底单未入流程，不展示反馈/审核时间轴） ===== */
        .name-link { color: #2563eb; cursor: pointer; }
        .name-link:hover { color: #1d4ed8; text-decoration: underline; text-underline-offset: 2px; }
        .sheet-modal-mask {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            z-index: 400; display: none; align-items: center; justify-content: center; padding: 24px;
        }
        .sheet-modal-mask.open { display: flex; }
        .sheet-modal-card {
            width: 780px; max-width: 100%; max-height: 88vh; overflow-y: auto; background: #fff;
            border: 1px solid #c9d6e6; border-radius: 4px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
        }
        .sheet-modal-head {
            flex: none; display: flex; align-items: center; justify-content: space-between;
            padding: 11px 20px; background: #3b82f6; border-radius: 4px 4px 0 0;
            border-bottom: 1px solid #e2edfa; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
            position: sticky; top: 0;
        }
        .sheet-modal-head h3 { display: flex; align-items: center; gap: 8px; margin: 0; color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.6px; line-height: 1.4; }
        .sheet-modal-head h3 i { color: #fff; font-size: 17px; }
        .sheet-modal-close {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, 0.92); border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 3px; background: rgba(255, 255, 255, 0.06); cursor: pointer;
        }
        .sheet-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.55); }
        .sheet-body { padding: 18px 20px 22px; }
        .sheet-name { font-size: 16px; font-weight: 700; color: #0f172a; line-height: 1.45; }
        .sheet-g { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; font-weight: 600; letter-spacing: 0.04em; margin: 18px 0 2px; }
        .sheet-g::after { content: ''; flex: 1; height: 1px; background: #eef2f7; }
        .sheet-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px dashed #eef2f7; font-size: 13px; }
        .sheet-row:last-child { border-bottom: none; }
        .sheet-k { flex: none; width: 96px; color: #94a3b8; }
        .sheet-v { flex: 1; text-align: right; color: #334155; font-weight: 500; min-width: 0; word-break: break-all; }
        .sheet-v.yes { color: #059669; }
        .sheet-v.no { color: #94a3b8; }
        .sheet-desc-label { margin-top: 14px; font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0.04em; }
        .sheet-desc { margin-top: 5px; font-size: 13px; line-height: 1.75; color: #475569; word-break: break-word; }
        .sheet-note { margin-top: 8px; font-size: 12px; color: #b91c1c; line-height: 1.6; background: #fef2f2; border: 1px solid #fee2e2; border-radius: 2px; padding: 6px 8px; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 h-screen overflow-hidden flex flex-col">

                                <span class="sidebar-text">已反馈</span>

                            <a class="flex items-center pl-9 pr-2 py-2 text-[13px] text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                                <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-2.5 shrink-0 transition-colors"></span>
                                <span class="sidebar-text">销号情况</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-2 px-2">
                <button class="nav-item w-full flex items-center justify-between px-4 py-3 text-[16px] font-medium text-blue-700 bg-blue-50/50 dark:bg-blue-900/10 rounded-lg group transition-colors" onclick="toggleGroup('group-provincial')">
                    <div class="flex items-center">
                        <span class="material-symbols-outlined mr-3 text-blue-600">location_city</span>
                        <span class="sidebar-text font-bold text-slate-800 dark:text-white">省级分析</span>
                    </div>
                    <span class="material-symbols-outlined text-sm text-blue-600 sidebar-chevron transition-transform duration-200" style="transform: rotate(180deg);">expand_more</span>

                <div id="group-provincial" class="mt-1 space-y-1 overflow-hidden transition-all duration-300">
                    <a class="flex items-center px-12 py-2.5 text-[14px] text-slate-600 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                        <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-3 shrink-0 transition-colors"></span>

                        <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-3 shrink-0 transition-colors"></span>

                    <a class="flex items-center px-12 py-2.5 text-[14px] text-blue-700 bg-blue-50 dark:bg-blue-900/30 rounded-lg group transition-all font-bold relative" href="问题聚焦-底单.html">

                        <span class="sidebar-text">问题底单</span>

        <button id="toggleSidebarBtn" class="h-12 border-t border-slate-200 dark:border-slate-800 flex items-center justify-center space-x-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all text-slate-500 hover:text-primary group">

            <span class="sidebar-text text-sm font-medium tracking-wide">收起侧栏</span>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6">

        <!-- 页面标题栏 + 筛选控件（保持原版完全一致） -->
        <div class="min-h-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-6 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0 card-shadow mb-6 z-[60] relative">
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3 ml-1 shrink-0">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                <h2 class="text-[18px] font-bold text-slate-800 dark:text-white tracking-tight">问题聚焦</h2>
            </div>

            <div class="flex items-center space-x-2.5 flex-wrap gap-y-2 justify-end">
                <div class="relative" id="custom-cascader">
                    <button type="button" id="cascader-trigger" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-44 shadow-sm flex items-center justify-between group">
                        <span id="cascader-text" class="truncate text-slate-500">请选择类别</span>
                        <i id="cascader-clear" class="ri-close-line hidden text-slate-400 hover:text-red-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full px-0.5 cursor-pointer flex-none text-[13px]" title="清除类别"></i>
                        <i id="cascader-icon" class="ri-arrow-up-s-line text-slate-300 group-hover:text-slate-400 transition-transform rotate-180 flex-none"></i>
                    </button>
                    <div id="cascader-popover" class="hidden absolute top-full right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-lg shadow-xl popover-shadow z-50 flex overflow-hidden w-[700px]">
                        <div class="w-[180px] shrink-0 border-r border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-1" id="cascader-categories"></div>
                        <div class="w-[200px] shrink-0 border-r border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-1" id="cascader-subs"></div>
                        <div class="flex-1 bg-white dark:bg-slate-800 py-1 max-h-[340px] overflow-y-auto custom-scrollbar" id="cascader-options"></div>
                    </div>
                </div>

                <div class="relative">
                    <input type="text" id="filter-keyword" placeholder="搜索问题名称" autocomplete="off"
                           class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-8 pr-3 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all w-36 shadow-sm"
                           onkeydown="if(event.key==='Enter')applyFilter()">
                    <i class="ri-search-line absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>

                <div class="flex items-center gap-2">
                    <!-- 时间筛选：一个带三角的框 = 左侧三角(年/月/日频率下拉) + 右侧主框(点选日期)，两区域各自展开 -->
                    <div class="relative" id="custom-datepicker">
                        <div id="dp-box" class="flex items-stretch bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded shadow-sm group transition-all hover:border-blue-400 w-[214px]">

        const allowed = allowedFreqs();
        if (allowed.indexOf(dpFreq) >= 0) return false;
        dpFreq = allowed[allowed.length - 1];
        return true;
    }

    // 框体高亮跟随 日期面板 / 频率下拉 任一展开
    function syncDpBox() {
        if (!dpBox) return;
        const active = !dpPopover.classList.contains('hidden') || !dpFreqMenu.classList.contains('hidden');
        dpBox.classList.toggle('dp-open', active);
    }

    // 同步三角左侧的频率文字（年/月/日）
    function syncFreqLabel() {
        if (dpFreqLabel) dpFreqLabel.innerText = dpFreq;
    }

    function closeDatepicker() {
        dpPopover.classList.add('hidden');
        syncDpBox();
    }

    // 渲染右侧三角的频率下拉（年/月/日，仅列当前时间粒度允许的项，当前项打勾）
    function renderFreqMenu() {
        if (!dpFreqMenu) return;
        const allowed = allowedFreqs();
        dpFreqMenu.innerHTML = allowed.map(f => `
            <button type="button" data-dpfreq="${f}"
                class="w-full flex items-center justify-between px-3 py-1.5 text-[12px] transition-colors ${dpFreq === f ? 'text-blue-600 font-bold bg-blue-50' : 'text-slate-600 hover:bg-slate-100 hover:text-blue-600'}">
                <span>${f}</span>${dpFreq === f ? '<i class="ri-check-line text-[13px] flex-none"></i>' : ''}
            </button>`).join('');
    }

    function openFreqMenu() {
        closeCascader();
        closeDatepicker();                 // 先收起日期面板，再展开频率下拉
        renderFreqMenu();
        dpFreqMenu.classList.remove('hidden');
        if (dpFreqCaret) dpFreqCaret.classList.add('rotate-180');
        syncDpBox();
    }
    function closeFreqMenu() {
        if (dpFreqMenu) dpFreqMenu.classList.add('hidden');
        if (dpFreqCaret) dpFreqCaret.classList.remove('rotate-180');
        syncDpBox();
    }
    function toggleFreqMenu() {
        if (dpFreqMenu.classList.contains('hidden')) openFreqMenu();
        else closeFreqMenu();
    }

    // 在频率下拉里切换 年/月/日：清空已选时间并刷新主框占位（下次打开日期面板按新频率展示）
    function chooseFreq(f) {
        if (allowedFreqs().indexOf(f) < 0) return;
        dpFreq = f;
        syncFreqLabel();
        dpForm = freqForm(f);
        selectedYearMonth = '';
        dpText.innerText = dpPlaceholder();
        dpText.classList.replace('text-slate-800', 'text-slate-500');
        closeFreqMenu();
        applyFilter();
    }

    function renderDatepicker() {
        let html = '';
        // 顶部年份导航：仅“年月/季度/年”形态需要；日粒度直接用下方月导航单行做标准日历头，避免年/月两层标题重复
        if (dpForm !== '日') {
            html += `<div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">`;
            html += `<button type="button" data-dpnav="prev-year" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-left-double-line text-lg"></i></button>`;
            html += `<span class="font-medium text-[15px] text-slate-700">${dpCurrentYear} 年</span>`;
            html += `<button type="button" data-dpnav="next-year" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-right-double-line text-lg"></i></button>`;
            html += `</div>`;
        }

        if (dpForm === '年月') {
            html += `<div class="grid grid-cols-4 gap-y-4 gap-x-2 text-center">`;
            for(let i=1; i<=12; i++){
                const mv = String(i).padStart(2, '0');
                const val = dpCurrentYear + '-' + mv;
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-2 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${i}月</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '日') {
            html += `<div class="flex justify-between items-center mb-2">`;
            html += `<button type="button" data-dpnav="prev-month" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-left-s-line text-lg"></i></button>`;
            html += `<span class="text-[13px] font-medium text-slate-700">${dpCurrentYear} 年 ${dpCurrentMonth} 月</span>`;
            html += `<button type="button" data-dpnav="next-month" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-right-s-line text-lg"></i></button>`;
            html += `</div>`;
            const weekdays = ['日','一','二','三','四','五','六'];
            html += `<div class="grid grid-cols-7 gap-1 text-center text-[11px] text-slate-400 mb-1">`;
            weekdays.forEach(w => html += `<span>${w}</span>`);
            html += `</div>`;
            const firstDay = new Date(dpCurrentYear, dpCurrentMonth-1, 1).getDay();
            const daysInMonth = new Date(dpCurrentYear, dpCurrentMonth, 0).getDate();
            html += `<div class="grid grid-cols-7 gap-1 text-center">`;
            for (let i=0;i<firstDay;i++) html += `<span></span>`;
            for (let d=1; d<=daysInMonth; d++){
                const val = dpCurrentYear + '-' + String(dpCurrentMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-1.5 text-[12px] rounded-lg transition-colors ${isActive ? 'bg-blue-500 text-white font-bold' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-600'}">${d}</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '季度') {
            html += `<div class="grid grid-cols-2 gap-3 text-center">`;
            for (let q=1; q<=4; q++){
                const val = dpCurrentYear + '-Q' + q;
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-3 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${q}季度</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '年') {
            html += `<div class="grid grid-cols-3 gap-3 text-center">`;
            const startY = dpCurrentYear - 4;
            for (let i=0; i<12; i++){
                const y = startY + i;
                const val = String(y);
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-2 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${y}年</button>`;
            }
            html += `</div>`;
        }
        dpContainer.innerHTML = html;
    }

    function openDatepicker() {
        closeCascader();
        closeFreqMenu();                   // 先收起频率下拉
        // 打开前按当前时间粒度校验频率；若已不可用回退到代表频率并清空已选时间
        if (ensureFreqAllowed()) {
            dpForm = freqForm(dpFreq);
            syncFreqLabel();
            selectedYearMonth = '';
            dpText.innerText = dpPlaceholder();
            dpText.classList.replace('text-slate-800', 'text-slate-500');
        }
        dpPopover.classList.remove('hidden');
        syncDpBox();
        renderDatepicker();
    }

    function toggleDatepicker() {
        if (dpPopover.classList.contains('hidden')) openDatepicker();
        else closeDatepicker();
    }

    function selectYearMonth(val) {
        selectedYearMonth = val;
        if (val) {
            if (dpForm === '季度') {
                const [yy, q] = val.split('-Q');
                dpCurrentYear = Number(yy);
                dpText.innerText = yy + ' 年 ' + q + ' 季度';
            } else if (dpForm === '年') {
                dpCurrentYear = Number(val);
                dpText.innerText = val + ' 年';
            } else if (dpForm === '日') {
                const [yy, mm, dd] = val.split('-');
                dpCurrentYear = Number(yy);
                dpCurrentMonth = Number(mm);
                dpText.innerText = yy + ' 年 ' + Number(mm) + ' 月 ' + Number(dd) + ' 日';
            } else {
                const [yy, mm] = val.split('-');
                dpCurrentYear = Number(yy);
                dpCurrentMonth = Number(mm);
                dpText.innerText = yy + ' 年 ' + Number(mm) + ' 月';
            }
            dpText.classList.replace('text-slate-500', 'text-slate-800');
        } else {
            dpText.innerText = dpPlaceholder();
            dpText.classList.replace('text-slate-800', 'text-slate-500');
        }
        applyFilter();
    }

    // 依据识别规则的时间粒度刷新频率可选范围：
    //   - 日   规则 → 可查 年/月/日（全放开）
    //   - 年月 规则 → 可查 年/月（去掉日）
    //   - 年   规则 → 仅可查 年
    //   - 未选规则 → 全部放开，默认月
    // 若当前频率在新粒度下不再允许（如月切到仅年的规则），则回退到该规则的默认频率并清空已选时间；
    // 若当前频率仍被允许（如选了日规则但此刻仍是月），则保留用户已有选择，便于在同类问题间继续向下钻取。
    function refreshTimeGranularity(t) {
        const hasT = (t === '日' || t === '年月' || t === '年');
        dataTime = hasT ? t : '';
        let changed = false;
        if (!hasT) {
            // 未选 / 清除规则：回到“月”默认
            if (dpFreq !== '月' || selectedYearMonth) { dpFreq = '月'; changed = true; }
        } else if (allowedFreqs().indexOf(dpFreq) < 0) {
            // 新规则粒度不允许当前频率 → 切到该粒度代表默认并清空已选时间
            dpFreq = allowedFreqs()[allowedFreqs().length - 1];
            changed = true;
        }
        if (changed) {
            dpForm = freqForm(dpFreq);
            syncFreqLabel();
            selectedYearMonth = '';
            dpText.innerText = dpPlaceholder();
            dpText.classList.replace('text-slate-800', 'text-slate-500');
        }
        if (!dpPopover.classList.contains('hidden')) renderDatepicker();
    }

    function matchTimeValue(dateStr) {
        if (!selectedYearMonth) return true;
        if (dpForm === '季度') {
            const [yy, q] = selectedYearMonth.split('-Q');
            const m = Number(dateStr.slice(5, 7));
            const quarter = Math.ceil(m / 3);
            return dateStr.slice(0, 4) === yy && quarter === Number(q);
        }
        return dateStr.startsWith(selectedYearMonth);
    }

    if (dpTrigger) dpTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleDatepicker(); });
    if (dpFreqBtn) dpFreqBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFreqMenu(); });

    if (dpFreqMenu) dpFreqMenu.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-dpfreq]');
        if (btn) chooseFreq(btn.getAttribute('data-dpfreq'));
    });

    dpPopover.addEventListener('click', (e) => {
        const navBtn = e.target.closest('button[data-dpnav]');
        if (navBtn) {
            const action = navBtn.getAttribute('data-dpnav');
            if (action === 'prev-year') dpCurrentYear--;
            else if (action === 'next-year') dpCurrentYear++;
            else if (action === 'prev-month') { dpCurrentMonth--; if (dpCurrentMonth < 1) { dpCurrentMonth = 12; dpCurrentYear--; } }
            else if (action === 'next-month') { dpCurrentMonth++; if (dpCurrentMonth > 12) { dpCurrentMonth = 1; dpCurrentYear++; } }
            renderDatepicker();
            return;
        }
        const valBtn = e.target.closest('button[data-dpval]');
        if (valBtn) {
            const val = valBtn.getAttribute('data-dpval');
            closeDatepicker();
            selectYearMonth(selectedYearMonth === val ? '' : val);
        }
    });

    document.addEventListener('click', (e) => {
        if (!document.getElementById('custom-cascader').contains(e.target)) closeCascader();
        if (!document.getElementById('custom-datepicker').contains(e.target)) closeDatepicker();
    });

    // ========== 数据与逻辑联动 ==========
    let selectedSource = '全部';
    document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedSource = btn.dataset.source;
            document.querySelectorAll('.source-btn').forEach(b => b.classList.toggle('active', b.dataset.source === selectedSource));
            applyFilter();
        });
    });

    let selectedStatusTab = '';
    const statusTabAll = document.getElementById('status-tab-all');

    function renderStatusTabsActive() {
        // 底单页仅“全部”Tab，始终高亮
        statusTabAll.classList.toggle('active', selectedStatusTab === '');
    }

    function updateStatusTabsVisibility() {
        // 底单页：无审批流程，仅“全部”Tab，默认选中
        selectedStatusTab = '';
        renderStatusTabsActive();
    }

    function renderStatusTabCounts() {
        const setCount = (selector, n) => {
            const el = document.querySelector(`#status-tabs .status-tab${selector} .tab-count`);
            if (el) el.textContent = `(${n})`;
        };
        // 底单页仅展示“全部”Tab，统计总数
        setCount('#status-tab-all', chartData.length);
    }

    if (statusTabAll) {
        statusTabAll.addEventListener('click', () => {
            selectedStatusTab = '';
            renderStatusTabsActive();
            applyFilter();
        });
    }

    function updateConditionalFilterVisibility() {
        // 是否调查反馈/驳回/销号 筛选已隐藏，始终保持“全部”
        ['filter-survey', 'filter-reject', 'filter-closed'].forEach(id => {
            document.getElementById(id).value = '全部';
        });
        updateStatusTabsVisibility();
        applyFilter();
    }

    let filteredData = [];
    let chartData = [];
    const rowsPerPage = 10;
    let currentPage = 1;

    function applyFilter() {
        const f = {
            survey: document.getElementById('filter-survey').value,
            reject: document.getElementById('filter-reject').value,
            closed: document.getElementById('filter-closed').value,
            lake: document.getElementById('filter-lake').value,
            basin1: document.getElementById('filter-basin1').value,
            basin2: document.getElementById('filter-basin2').value,
            category: selectedCategorySub,
            source: selectedSource,
            level: filterLevelSel ? filterLevelSel.value : '全部',
            keyword: (document.getElementById('filter-keyword').value || '').trim()
        };

        chartData = focusData.filter(item => {
            if (f.survey !== '全部' && item.survey !== f.survey) return false;
            if (f.reject !== '全部' && item.reject !== f.reject) return false;
            if (f.closed !== '全部' && item.closed !== f.closed) return false;
            // 底单页：只展示未加入问题清单的问题（已加入的进入“问题清单”审批流程）
            if (item.inList === '是') return false;
            if (f.lake !== '全部' && item.lake !== f.lake) return false;
            if (f.basin1 !== '全部' && item.basin1 !== f.basin1) return false;
            if (f.basin2 !== '全部' && item.basin2 !== f.basin2) return false;
            if (f.category && item.category !== f.category) return false;
            if (f.level !== '全部' && item.level !== f.level) return false;
            if (f.source !== '全部' && item.source !== f.source) return false;
            if (f.keyword && !item.name.includes(f.keyword)) return false;
            return true;
        });

        renderStatusTabCounts();

        filteredData = selectedYearMonth ? chartData.filter(i => matchTimeValue(i.date)) : chartData;

        currentPage = 1;
        renderTable();
    }

    function resetFilter() {
        document.getElementById('filter-survey').value = '全部';
        document.getElementById('filter-reject').value = '全部';
        document.getElementById('filter-closed').value = '全部';
        document.getElementById('filter-lake').value = '全部';
        document.getElementById('filter-basin1').value = '全部';
        document.getElementById('filter-basin2').value = '全部';
        document.getElementById('filter-keyword').value = '';
        clearCascader();
        selectYearMonth('');
        selectedSource = '全部';
        document.querySelectorAll('.source-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
        selectedStatusTab = '';
        renderStatusTabsActive();
        updateConditionalFilterVisibility();
    }

    // 渲染表格 (保持原版逻辑与字段，不乱动)
    function renderTable() {
        const tbody = document.getElementById('focus-table-body');
        const total = filteredData.length;
        document.getElementById('focus-total').innerText = total;

        // 底单页：始终显示操作列（加入清单）

        const totalPages = Math.ceil(total / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, total);

        let html = '';
        for (let i = start; i < end; i++) {
            const item = filteredData[i];
            const noProcess = (item.inList === '否');
            let statusCell, closedCell, sourceCell;

            if (item.reject === '是') {
                // 已驳回：问题状态显示“已驳回”
                statusCell = '<span class="status-tag status-reject">已驳回</span>';
                closedCell = item.closed === "是" ? '<span class="closed-tag closed-yes">是</span>' : '<span class="closed-tag closed-no">否</span>';
            } else if (noProcess) {
                // 未入清单：显示“问题底单”
                statusCell = '<span class="status-tag status-na">问题底单</span>';
                closedCell = '<span class="text-slate-400">—</span>';
            } else {
                const s = statusMap[item.status];
                statusCell = `<span class="status-tag ${s.cls}">${s.label}</span>`;
                closedCell = item.closed === "是" ? '<span class="closed-tag closed-yes">是</span>' : '<span class="closed-tag closed-no">否</span>';
            }
            // 已驳回：第二列用红色字标识驳回原因，过长时省略号截断并悬浮显示完整内容
            sourceCell = (item.reject === '是')
                ? `<span class="reject-reason" title="${item.reason || '已驳回'}">${item.reason || '已驳回'}</span>`
                : item.source;

            // 操作列：底单页提供“加入清单”与“删除”
            const actionCell = `<div class="flex items-center justify-center">
                <button class="op-btn op-addlist" onclick="handleAddToList(${i})"><i class="ri-add-circle-line"></i>加入清单</button>
                <button class="op-btn op-delete" onclick="handleDelete(${i})"><i class="ri-delete-bin-line"></i>删除</button>
            </div>`;

            // 预警级别标签：仅“水质类别变化报警 / 浓度变化预警”的自动站记录带级别
            const levelCls = item.level ? (item.level === '一级' ? 'level-lv1' : item.level === '二级' ? 'level-lv2' : 'level-lv3') : '';
            const lvTag = item.level ? `<span class="level-tag ${levelCls}" title="预警级别：${item.level}">${item.level}</span>` : '';

            html += `
                <tr>
                    <td class="text-left pl-6 font-medium text-blue-600"><a href="javascript:void(0)" class="name-link" onclick="openSheetDetail(${i})" title="查看问题详情">${item.name}</a></td>
                    <td>${sourceCell}</td>
                    <td><span class="type-tag text-slate-600">${item.category}</span></td>
                    <td>${lvTag || '<span class="text-slate-300">—</span>'}</td>
                    <td>${item.date}</td>
                    <td class="font-medium text-slate-800">${item.city}</td>
                    <td>${statusCell}</td>
                    <td>${closedCell}</td>
                    <td class="op-cell">${actionCell || '<span class="text-slate-300">—</span>'}</td>
                </tr>`;
        }
        tbody.innerHTML = html || '<tr><td colspan="9" class="py-10 text-slate-400"><i class="ri-inbox-2-line text-2xl mb-1 block"></i>暂无符合条件的记录</td></tr>';

        // 翻页器
        let pageHtml = `<button onclick="goPage(${currentPage - 1})" ${currentPage===1?'disabled':''} class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-30">上一页</button>`;
        for (let p=1; p<=totalPages; p++) {
            pageHtml += `<button onclick="goPage(${p})" class="px-2.5 py-1 text-xs rounded font-medium ${p===currentPage ? 'bg-blue-500 text-white' : 'border border-slate-200 text-slate-600 hover:bg-slate-50'}">${p}</button>`;
        }
        pageHtml += `<button onclick="goPage(${currentPage + 1})" ${currentPage===totalPages?'disabled':''} class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-30">下一页</button>`;
        document.getElementById('focus-pagination').innerHTML = pageHtml;
    }

    window.goPage = function(p) { currentPage = p; renderTable(); };

    // 操作列交互（mock 数据演示，直接修改内存数据后重绘）
    window.handleReject = function(idx) {
        const item = filteredData[idx];
        if (!item || item.reject === '是') return;
        item.reject = '是';
        item.reason = '反馈不满足要求，退回地市补充核实';
        renderStatusTabCounts();
        renderTable();
    };
    window.handleClose = function(idx) {
        const item = filteredData[idx];
        if (!item || item.closed === '是') return;
        item.closed = '是';
        item.status = 'closed';
        renderStatusTabCounts();
        renderTable();
    };
    window.handleFeedback = function(idx) {
        const item = filteredData[idx];
        if (!item) return;
        // 已驳回 → 重新反馈，清除驳回标记
        if (item.reject === '是') { item.reject = '否'; item.reason = ''; }
        item.status = 'done';
        renderStatusTabCounts();
        renderTable();
    };
    window.handleAddToList = function(idx) {
        const item = filteredData[idx];
        if (!item || item.inList === '是') return;
        if (!confirm('确认将该问题加入问题清单？')) return;
        // 加入清单：标记已进入问题清单审批流程，并从底单表格中移除该行
        item.inList = '是';
        if (filteredData === chartData) {
            filteredData.splice(idx, 1);
        } else {
            const ci = chartData.indexOf(item);
            if (ci > -1) chartData.splice(ci, 1);
            filteredData.splice(idx, 1);
        }
        renderStatusTabCounts();
        renderTable();
    };
    window.handleDelete = function(idx) {
        const item = filteredData[idx];
        if (!item) return;
        if (!confirm(`确认将该问题从问题底单中删除？\n\n${item.name}`)) return;
        // 从数据源整体移除（底单仅收录未入清单的问题）
        const gi = focusData.indexOf(item);
        if (gi > -1) focusData.splice(gi, 1);
        if (filteredData === chartData) {
            filteredData.splice(idx, 1);
        } else {
            const ci = chartData.indexOf(item);
            if (ci > -1) chartData.splice(ci, 1);
            filteredData.splice(idx, 1);
        }
        // 删除后若当前页无数据则自动回到最后一页
        const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        renderStatusTabCounts();
        renderTable();
    };

    // ========== 问题详情弹框（点击问题名称打开；仅只读展示，右侧不含反馈/审核/上报流程） ==========
    // 问题描述文本：有录入详情(item.detail)取之；系统识别/外部系统调度等缺详情记录的按类别+区域字段自动生成
    function problemDetailText(item) {
        if (item.detail && String(item.detail).trim()) return String(item.detail).trim();
        const date = (item.date || '').trim();
        const regParts = [item.basin1, item.basin2].filter(v => v && String(v).trim() && String(v).trim() !== '—').map(v => String(v).trim());
        const reg = regParts.join('·');
        const lake = (item.lake || '').trim();
        const city = (item.city || '').trim();
        const where = lake
            ? `${lake}（${reg || '—'}）`
            : (city ? (reg ? `${city}（${reg}）` : city) : (reg || '相关区域'));
        const cat = String(item.category || '');
        const lv = item.level ? `（${item.level}级）` : '';
        const head = date ? `${date}，` : '';
        let txt;
        if (cat.indexOf('自动站水质超标') === 0) {
            const unit = cat.indexOf('（天）') > -1 ? '按日统计' : (cat.indexOf('（小时）') > -1 ? '按小时统计' : '');
            txt = `${head}${where}水质自动监测站数据显示水质指标出现超标${lv}${unit ? '（' + unit + '）' : ''}，已自动生成超标问题线索，请属地核查超标成因并开展排查。`;
        } else if (cat.indexOf('水质类别变化') > -1) {
            txt = `${head}${where}断面水质类别发生降类变化${lv}，触发水质类别变化报警，已自动生成问题线索，请属地核实变化原因并组织溯源排查。`;
        } else if (cat.indexOf('浓度变化预警') > -1) {
            txt = `${head}${where}主要污染物浓度出现持续上升趋势${lv}，触发浓度变化预警，已自动生成问题线索，请属地加强监测并开展溯源调查。`;
        } else {
            txt = `${head}${where}水环境质量出现明显恶化迹象，存在水质下降风险，已生成问题线索，请属地开展现场调查核实与原因排查。`;
        }
        return txt;
    }

    // 问题类别完整路径（大类 › 小类 › 具体类型），按底单小类反查大类
    function categoryPathText(item) {
        const c2 = String(item.category || '').trim();
        if (!c2) return '—';
        let c1 = String(item.cat1 || '').trim();
        let c3 = String(item.cat3 || '').trim();
        cascaderData.some(top => {
            const sub = (top.children || []).find(s => s && s.category === c2);
            if (!sub) return false;
            if (!c1) c1 = top.category;
            if (!c3) {
                const uniq = (sub.items || []).map(i => i && i.name).filter(n => n && n !== c2);
                if (uniq.length === 1) c3 = uniq[0];
            }
            return true;
        });
        const segs = [];
        if (c1 && segs.indexOf(c1) === -1) segs.push(c1);
        if (c2 && segs.indexOf(c2) === -1) segs.push(c2);
        if (c3 && segs.indexOf(c3) === -1) segs.push(c3);
        if (!segs.length) return '—';
        return segs.map(v => escAttr(v)).join('<span class="text-slate-300">›</span>');
    }

    function buildSheetDetailHtml(item) {
        const orDash = v => (v && String(v).trim()) ? String(v).trim() : '—';
        const levelText = item.level ? item.level : '';
        const inList = item.inList === '是';
        // 状态口径与表格一致：已驳回优先；未入清单显示“问题底单”；否则按流程状态
        let statusText;
        if (item.reject === '是') statusText = '已驳回';
        else if (!inList) statusText = '问题底单';
        else statusText = orDash((statusMap[item.status] || {}).label);
        // 是否销号：未入清单的问题无销号概念，显示“—”
        let closedVal;
        if (item.reject === '是') closedVal = item.closed === '是' ? '已销号' : '未销号';
        else if (!inList) closedVal = '—';
        else closedVal = item.closed === '是' ? '已销号' : '未销号';
        const b1 = orDash(item.basin1);
        const b2 = orDash(item.basin2);
        const rejectNote = item.reject === '是'
            ? `<div class="sheet-note"><i class="ri-error-warning-line mr-1"></i>驳回原因：${escAttr(item.reason || '—')}</div>` : '';
        return `
            <div class="sheet-name">${escAttr(item.name)}</div>
            <div class="sheet-g">基础信息</div>
            <div class="sheet-row"><span class="sheet-k">问题类别</span><span class="sheet-v">${categoryPathText(item)}</span></div>
            <div class="sheet-row"><span class="sheet-k">预警级别</span><span class="sheet-v">${levelText || '<span class="text-slate-300">—</span>'}</span></div>
            <div class="sheet-row"><span class="sheet-k">数据来源</span><span class="sheet-v">${orDash(item.source)}</span></div>
            <div class="sheet-row"><span class="sheet-k">问题时间</span><span class="sheet-v">${orDash(item.date)}</span></div>
            <div class="sheet-row"><span class="sheet-k">市州</span><span class="sheet-v">${orDash(item.city)}</span></div>
            <div class="sheet-row"><span class="sheet-k">所属水系</span><span class="sheet-v">${b1}${b2 !== '—' ? `（${b2}）` : ''}</span></div>
            <div class="sheet-row"><span class="sheet-k">所在湖库</span><span class="sheet-v">${orDash(item.lake)}</span></div>
            <div class="sheet-desc-label">问题描述</div>
            <div class="sheet-desc">${escAttr(problemDetailText(item))}</div>
            <div class="sheet-g">清单状态</div>
            <div class="sheet-row"><span class="sheet-k">纳入清单</span><span class="sheet-v ${inList ? 'yes' : 'no'}">${inList ? '已纳入' : '未纳入'}</span></div>
            <div class="sheet-row"><span class="sheet-k">问题状态</span><span class="sheet-v">${escAttr(statusText)}</span></div>
            <div class="sheet-row"><span class="sheet-k">是否销号</span><span class="sheet-v">${escAttr(closedVal)}</span></div>
            ${rejectNote}
        `;
    }

    window.openSheetDetail = function(idx) {
        const item = filteredData[idx];
        if (!item) return;
        document.getElementById('sheet-detail-body').innerHTML = buildSheetDetailHtml(item);
        document.getElementById('sheet-detail-modal').classList.add('open');
    };
    window.closeSheetDetail = function() {
        document.getElementById('sheet-detail-modal').classList.remove('open');
    };
    // 点击遮罩空白关闭
    document.getElementById('sheet-detail-modal').addEventListener('click', function(e) {
        if (e.target === this) closeSheetDetail();
    });

    // 初始化
    window.addEventListener('load', () => {
        const provGroup = document.getElementById('group-provincial');
        if (provGroup) provGroup.style.maxHeight = provGroup.scrollHeight + "px";
        updateConditionalFilterVisibility();
    });
</script>

</body>
</html>
