<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>全国水生态环境综合管理平台 - 问题聚焦</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="tailwind-build/tailwind.css"/>

    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .section-title-bar {
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, #93c5fd, #3b82f6);
            border-radius: 4px;
            margin-right: 8px;
        }

        #sidebar { transition: width 0.3s ease; }
        .sidebar-text { transition: opacity 0.2s ease; white-space: nowrap; }
        .hide-text .sidebar-text { display: none; opacity: 0; }
        .collapsed-sidebar .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .collapsed-sidebar .nav-item span.material-symbols-outlined { margin-right: 0; }

        /* 优化后的柔和阴影 */
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); }
        .popover-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }

        /* 来源分段按钮 */
        .source-btn {
            padding: 0.25rem 0.5rem; font-size: 12px; transition: all 0.2s; font-weight: 500;
            color: #64748b; cursor: pointer; white-space: nowrap;
        }
        .source-btn:hover { color: #2563eb; }
        .source-btn.active { color: #2563eb; font-weight: 700; }

        /* 月份翻页箭头 */
        .month-nav-btn {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; transition: color 0.2s; font-size: 22px; padding: 2px;
        }
        .month-nav-btn:hover:not(:disabled) { color: #2563eb; }
        .month-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 清单状态选项卡 */
        .status-tab {
            padding: 0.5rem 1.25rem; font-size: 13px; font-weight: 500; border-radius: 0;
            color: #64748b; transition: all 0.2s; cursor: pointer; white-space: nowrap;
        }
        .status-tab:hover { color: #2563eb; background-color: #f8fafc; }
        .status-tab.active { background-color: #3b82f6; color: #ffffff; box-shadow: 0 -1px 4px rgba(0,0,0,0.08); font-weight: 700; }
        .status-tab .tab-count { font-weight: 500; opacity: 0.85; font-size: 12px; margin-left: 3px; }

        /* 复杂表格专业样式 */
        .data-table { border-spacing: 0; width: 100%; }
        .data-table th, .data-table td { background-clip: padding-box; }
        .data-table th {
            color: #475569; font-weight: 700; padding: 0.875rem 1rem; text-align: center; font-size: 14px;
            border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10;
            background-color: rgba(248, 250, 252, 0.9); backdrop-filter: blur(4px);
        }
        .data-table td { padding: 0.875rem 1rem; text-align: center; font-size: 13px; color: #475569; border-bottom: 1px solid #f1f5f9; }
        .data-table tbody tr:hover { background-color: rgba(239, 246, 255, 0.5); transition: background-color 0.15s; }

        /* 标签样式 */
        .type-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .reject-reason {
            display: block; max-width: 80px; margin: 0 auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #dc2626; font-size: 12px; font-weight: 500;
        }
        .type-water { color: #ef4444; }
        .type-task { color: #2563eb; }
        .type-media { color: #9333ea; }

        .status-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .status-pending { color: #d97706; }
        .status-inprogress { color: #2563eb; }
        .status-done { color: #10b981; }
        .status-closed { color: #64748b; }
        .status-na { color: #94a3b8; }
        .status-reject { color: #dc2626; font-weight: 600; }

        .closed-tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        .closed-yes { color: #10b981; }
        .closed-no { color: #94a3b8; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 h-screen overflow-hidden flex flex-col">

<header class="bg-primary h-14 flex items-center justify-between px-4 text-white shrink-0 shadow-md z-50">
    <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-primary text-xl">water_drop</span>
        </div>
        <h1 class="text-xl font-bold tracking-tight">全国水生态环境综合管理平台</h1>
    </div>
    <div class="flex items-center space-x-4">
        <button class="flex items-center space-x-1.5 bg-white/20 hover:bg-white/30 px-4 py-1.5 rounded-full transition-colors text-sm font-medium">
            <i class="ri-function-line"></i>
            <span>功能模块</span>
        </button>
        <button class="flex items-center space-x-1.5 bg-white/20 hover:bg-white/30 px-4 py-1.5 rounded-full transition-colors text-sm font-medium">
            <i class="ri-global-line"></i>
            <span>业务域</span>
        </button>
        <div class="flex items-center space-x-2 text-sm pl-4 border-l border-white/20">
            <span class="material-symbols-outlined text-[18px]">account_circle</span>
            <span>wangyunpeng</span>
        </div>
    </div>
</header>

<div class="flex flex-1 overflow-hidden">
    <aside id="sidebar" class="w-[270px] bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0 z-40">
        <div class="flex-1 py-4 overflow-y-auto custom-scrollbar flex flex-col gap-1">
            <div class="mb-2 px-2">
                <button class="nav-item w-full flex items-center justify-between px-4 py-3 text-[16px] font-medium text-slate-700 dark:text-slate-300 rounded-lg group transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50" onclick="toggleGroup('group-ministerial')">
                    <div class="flex items-center">
                        <span class="material-symbols-outlined mr-3 text-slate-500">domain</span>
                        <span class="sidebar-text font-bold text-slate-800 dark:text-white">部级分析</span>
                    </div>
                    <span class="material-symbols-outlined text-sm text-slate-400 group-hover:text-blue-500 sidebar-chevron transition-transform duration-200">expand_more</span>
                </button>
                <div id="group-ministerial" class="mt-1 space-y-1 overflow-hidden transition-all duration-300" style="max-height: 0px;">
                    <div class="ml-4 px-3 rounded-lg">
                        <button class="nav-item w-full flex items-center justify-between px-3 py-2.5 text-[14px] font-medium text-slate-600 dark:text-slate-400 rounded-lg transition-colors hover:text-blue-600" onclick="toggleSubmenu('submenu-feedback')">
                            <div class="flex items-center">
                                <span class="material-symbols-outlined mr-2.5 text-[18px]">forum</span>
                                <span class="sidebar-text">问题线索及反馈</span>
                            </div>
                            <span class="material-symbols-outlined text-sm text-slate-400 submenu-chevron transition-transform duration-200">expand_more</span>
                        </button>
                        <div id="submenu-feedback" class="mt-1 space-y-1 overflow-hidden transition-all duration-300" style="max-height: 0px;">
                            <a class="flex items-center pl-9 pr-2 py-2 text-[13px] text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                                <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-2.5 shrink-0 transition-colors"></span>
                                <span class="sidebar-text">未反馈</span>
                            </a>
                            <a class="flex items-center pl-9 pr-2 py-2 text-[13px] text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                                <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-2.5 shrink-0 transition-colors"></span>
                                <span class="sidebar-text">反馈中</span>
                            </a>
                            <a class="flex items-center pl-9 pr-2 py-2 text-[13px] text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                                <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-2.5 shrink-0 transition-colors"></span>
                                <span class="sidebar-text">已反馈</span>
                            </a>
                            <a class="flex items-center pl-9 pr-2 py-2 text-[13px] text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                                <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-2.5 shrink-0 transition-colors"></span>
                                <span class="sidebar-text">销号情况</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-2 px-2">
                <button class="nav-item w-full flex items-center justify-between px-4 py-3 text-[16px] font-medium text-blue-700 bg-blue-50/50 dark:bg-blue-900/10 rounded-lg group transition-colors" onclick="toggleGroup('group-provincial')">
                    <div class="flex items-center">
                        <span class="material-symbols-outlined mr-3 text-blue-600">location_city</span>
                        <span class="sidebar-text font-bold text-slate-800 dark:text-white">省级分析</span>
                    </div>
                    <span class="material-symbols-outlined text-sm text-blue-600 sidebar-chevron transition-transform duration-200" style="transform: rotate(180deg);">expand_more</span>
                </button>
                <div id="group-provincial" class="mt-1 space-y-1 overflow-hidden transition-all duration-300">
                    <a class="flex items-center px-12 py-2.5 text-[14px] text-slate-600 dark:text-slate-400 hover:text-blue-600 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all rounded-lg group" href="#">
                        <span class="w-1.5 h-1.5 bg-slate-300 dark:bg-slate-600 group-hover:bg-blue-600 rounded-full mr-3 shrink-0 transition-colors"></span>
                        <span class="sidebar-text">环保舆情</span>
                    </a>
                    <a class="flex items-center px-12 py-2.5 text-[14px] text-blue-700 bg-blue-50 dark:bg-blue-900/30 rounded-lg group transition-all font-bold relative" href="#">
                        <span class="w-1.5 h-1.5 bg-blue-600 rounded-full mr-3 shrink-0"></span>
                        <span class="sidebar-text">问题聚焦</span>
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-blue-600 rounded-r-full"></div>
                    </a>
                </div>
            </div>
        </div>

        <button id="toggleSidebarBtn" class="h-12 border-t border-slate-200 dark:border-slate-800 flex items-center justify-center space-x-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all text-slate-500 hover:text-primary group">
            <span id="toggleIcon" class="material-symbols-outlined text-xl transition-transform duration-300">chevron_left</span>
            <span class="sidebar-text text-sm font-medium tracking-wide">收起侧栏</span>
        </button>
    </aside>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6">

        <!-- 页面标题栏 + 筛选控件（保持原版完全一致） -->
        <div class="min-h-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-6 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0 card-shadow mb-6 z-[60] relative">
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3 ml-1 shrink-0">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                <h2 class="text-[18px] font-bold text-slate-800 dark:text-white tracking-tight">问题聚焦</h2>
            </div>

            <div class="flex items-center space-x-2.5 flex-wrap gap-y-2 justify-end">
                <div class="relative">
                    <select id="filter-level" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-32 shadow-sm">
                        <option value="暂不发送">暂不发送</option>
                        <option value="仅发送">仅发送</option>
                        <option value="需审核">需审核</option>
                    </select>
                </div>

                <div class="relative" id="custom-cascader">
                    <button type="button" id="cascader-trigger" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-44 shadow-sm flex items-center justify-between group">
                        <span id="cascader-text" class="truncate text-slate-500">请选择类别</span>
                        <i id="cascader-clear" class="ri-close-line hidden text-slate-400 hover:text-red-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full px-0.5 cursor-pointer flex-none text-[13px]" title="清除类别"></i>
                        <i id="cascader-icon" class="ri-arrow-up-s-line text-slate-300 group-hover:text-slate-400 transition-transform rotate-180 flex-none"></i>
                    </button>
                    <div id="cascader-popover" class="hidden absolute top-full right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-lg shadow-xl popover-shadow z-50 flex overflow-hidden w-[700px]">
                        <div class="w-[180px] shrink-0 border-r border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-1" id="cascader-categories"></div>
                        <div class="w-[200px] shrink-0 border-r border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-1" id="cascader-subs"></div>
                        <div class="flex-1 bg-white dark:bg-slate-800 py-1 max-h-[340px] overflow-y-auto custom-scrollbar" id="cascader-options"></div>
                    </div>
                </div>

                <div class="relative">
                    <input type="text" id="filter-keyword" placeholder="搜索问题名称" autocomplete="off"
                           class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-8 pr-3 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all w-36 shadow-sm"
                           onkeydown="if(event.key==='Enter')applyFilter()">
                    <i class="ri-search-line absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>

                <div class="flex items-center gap-2">
                    <!-- 保持原版下拉逻辑，用于选择单月 -->
                    <div class="relative" id="custom-datepicker">
                        <button type="button" id="datepicker-trigger" class="appearance-none bg-white border border-slate-200 rounded pl-8 pr-2 py-1.5 text-[12px] text-slate-700 focus:outline-none transition-all cursor-pointer hover:border-blue-400 w-[140px] flex items-center group shadow-sm">
                            <i class="ri-calendar-line text-slate-400 group-hover:text-blue-500 absolute left-2.5 transition-colors"></i>
                            <span id="datepicker-text" class="text-slate-500 truncate">选择年月</span>
                        </button>
                        <div id="datepicker-popover" class="hidden absolute top-full right-0 mt-1 bg-white border border-slate-100 rounded-lg shadow-xl popover-shadow z-50 p-4 w-[300px]">
                            <div id="dp-container"></div>
                        </div>
                    </div>
                </div>

                <div class="relative hidden">
                    <select id="filter-survey" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">是否调查反馈</option>
                        <option value="是">是</option>
                        <option value="否">否</option>
                    </select>
                </div>

                <div class="relative hidden">
                    <select id="filter-reject" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">是否驳回</option>
                        <option value="是">是</option>
                        <option value="否">否</option>
                    </select>
                </div>

                <div class="relative hidden">
                    <select id="filter-closed" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">是否销号</option>
                        <option value="是">是</option>
                        <option value="否">否</option>
                    </select>
                </div>

                <div class="relative">
                    <select id="filter-lake" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">请选择湖库</option>
                        <option value="梁子湖">梁子湖</option>
                        <option value="洪湖">洪湖</option>
                        <option value="丹江口水库">丹江口水库</option>
                    </select>
                </div>

                <div class="relative">
                    <select id="filter-basin1" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">选择一级流域</option>
                        <option value="长江干流流域">长江干流流域</option>
                        <option value="汉江流域">汉江流域</option>
                        <option value="清江流域">清江流域</option>
                    </select>
                </div>

                <div class="relative">
                    <select id="filter-basin2" class="appearance-none bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded pl-3 pr-8 py-1.5 text-[13px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer hover:border-blue-400 w-36 shadow-sm">
                        <option value="全部">选择二级流域</option>
                        <option value="富水片区">富水片区</option>
                        <option value="鄂东南片区">鄂东南片区</option>
                        <option value="四湖片区">四湖片区</option>
                    </select>
                </div>

                <button onclick="applyFilter()" class="bg-[#3b82f6] hover:bg-blue-600 text-white px-4 py-1.5 rounded text-[13px] transition-colors shadow-sm font-medium flex items-center space-x-1">
                    <i class="ri-search-line"></i><span>搜索</span>
                </button>
                <button onclick="resetFilter()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded text-[13px] transition-colors font-medium">
                    重置
                </button>
            </div>
        </div>

        <!-- 问题聚焦清单 (保持原版的 4 个 Tab 和表格结构) -->
        <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 card-shadow flex flex-col overflow-hidden mb-6 z-10 relative">
            <div class="pl-0 pt-0 pb-0 flex flex-wrap items-end gap-3 justify-between shrink-0 bg-slate-50/50 dark:bg-slate-800/30">
                <div class="flex items-end gap-3">
                    <div id="status-tabs" class="flex items-end gap-1">
                        <div id="status-tab-all" class="status-tab active">全部<span class="tab-count"></span></div>
                        <div data-tab="未反馈" class="status-tab">未反馈<span class="tab-count"></span></div>
                        <div data-tab="已反馈" class="status-tab">已反馈<span class="tab-count"></span></div>
                        <div data-tab="已驳回" class="status-tab">已驳回<span class="tab-count"></span></div>
                        <div data-tab="已销号" class="status-tab">已销号<span class="tab-count"></span></div>
                    </div>
                </div>
                <div class="flex items-center gap-2 pr-5 self-center">
                    <div id="source-segmented" class="flex items-center gap-1">
                        <div data-source="全部" class="source-btn active">全部</div>
                        <div data-source="手工录入" class="source-btn">手工录入</div>
                        <div data-source="系统识别" class="source-btn">系统识别</div>
                        <div data-source="外部系统调度" class="source-btn">外部系统调度</div>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="data-table">

        activeSubIndex = index;
        renderSubs();
        renderOptions();
    };

    function renderOptions() {
        const level = document.getElementById('filter-level').value;
        const cat = cascaderData[activeCategoryIndex];
        const sub = cat ? cat.children[activeSubIndex] : null;
        if (!sub) { cascaderOptions.innerHTML = ''; return; }
        let html = '';
        let visibleCount = 0;
        sub.items.forEach((item, index) => {
            if ((item.send || '暂不发送') !== level) return;
            visibleCount++;
            html += `<div class="px-4 py-2 cursor-pointer text-[12px] leading-snug text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-colors" onclick="selectCascaderOption(${index})">${item.name}</div>`;
        });
        if (!visibleCount) html = '<div class="px-4 py-3 text-[12px] text-slate-400">无匹配规则</div>';
        cascaderOptions.innerHTML = html;
    }

    window.selectCascaderOption = function(index) {
        const opt = cascaderData[activeCategoryIndex].children[activeSubIndex].items[index];
        selectedCategory = opt.name;
        selectedCategorySub = cascaderData[activeCategoryIndex].children[activeSubIndex].category;
        cascaderText.innerText = selectedCategory;
        cascaderText.classList.replace('text-slate-500', 'text-slate-800');
        if (cascaderClear) cascaderClear.classList.remove('hidden');
        setDpForm(opt.time || '年月');
        // 联动“问题流程”下拉：同步该识别规则的 send 状态
        if (opt.send) {
            document.getElementById('filter-level').value = opt.send;
            updateStatusTabsVisibility();
        }
        closeCascader();
        applyFilter();
    };

    window.clearCascader = function() {
        selectedCategory = '';
        selectedCategorySub = '';
        cascaderText.innerText = '请选择类别';
        cascaderText.classList.replace('text-slate-800', 'text-slate-500');
        if (cascaderClear) cascaderClear.classList.add('hidden');
        setDpForm('年月');
        applyFilter();
    };

    if (cascaderClear) cascaderClear.addEventListener('click', (e) => { e.stopPropagation(); clearCascader(); });

    function toggleCascader() {
        if (cascaderPopover.classList.contains('hidden')) {
            closeDatepicker();
            cascaderPopover.classList.remove('hidden');
            cascaderIcon.classList.add('rotate-180');
            cascaderTrigger.classList.add('border-blue-500');
            renderCategories();
        } else {
            closeCascader();
        }
    }

    function closeCascader() {
        cascaderPopover.classList.add('hidden');
        cascaderIcon.classList.remove('rotate-180');
        cascaderTrigger.classList.remove('border-blue-500');
    }
    if (cascaderTrigger) cascaderTrigger.addEventListener('click', toggleCascader);

    // ========== 原版日期选择器（支持 年月 / 日 / 季度 / 年 四种形式） ==========
    const dpTrigger = document.getElementById('datepicker-trigger');
    const dpPopover = document.getElementById('datepicker-popover');
    const dpContainer = document.getElementById('dp-container');
    const dpText = document.getElementById('datepicker-text');
    let dpForm = '年月';          // 年月 | 日 | 季度 | 年
    let selectedYearMonth = '';
    let dpCurrentYear = 2026;
    let dpCurrentMonth = 6;

    function dpPlaceholder() {
        if (dpForm === '日') return '选择日期';
        if (dpForm === '季度') return '选择季度';
        if (dpForm === '年') return '选择年份';
        return '选择年月';
    }

    function renderDatepicker() {
        let html = '';
        // 顶部年份导航
        html += `<div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">`;
        html += `<button type="button" data-dpnav="prev-year" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-left-double-line text-lg"></i></button>`;
        html += `<span class="font-medium text-[15px] text-slate-700">${dpCurrentYear} 年</span>`;
        html += `<button type="button" data-dpnav="next-year" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-right-double-line text-lg"></i></button>`;
        html += `</div>`;

        if (dpForm === '年月') {
            html += `<div class="grid grid-cols-4 gap-y-4 gap-x-2 text-center">`;
            for(let i=1; i<=12; i++){
                const mv = String(i).padStart(2, '0');
                const val = dpCurrentYear + '-' + mv;
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-2 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${i}月</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '日') {
            html += `<div class="flex justify-between items-center mb-2">`;
            html += `<button type="button" data-dpnav="prev-month" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-left-s-line text-lg"></i></button>`;
            html += `<span class="text-[13px] font-medium text-slate-700">${dpCurrentYear} 年 ${dpCurrentMonth} 月</span>`;
            html += `<button type="button" data-dpnav="next-month" class="text-slate-400 hover:text-blue-500 transition-colors px-1"><i class="ri-arrow-right-s-line text-lg"></i></button>`;
            html += `</div>`;
            const weekdays = ['日','一','二','三','四','五','六'];
            html += `<div class="grid grid-cols-7 gap-1 text-center text-[11px] text-slate-400 mb-1">`;
            weekdays.forEach(w => html += `<span>${w}</span>`);
            html += `</div>`;
            const firstDay = new Date(dpCurrentYear, dpCurrentMonth-1, 1).getDay();
            const daysInMonth = new Date(dpCurrentYear, dpCurrentMonth, 0).getDate();
            html += `<div class="grid grid-cols-7 gap-1 text-center">`;
            for (let i=0;i<firstDay;i++) html += `<span></span>`;
            for (let d=1; d<=daysInMonth; d++){
                const val = dpCurrentYear + '-' + String(dpCurrentMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-1.5 text-[12px] rounded-lg transition-colors ${isActive ? 'bg-blue-500 text-white font-bold' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-600'}">${d}</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '季度') {
            html += `<div class="grid grid-cols-2 gap-3 text-center">`;
            for (let q=1; q<=4; q++){
                const val = dpCurrentYear + '-Q' + q;
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-3 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${q}季度</button>`;
            }
            html += `</div>`;
        } else if (dpForm === '年') {
            html += `<div class="grid grid-cols-3 gap-3 text-center">`;
            const startY = dpCurrentYear - 4;
            for (let i=0; i<12; i++){
                const y = startY + i;
                const val = String(y);
                const isActive = selectedYearMonth === val;
                html += `<button type="button" data-dpval="${val}" class="py-2 text-[13px] rounded-lg transition-colors border ${isActive ? 'bg-blue-50 border-blue-500 text-blue-600 font-bold' : 'border-transparent text-slate-600 hover:text-blue-600 hover:bg-blue-50'}">${y}年</button>`;
            }
            html += `</div>`;
        }
        dpContainer.innerHTML = html;
    }

    function toggleDatepicker() {
        if (dpPopover.classList.contains('hidden')) {
            closeCascader();
            dpPopover.classList.remove('hidden');
            dpTrigger.classList.add('border-blue-500');
            renderDatepicker();
        } else {
            closeDatepicker();
        }
    }

    function closeDatepicker() {
        dpPopover.classList.add('hidden');
        dpTrigger.classList.remove('border-blue-500');
    }

    function selectYearMonth(val) {
        selectedYearMonth = val;
        if (val) {
            if (dpForm === '季度') {
                const [yy, q] = val.split('-Q');
                dpCurrentYear = Number(yy);
                dpText.innerText = yy + ' 年 ' + q + ' 季度';
            } else if (dpForm === '年') {
                dpCurrentYear = Number(val);
                dpText.innerText = val + ' 年';
            } else if (dpForm === '日') {
                const [yy, mm, dd] = val.split('-');
                dpCurrentYear = Number(yy);
                dpCurrentMonth = Number(mm);
                dpText.innerText = yy + ' 年 ' + Number(mm) + ' 月 ' + Number(dd) + ' 日';
            } else {
                const [yy, mm] = val.split('-');
                dpCurrentYear = Number(yy);
                dpText.innerText = yy + ' 年 ' + Number(mm) + ' 月';
            }
            dpText.classList.replace('text-slate-500', 'text-slate-800');
        } else {
            dpText.innerText = dpPlaceholder();
            dpText.classList.replace('text-slate-800', 'text-slate-500');
        }
        applyFilter();
    }

    function setDpForm(form) {
        const nextForm = (form === '日' || form === '季度' || form === '年') ? form : '年月';
        if (nextForm === dpForm && dpText.classList.contains('text-slate-800')) return; // 形式未变且已有选中，保留
        dpForm = nextForm;
        selectedYearMonth = '';
        dpText.innerText = dpPlaceholder();
        dpText.classList.replace('text-slate-800', 'text-slate-500');
        renderDatepicker();
    }

    function matchTimeValue(dateStr) {
        if (!selectedYearMonth) return true;
        if (dpForm === '季度') {
            const [yy, q] = selectedYearMonth.split('-Q');
            const m = Number(dateStr.slice(5, 7));
            const quarter = Math.ceil(m / 3);
            return dateStr.slice(0, 4) === yy && quarter === Number(q);
        }
        return dateStr.startsWith(selectedYearMonth);
    }

    if (dpTrigger) dpTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleDatepicker(); });

    dpPopover.addEventListener('click', (e) => {
        const navBtn = e.target.closest('button[data-dpnav]');
        if (navBtn) {
            const action = navBtn.getAttribute('data-dpnav');
            if (action === 'prev-year') dpCurrentYear--;
            else if (action === 'next-year') dpCurrentYear++;
            else if (action === 'prev-month') { dpCurrentMonth--; if (dpCurrentMonth < 1) { dpCurrentMonth = 12; dpCurrentYear--; } }
            else if (action === 'next-month') { dpCurrentMonth++; if (dpCurrentMonth > 12) { dpCurrentMonth = 1; dpCurrentYear++; } }
            renderDatepicker();
            return;
        }
        const valBtn = e.target.closest('button[data-dpval]');
        if (valBtn) {
            const val = valBtn.getAttribute('data-dpval');
            closeDatepicker();
            selectYearMonth(selectedYearMonth === val ? '' : val);
        }
    });

    document.addEventListener('click', (e) => {
        if (!document.getElementById('custom-cascader').contains(e.target)) closeCascader();
        if (!document.getElementById('custom-datepicker').contains(e.target)) closeDatepicker();
    });

    // ========== 数据与逻辑联动 ==========
    let selectedSource = '全部';
    document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedSource = btn.dataset.source;
            document.querySelectorAll('.source-btn').forEach(b => b.classList.toggle('active', b.dataset.source === selectedSource));
            applyFilter();
        });
    });

    let selectedStatusTab = '';
    const statusTabAll = document.getElementById('status-tab-all');

    function renderStatusTabsActive() {
        statusTabAll.classList.toggle('active', selectedStatusTab === '');
        document.querySelectorAll('#status-tabs .status-tab[data-tab]').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === selectedStatusTab);
        });
    }

    function updateStatusTabsVisibility() {
        const levelVal = document.getElementById('filter-level').value;
        const isSendMode = (levelVal === '暂不发送' || levelVal === '仅发送');
        document.querySelectorAll('#status-tabs .status-tab[data-tab]').forEach(b => {
            b.classList.toggle('hidden', isSendMode);
        });
        // “全部”始终显示
        statusTabAll.classList.remove('hidden');
        // 切换问题流程时，默认选中“全部”（蓝色底）
        selectedStatusTab = '';
        renderStatusTabsActive();
    }

    function renderStatusTabCounts() {
        const data = chartData;
        const setCount = (selector, n) => {
            const el = document.querySelector(`#status-tabs .status-tab${selector} .tab-count`);
            if (el) el.textContent = `(${n})`;
        };
        setCount('#status-tab-all', data.length);
        setCount('[data-tab="未反馈"]', data.filter(i => (i.status === 'pending' || i.status === 'inprogress') && i.reject !== '是').length);
        setCount('[data-tab="已反馈"]', data.filter(i => i.status === 'done' && i.reject !== '是').length);
        setCount('[data-tab="已驳回"]', data.filter(i => i.reject === '是').length);
        setCount('[data-tab="已销号"]', data.filter(i => i.status === 'closed' && i.reject !== '是').length);
    }

    document.querySelectorAll('#status-tabs .status-tab[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedStatusTab = (selectedStatusTab === btn.dataset.tab) ? '' : btn.dataset.tab;
            renderStatusTabsActive();
            applyFilter();
        });
    });
    if (statusTabAll) {
        statusTabAll.addEventListener('click', () => {
            selectedStatusTab = '';
            renderStatusTabsActive();
            applyFilter();
        });
    }

    function matchStatusTab(item, tab) {
        if (!tab) return true;
        if (tab === '未反馈') return (item.status === 'pending' || item.status === 'inprogress') && item.reject !== '是';
        if (tab === '已反馈') return item.status === 'done' && item.reject !== '是';
        if (tab === '已驳回') return item.reject === '是';
        if (tab === '已销号') return item.status === 'closed' && item.reject !== '是';
        return true;
    }

    function updateConditionalFilterVisibility() {
        // 是否调查反馈/驳回/销号 筛选已隐藏，始终保持“全部”
        ['filter-survey', 'filter-reject', 'filter-closed'].forEach(id => {
            document.getElementById(id).value = '全部';
        });
        // 问题流程切换后，级联里的识别规则按 send 联动过滤，重置到第一项
        activeCategoryIndex = 0;
        activeSubIndex = 0;
        if (!cascaderPopover.classList.contains('hidden')) {
            renderCategories();
        }
        updateStatusTabsVisibility();
        applyFilter();
    }
    document.getElementById('filter-level').addEventListener('change', updateConditionalFilterVisibility);

    let filteredData = [];
    let chartData = [];
    const rowsPerPage = 10;
    let currentPage = 1;

    function applyFilter() {
        const f = {
            survey: document.getElementById('filter-survey').value,
            reject: document.getElementById('filter-reject').value,
            closed: document.getElementById('filter-closed').value,
            level: document.getElementById('filter-level').value,
            lake: document.getElementById('filter-lake').value,
            basin1: document.getElementById('filter-basin1').value,
            basin2: document.getElementById('filter-basin2').value,
            category: selectedCategorySub,
            source: selectedSource,
            keyword: (document.getElementById('filter-keyword').value || '').trim()
        };

        chartData = focusData.filter(item => {
            if (f.survey !== '全部' && item.survey !== f.survey) return false;
            if (f.reject !== '全部' && item.reject !== f.reject) return false;
            if (f.closed !== '全部' && item.closed !== f.closed) return false;
            if (f.level !== '全部' && item.level !== f.level) return false;
            if (f.lake !== '全部' && item.lake !== f.lake) return false;
            if (f.basin1 !== '全部' && item.basin1 !== f.basin1) return false;
            if (f.basin2 !== '全部' && item.basin2 !== f.basin2) return false;
            if (f.category && item.category !== f.category) return false;
            if (f.source !== '全部' && item.source !== f.source) return false;
            if (f.keyword && !item.name.includes(f.keyword)) return false;
            return true;
        });

        renderStatusTabCounts();

        filteredData = selectedYearMonth ? chartData.filter(i => matchTimeValue(i.date)) : chartData;
        filteredData = filteredData.filter(item => matchStatusTab(item, selectedStatusTab));

        currentPage = 1;
        renderTable();
    }

    function resetFilter() {
        document.getElementById('filter-level').value = '暂不发送';
        document.getElementById('filter-survey').value = '全部';
        document.getElementById('filter-reject').value = '全部';
        document.getElementById('filter-closed').value = '全部';
        document.getElementById('filter-lake').value = '全部';
        document.getElementById('filter-basin1').value = '全部';
        document.getElementById('filter-basin2').value = '全部';
        document.getElementById('filter-keyword').value = '';
        clearCascader();
        selectYearMonth('');
        selectedSource = '全部';
        document.querySelectorAll('.source-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
        selectedStatusTab = '';
        renderStatusTabsActive();
        updateConditionalFilterVisibility();
    }

    // 渲染表格 (保持原版逻辑与字段，不乱动)
    function renderTable() {
        const tbody = document.getElementById('focus-table-body');
        const total = filteredData.length;
        document.getElementById('focus-total').innerText = total;

        const totalPages = Math.ceil(total / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, total);

        let html = '';
        for (let i = start; i < end; i++) {
            const item = filteredData[i];
            const noProcess = (item.level === '暂不发送' || item.level === '仅发送');
            let statusCell, closedCell, sourceCell;

            if (item.reject === '是') {
                // 已驳回：问题状态显示“已驳回”
                statusCell = '<span class="status-tag status-reject">已驳回</span>';
                closedCell = item.closed === "是" ? '<span class="closed-tag closed-yes">是</span>' : '<span class="closed-tag closed-no">否</span>';
            } else if (noProcess) {
                statusCell = `<span class="status-tag status-na">${item.level === '仅发送' ? '已发送' : item.level}</span>`;
                closedCell = '<span class="text-slate-400">—</span>';
            } else {
                const s = statusMap[item.status];
                statusCell = `<span class="status-tag ${s.cls}">${s.label}</span>`;
                closedCell = item.closed === "是" ? '<span class="closed-tag closed-yes">是</span>' : '<span class="closed-tag closed-no">否</span>';
            }
            // 已驳回：第二列用红色字标识驳回原因，过长时省略号截断并悬浮显示完整内容
            sourceCell = (item.reject === '是')
                ? `<span class="reject-reason" title="${item.reason || '已驳回'}">${item.reason || '已驳回'}</span>`
                : item.source;

            html += `
                <tr>
                    <td class="text-left pl-6 font-medium text-blue-600">${item.name}</td>
                    <td>${sourceCell}</td>
                    <td><span class="type-tag ${categoryStyles[item.category] || 'text-slate-600'}">${item.category}</span></td>
                    <td>${item.basin}</td>
                    <td>${item.date}</td>
                    <td class="font-medium text-slate-800">${item.city}</td>
                    <td>${statusCell}</td>
                    <td>${closedCell}</td>
                </tr>`;
        }
        tbody.innerHTML = html || '<tr><td colspan="8" class="py-10 text-slate-400"><i class="ri-inbox-2-line text-2xl mb-1 block"></i>暂无符合条件的记录</td></tr>';

        // 翻页器
        let pageHtml = `<button onclick="goPage(${currentPage - 1})" ${currentPage===1?'disabled':''} class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-30">上一页</button>`;
        for (let p=1; p<=totalPages; p++) {
            pageHtml += `<button onclick="goPage(${p})" class="px-2.5 py-1 text-xs rounded font-medium ${p===currentPage ? 'bg-blue-600 text-white' : 'border border-slate-200 text-slate-600 hover:bg-slate-50'}">${p}</button>`;
        }
        pageHtml += `<button onclick="goPage(${currentPage + 1})" ${currentPage===totalPages?'disabled':''} class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-30">下一页</button>`;
        document.getElementById('focus-pagination').innerHTML = pageHtml;
    }

    window.goPage = function(p) { currentPage = p; renderTable(); };

    // 初始化
    window.addEventListener('load', () => {
        const provGroup = document.getElementById('group-provincial');
        if (provGroup) provGroup.style.maxHeight = provGroup.scrollHeight + "px";
        updateConditionalFilterVisibility();
    });
</script>

</body>
</html>
