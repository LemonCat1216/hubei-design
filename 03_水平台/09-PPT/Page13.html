<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流域湖库：长江流域分析</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
    /* 左侧状态墙矩阵 */
    .status-wall-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 4列紧凑排布 */
        gap: 5px; 
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
    }
    .status-wall-grid::-webkit-scrollbar { width: 3px; }
    .status-wall-grid::-webkit-scrollbar-thumb { background: var(--ppt-bg-muted-strong); border-radius: 2px; }

    .status-node {
        background: var(--ppt-bg-muted);
        border: 1px solid var(--ppt-border-default);
        border-radius: 1px;
        padding: 4px 6px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1px;
    }
    .status-node::before { content: none; }
    .status-node.wq-ii { background: var(--wq-bg-ii); border-color: var(--wq-border-ii); }
    .status-node.wq-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); }
    .status-node.wq-iv { background: var(--wq-bg-iv); border-color: var(--wq-border-iv); }
    .status-node.wq-v { background: var(--wq-bg-v); border-color: var(--wq-border-v); }
    .status-node.wq-inferior-v { background: var(--wq-bg-inferior-v); border-color: var(--wq-border-inferior-v); }
    .status-node.wq-inferior-v { order: 1; }
    .status-node.wq-v { order: 2; }
    .status-node.wq-iv { order: 3; }
    .status-node.wq-iii { order: 4; }
    .status-node.wq-ii { order: 5; }
    .status-node.wq-ii .node-name { color: var(--wq-text-ii); }
    .status-node.wq-iii .node-name { color: var(--wq-text-iii); }
    .status-node.wq-iv .node-name { color: var(--wq-text-iv); }
    .status-node.wq-v .node-name { color: var(--wq-text-v); }
    .status-node.wq-inferior-v .node-name { color: var(--wq-text-inferior-v); }

    .node-name { font-size: 8px; font-weight: 700; color: #1E293B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-meta { display: flex; justify-content: space-between; align-items: center; font-size: 7.5px; color: #64748B; }
    .node-tag { padding: 0px 3px; font-size: 7px; font-weight: 700; border-radius: 1px; color: #fff; }
    .node-tag.ii { background: var(--wq-chart-ii); }
    .node-tag.iii { background: var(--wq-chart-iii); }
    .node-tag.iv { background: var(--wq-chart-iv); }
    .node-tag.v { background: var(--wq-chart-v); }
    .node-tag.inferior-v { background: var(--wq-chart-inferior-v); }

    /* 右侧抗变形组件样式 - 抽离至样式表，规避内联样式拉伸冲突 */
    .risk-container-fixed {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        overflow: hidden; /* 防止溢出变形 */
    }
    .risk-grid-fixed {
        flex: 1;
        display: grid;
        grid-template-rows: repeat(5, 1fr); /* 绝对 5 等分，纵向永不变形 */
        gap: 5px;
        min-height: 0;
    }
    .risk-row-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
        min-height: 0;
        box-sizing: border-box;
    }
    /* 严格分配内部横向比例，配合 ellipsis 阻断因变形引起的文字换行 */
    .col-loc-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: 0 0 32%;
        max-width: 32%;
        overflow: hidden;
    }
    .col-detail-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: 0 0 52%;
        max-width: 52%;
        padding-left: 8px;
        font-size: 8.5px;
        color: #475569;
        overflow: hidden;
    }
    .col-badge-info {
        flex: 0 0 16%;
        max-width: 16%;
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
    }
    .risk-text-ellipsis {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .wq-category-grid {
        flex: 1;
        display: grid;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 6px;
        min-height: 0;
    }
    .wq-class-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-height: 0;
        padding: 7px 10px;
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        background: var(--ppt-bg-slide);
    }
    .wq-class-card.inferior { background: var(--wq-bg-inferior-v); border-color: var(--wq-border-inferior-v); }
    .wq-class-card.class-v { background: var(--wq-bg-v); border-color: var(--wq-border-v); }
    .wq-class-card.class-iv { background: var(--wq-bg-iv); border-color: var(--wq-border-iv); }
    .wq-class-card.class-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); }
    .wq-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wq-card-title { font-size: 9.2px; line-height: 1.2; font-weight: 800; }
    .wq-class-card.inferior .wq-card-title { color: var(--wq-text-inferior-v); }
    .wq-class-card.class-v .wq-card-title { color: var(--wq-text-v); }
    .wq-class-card.class-iv .wq-card-title { color: var(--wq-text-iv); }
    .wq-class-card.class-iii .wq-card-title { color: var(--wq-text-iii); }
    .wq-card-badge { flex-shrink: 0; padding: 1px 5px; border-radius: 1px; font-size: 7.2px; line-height: 1.25; font-weight: 800; color: var(--ppt-bg-slide); }
    .wq-class-card.inferior .wq-card-badge { background: var(--wq-chart-inferior-v); }
    .wq-class-card.class-v .wq-card-badge { background: var(--wq-chart-v); }
    .wq-class-card.class-iv .wq-card-badge { background: var(--wq-chart-iv); }
    .wq-class-card.class-iii .wq-card-badge { background: var(--wq-chart-iii); }
    .wq-card-line { font-size: 8px; line-height: 1.45; color: var(--ppt-chart-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .basin-map-placeholder {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        overflow: hidden;
    }
    .basin-map-placeholder::before {
        content: "";
        position: absolute;
        width: 78%;
        height: 58%;
        border: 2px solid var(--ppt-border-info);
        background: var(--ppt-bg-info);
        clip-path: polygon(8% 44%, 22% 22%, 42% 30%, 56% 16%, 78% 26%, 92% 48%, 82% 70%, 62% 64%, 46% 82%, 26% 72%);
    }
    .basin-map-placeholder::after {
        content: "";
        position: absolute;
        width: 56%;
        height: 2px;
        background: var(--ppt-chart-series-5);
        transform: rotate(-8deg);
        opacity: .75;
    }
    .basin-map-title {
        position: relative;
        z-index: 1;
        padding: 8px 14px;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 800;
        color: var(--ppt-chart-text-strong);
        letter-spacing: 0;
    }
</style>
</head>
<body>
<div class="slide-container">
    <div class="ppt-header"><span class="ppt-title">流域湖库分析：长江流域分析</span><span class="nav-page-num">P13</span></div>
    <div class="core-bar">▎ 2026年5月（当前月），长江干流湖北段 42 个国控断面水质总体稳定，Ⅰ-Ⅲ 类比例为 88.1%，流域内 5 个国控断面存在超标。</div>
    <div class="bd" style="flex-direction:column;gap:10px;">
        <div class="kpi-row" style="margin-bottom:0;">
            <div class="kpi-card" style=""><div class="kpi-label" style="color:#1E40AF;">监测断面总数</div><div class="kpi-value" style="color:#1E40AF;">42个</div></div>
            <div class="kpi-card" style=""><div class="kpi-label" style="color:var(--wq-text-iii);">Ⅰ-Ⅲ类比例</div><div class="kpi-value" style="color:var(--wq-text-iii);">88.1%</div></div>
            <div class="kpi-card status-alert" style=""><div class="kpi-label">超标断面</div><div class="kpi-value">5个</div></div>
            <div class="kpi-card status-warn" style=""><div class="kpi-label">同比变化</div><div class="kpi-value">↓1.2%</div></div>
        </div>
        
        <div class="watershed-main-row">
            <div class="table-box watershed-left-panel" style="flex:0 0 55%; display:flex; flex-direction:column; padding:8px; background:var(--ppt-bg-muted); border:1px solid var(--ppt-border-default); border-radius:4px;">
                <div class="basin-map-placeholder">
                    <div class="basin-map-title">长江流域 超标断面分布</div>
                </div>
            </div>
            <div class="risk-container-fixed content-panel watershed-right-panel">
                <div class="right-panel-heading" style="color: var(--wq-text-inferior-v);">长江水质分级管控</div>
                <div class="wq-category-grid">
                    <div class="wq-class-card inferior">
                        <div class="wq-card-head"><span class="wq-card-title">劣Ⅴ类（3个）</span><span class="wq-card-badge">优先排查</span></div>
                        <div class="wq-card-line">四湖总干渠：COD、氨氮超标</div>
                        <div class="wq-card-line">府河孝感段、竹皮河口：氨氮、总磷超标</div>
                    </div>
                    <div class="wq-class-card class-v">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅴ类（1个）</span><span class="wq-card-badge">动态监控</span></div>
                        <div class="wq-card-line">支流天门河：总磷超标</div>
                        <div class="wq-card-line">保持日常监测，关注水质变化趋势</div>
                    </div>
                    <div class="wq-class-card class-iv">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅳ类（1个）</span><span class="wq-card-badge">持续跟踪</span></div>
                        <div class="wq-card-line">汉川汉江口：溶解氧超标</div>
                        <div class="wq-card-line">当前已改善，继续跟踪断面波动</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ft"><span>2026年5月生态环境月度专报</span><span>提示：仅供汇报使用</span></div>
</div>
</body>
</html>
