<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流域湖库：汉江流域分析</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
    /* 左侧汉江片区化状态墙布局 */
    .hanjiang-wall-box { 
        display: flex; 
        flex-direction: column; 
        gap: 5px; 
        flex: 1; 
        overflow-y: auto; 
    }
    .region-block { 
        background: var(--ppt-bg-slide); 
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        padding: 5px 6px; 
    }
    .region-title { 
        font-size: 8px; 
        font-weight: 700; 
        color: #1E293B; 
        margin-bottom: 4px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding-bottom: 2px; 
    }
    
    /* 升级为 5 列紧凑网格，完美消化 52 个断面 */
    .region-grid { 
        display: grid; 
        grid-template-columns: repeat(5, 1fr); 
        gap: 4px; 
    }
    
    .mini-node { 
        padding: 3px 4px; 
        font-size: 7.5px; 
        font-weight: 600; 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        border-radius: 1px; 
        border: 1px solid var(--ppt-border-default);
    }
    .mini-node.good { background: var(--ppt-bg-good); border-color: var(--ppt-border-good); color: #15803D; }
    .mini-node.warn { background: var(--ppt-bg-warn); border-color: var(--ppt-border-warn); color: #B45309; }
    .mini-node.alert { background: var(--ppt-bg-alert); border-color: var(--ppt-border-alert); color: #B91C1C; }
    .mini-node.class-i { background: var(--wq-bg-i); border-color: var(--wq-border-i); color: var(--wq-text-i); }
    .mini-node.class-ii { background: var(--wq-bg-ii); border-color: var(--wq-border-ii); color: var(--wq-text-ii); }
    .mini-node.class-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); color: var(--wq-text-iii); }
    .mini-node.class-iv-v { background: var(--wq-bg-inferior-v); border-color: var(--wq-border-inferior-v); color: var(--wq-text-inferior-v); }
    .mini-node.class-i .node-dot { background: var(--wq-chart-i); }
    .mini-node.class-ii .node-dot { background: var(--wq-chart-ii); }
    .mini-node.class-iii .node-dot { background: var(--wq-chart-iii); }
    .mini-node.class-iv-v .node-dot { background: var(--wq-chart-inferior-v); }
    
    .node-dot { width: 3.5px; height: 3.5px; border-radius: 50%; }
    .mini-node.good .node-dot { background: #047857; }
    .mini-node.warn .node-dot { background: #B45309; }
    .mini-node.alert .node-dot { background: #991B1B; }

    /* 右侧通用自适应列表组件（结构同P13） */
    .risk-list-wrapper { display: flex; flex-direction: column; gap: 5px; flex: 1; min-height: 0; }
    .risk-row-item { background: var(--ppt-bg-alert); border: 1px solid var(--ppt-border-alert);
    padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; flex: 1; }
    .risk-row-item.warning-style { background: var(--ppt-bg-warn); border-color: var(--ppt-border-warn); border-color: var(--ppt-border-warn); }
    .risk-loc-info { display: flex; flex-direction: column; gap: 1px; flex: 0 0 35%; }
    .risk-name { font-size: 9.5px; font-weight: 800; color: #991B1B; }
    .risk-row-item.warning-style .risk-name { color: #92400E; }
    .risk-type { font-size: 7.5px; color: #7F1D1D; opacity: 0.7; }
    .risk-detail-info { display: flex; flex-direction: column; gap: 1px; font-size: 8.5px; color: #475569; flex: 1; padding-left: 10px; }
    .risk-badge { white-space: nowrap; }
    .wq-category-grid {
        flex: 1;
        display: grid;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 6px;
        min-height: 0;
    }
    .wq-class-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-height: 0;
        padding: 7px 10px;
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        background: var(--ppt-bg-slide);
    }
    .wq-class-card.inferior { background: var(--wq-bg-inferior-v); border-color: var(--wq-border-inferior-v); }
    .wq-class-card.class-v { background: var(--wq-bg-v); border-color: var(--wq-border-v); }
    .wq-class-card.class-iv { background: var(--wq-bg-iv); border-color: var(--wq-border-iv); }
    .wq-class-card.class-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); }
    .wq-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wq-card-title { font-size: 9.2px; line-height: 1.2; font-weight: 800; }
    .wq-class-card.inferior .wq-card-title { color: var(--wq-text-inferior-v); }
    .wq-class-card.class-v .wq-card-title { color: var(--wq-text-v); }
    .wq-class-card.class-iv .wq-card-title { color: var(--wq-text-iv); }
    .wq-class-card.class-iii .wq-card-title { color: var(--wq-text-iii); }
    .wq-card-badge { flex-shrink: 0; padding: 1px 5px; border-radius: 1px; font-size: 7.2px; line-height: 1.25; font-weight: 800; color: var(--ppt-bg-slide); }
    .wq-class-card.inferior .wq-card-badge { background: var(--wq-chart-inferior-v); }
    .wq-class-card.class-v .wq-card-badge { background: var(--wq-chart-v); }
    .wq-class-card.class-iv .wq-card-badge { background: var(--wq-chart-iv); }
    .wq-class-card.class-iii .wq-card-badge { background: var(--wq-chart-iii); }
    .wq-card-line { font-size: 8px; line-height: 1.45; color: var(--ppt-chart-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .basin-map-placeholder {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        overflow: hidden;
    }
    .basin-map-placeholder::before {
        content: "";
        position: absolute;
        width: 78%;
        height: 58%;
        border: 2px solid var(--ppt-border-info);
        background: var(--ppt-bg-info);
        clip-path: polygon(8% 44%, 22% 22%, 42% 30%, 56% 16%, 78% 26%, 92% 48%, 82% 70%, 62% 64%, 46% 82%, 26% 72%);
    }
    .basin-map-placeholder::after {
        content: "";
        position: absolute;
        width: 56%;
        height: 2px;
        background: var(--ppt-chart-series-5);
        transform: rotate(-8deg);
        opacity: .75;
    }
    .basin-map-title {
        position: relative;
        z-index: 1;
        padding: 8px 14px;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 800;
        color: var(--ppt-chart-text-strong);
        letter-spacing: 0;
    }
</style>
</head>
<body>
<div class="slide-container">
    <div class="ppt-header"><span class="ppt-title">流域湖库分析：汉江流域分析</span><span class="nav-page-num">P14</span></div>
    <div class="core-bar">▎ 2026年5月（当前月），汉江流域52个国控断面Ⅰ-Ⅲ类比例为92.3%，整体水质保持优良；流域内 5 个国控断面存在超标。</div>
    <div class="bd" style="flex-direction:column;gap:10px;">
        <div class="kpi-row" style="margin-bottom:0;">
            <div class="kpi-card" style=""><div class="kpi-label" style="color:#1A3A5C;">监测断面总数</div><div class="kpi-value" style="color:#1A3A5C;">52个</div></div>
            <div class="kpi-card" style=""><div class="kpi-label" style="color:var(--wq-text-iii);">Ⅰ-Ⅲ类比例</div><div class="kpi-value" style="color:var(--wq-text-iii);">92.3%</div></div>
            <div class="kpi-card status-alert" style=""><div class="kpi-label">超标断面</div><div class="kpi-value">5个</div></div>
            <div class="kpi-card status-warn" style=""><div class="kpi-label">同比变化</div><div class="kpi-value">↓0.8%</div></div>
        </div>
        <div class="watershed-main-row">
            <div class="table-box watershed-left-panel" style="flex:0 0 55%; display:flex; flex-direction:column; padding:8px; background:var(--ppt-bg-muted); border:1px solid var(--ppt-border-default); border-radius:4px;">
                <div class="basin-map-placeholder">
                    <div class="basin-map-title">汉江流域 超标断面分布</div>
                </div>
            </div>
            <div class="content-panel watershed-right-panel" style="flex:1; display:flex; flex-direction:column; gap:6px; min-height:0;">
                <div class="right-panel-heading" style="color: var(--wq-text-inferior-v);">汉江水质分级管控</div>
                <div class="wq-category-grid">
                    <div class="wq-class-card inferior">
                        <div class="wq-card-head"><span class="wq-card-title">劣Ⅴ类（3个）</span><span class="wq-card-badge">优先管控</span></div>
                        <div class="wq-card-line">竹皮河口：潜江，氨氮超标</div>
                        <div class="wq-card-line">天门河、竹皮河上：氨氮、总磷超标</div>
                    </div>
                    <div class="wq-class-card class-v">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅴ类（1个）</span><span class="wq-card-badge">动态监控</span></div>
                        <div class="wq-card-line">天门河二：襄阳，氨氮、总磷超标</div><div class="wq-card-line">纳入动态监控，跟踪氨氮、总磷变化</div>
                    </div>
                    <div class="wq-class-card class-iv">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅳ类（1个）</span><span class="wq-card-badge">持续跟踪</span></div>
                        <div class="wq-card-line">蛮河口：襄阳，溶解氧超标</div><div class="wq-card-line">纳入持续跟踪，关注水质波动</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ft"><span>2026年5月生态环境月度专报</span><span>提示：仅供汇报使用</span></div>
</div>
</body>
</html>
