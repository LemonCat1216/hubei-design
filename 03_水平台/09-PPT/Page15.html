<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流域湖库：清江流域分析</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
    /* 左侧水平胶囊断面排布墙 */
    .qingjiang-wall { 
        display: flex; 
        flex-direction: column; 
        gap: 6px; 
        flex: 1; 
        overflow-y: auto; 
    }
    .section-block { 
        background: var(--ppt-bg-slide); 
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        padding: 5px 6px; 
    }
    .section-title { 
        font-size: 8.5px; 
        font-weight: 700; 
        color: #0F172A; 
        margin-bottom: 5px; 
        display: flex; 
        align-items: center; 
        gap: 4px; 
        border-bottom: 1px solid var(--ppt-border-subtle); 
        padding-bottom: 3px; 
    }
    
    /* 核心改动：调整为 3 列排布，让少断面情况下也能完美填满纵向空间 */
    .pill-grid { 
        display: grid; 
        grid-template-columns: repeat(5, 1fr);
        gap: 5px; 
    }
    
    .pill-node {
        padding: 3px 4px;
        font-size: 7.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 1px;
        border: 1px solid var(--ppt-border-default);
    }
    .pill-node.class-i { background: var(--wq-bg-i); border-color: var(--wq-border-i); }
    .pill-node.class-ii { background: var(--wq-bg-ii); border-color: var(--wq-border-ii); }
    .pill-node.class-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); }
    .pill-name { font-size: 8px; font-weight: 600; color: #166534; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-node.class-i .pill-name { color: var(--wq-text-i); }
    .pill-node.class-ii .pill-name { color: var(--wq-text-ii); }
    .pill-node.class-iii .pill-name { color: var(--wq-text-iii); }
    .node-dot { width: 3.5px; height: 3.5px; border-radius: 50%; }
    .pill-node.class-i .node-dot { background: var(--wq-chart-i); }
    .pill-node.class-ii .node-dot { background: var(--wq-chart-ii); }
    .pill-node.class-iii .node-dot { background: var(--wq-chart-iii); }
    /* 右侧通用自适应组件的“全绿亮点版”（结构同P13/P14） */
    .risk-list-wrapper { display: flex; flex-direction: column; gap: 5px; flex: 1; min-height: 0; }
    .risk-row-item { background: var(--ppt-bg-good); border: 1px solid var(--ppt-border-good);
    padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; flex: 1; }
    .risk-row-item.blue-style { background: var(--ppt-bg-info); border-color: var(--ppt-border-info);  }
    .risk-loc-info { display: flex; flex-direction: column; gap: 1px; flex: 0 0 35%; }
    .risk-name { font-size: 9.5px; font-weight: 800; color: #166534; }
    .risk-row-item.blue-style .risk-name { color: var(--ppt-chart-series-5); }
    .risk-type { font-size: 7.5px; color: #15803D; opacity: 0.7; }
    .risk-row-item.blue-style .risk-type { color: var(--ppt-chart-series-5); opacity: 0.7; }
    .risk-detail-info { display: flex; flex-direction: column; gap: 1px; font-size: 8.5px; color: #475569; flex: 1; padding-left: 10px; }
    .risk-badge { white-space: nowrap; }
    .wq-category-grid {
        flex: 1;
        display: grid;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 6px;
        min-height: 0;
    }
    .wq-class-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-height: 0;
        padding: 7px 10px;
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        background: var(--ppt-bg-slide);
    }
    .wq-class-card.inferior { background: var(--wq-bg-inferior-v); border-color: var(--wq-border-inferior-v); }
    .wq-class-card.class-v { background: var(--wq-bg-v); border-color: var(--wq-border-v); }
    .wq-class-card.class-iv { background: var(--wq-bg-iv); border-color: var(--wq-border-iv); }
    .wq-class-card.class-iii { background: var(--wq-bg-iii); border-color: var(--wq-border-iii); }
    .wq-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wq-card-title { font-size: 9.2px; line-height: 1.2; font-weight: 800; }
    .wq-class-card.inferior .wq-card-title { color: var(--wq-text-inferior-v); }
    .wq-class-card.class-v .wq-card-title { color: var(--wq-text-v); }
    .wq-class-card.class-iv .wq-card-title { color: var(--wq-text-iv); }
    .wq-class-card.class-iii .wq-card-title { color: var(--wq-text-iii); }
    .wq-card-badge { flex-shrink: 0; padding: 1px 5px; border-radius: 1px; font-size: 7.2px; line-height: 1.25; font-weight: 800; color: var(--ppt-bg-slide); }
    .wq-class-card.inferior .wq-card-badge { background: var(--wq-chart-inferior-v); }
    .wq-class-card.class-v .wq-card-badge { background: var(--wq-chart-v); }
    .wq-class-card.class-iv .wq-card-badge { background: var(--wq-chart-iv); }
    .wq-class-card.class-iii .wq-card-badge { background: var(--wq-chart-iii); }
    .wq-card-line { font-size: 8px; line-height: 1.45; color: var(--ppt-chart-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .basin-map-placeholder {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        overflow: hidden;
    }
    .basin-map-placeholder::before {
        content: "";
        position: absolute;
        width: 78%;
        height: 58%;
        border: 2px solid var(--ppt-border-info);
        background: var(--ppt-bg-info);
        clip-path: polygon(8% 44%, 22% 22%, 42% 30%, 56% 16%, 78% 26%, 92% 48%, 82% 70%, 62% 64%, 46% 82%, 26% 72%);
    }
    .basin-map-placeholder::after {
        content: "";
        position: absolute;
        width: 56%;
        height: 2px;
        background: var(--ppt-chart-series-5);
        transform: rotate(-8deg);
        opacity: .75;
    }
    .basin-map-title {
        position: relative;
        z-index: 1;
        padding: 8px 14px;
        background: var(--ppt-bg-slide);
        border: 1px solid var(--ppt-border-default);
        border-radius: 3px;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 800;
        color: var(--ppt-chart-text-strong);
        letter-spacing: 0;
    }
</style>
</head>
<body>
<div class="slide-container">
    <div class="ppt-header"><span class="ppt-title">流域湖库分析：清江流域分析</span><span class="nav-page-num">P15</span></div>
    <div class="core-bar" style="background: var(--wq-bg-iii)!important; color: var(--wq-text-iii)!important;">▎ 2026年5月（当前月），清江流域水质总体较好，Ⅰ-Ⅲ类比例保持92.3%以上，本月未检出劣Ⅴ类国控断面。</div>
    <div class="bd" style="flex-direction:column;gap:10px;">
        <div class="kpi-row" style="margin-bottom:0;">
            <div class="kpi-card" style=""><div class="kpi-label" style="color:#1A3A5C;">监测断面总数</div><div class="kpi-value" style="color:#1A3A5C;">26个</div></div>
            <div class="kpi-card" style=""><div class="kpi-label" style="color:var(--wq-text-iii);">Ⅰ-Ⅲ类比例</div><div class="kpi-value" style="color:var(--wq-text-iii);">92.3%</div></div>
            <div class="kpi-card status-good"><div class="kpi-label">超标断面</div><div class="kpi-value">0个 (清零)</div></div>
            <div class="kpi-card status-good"><div class="kpi-label">同比变化</div><div class="kpi-value">↑1.2%</div></div>
        </div>
        <div class="watershed-main-row">
            <div class="table-box watershed-left-panel" style="flex:0 0 55%; display:flex; flex-direction:column; padding:8px; background:var(--ppt-bg-muted); border:1px solid var(--ppt-border-default); border-radius:4px;">
                <div class="basin-map-placeholder">
                    <div class="basin-map-title">清江流域 超标断面分布</div>
                </div>
            </div>
            <div class="content-panel watershed-right-panel" style="flex:1; display:flex; flex-direction:column; gap:6px; min-height:0;">
                <div class="right-panel-heading" style="color: var(--wq-text-iii);">清江水质分类管控</div>
                <div class="wq-category-grid">
                    <div class="wq-class-card inferior">
                        <div class="wq-card-head"><span class="wq-card-title">劣Ⅴ类（0个）</span><span class="wq-card-badge">动态清零</span></div>
                        <div class="wq-card-line">清江全线本月未检出劣Ⅴ类断面</div>
                        <div class="wq-card-line">保持清零状态，继续跟踪重点支流</div>
                    </div>
                    <div class="wq-class-card class-v">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅴ类（2个）</span><span class="wq-card-badge">动态监控</span></div>
                        <div class="wq-card-line">清江支流忠建河：COD、总磷偏高</div>
                        <div class="wq-card-line">清江支流野三河：总磷偏高</div>
                    </div>
                    <div class="wq-class-card class-iv">
                        <div class="wq-card-head"><span class="wq-card-title">Ⅳ类（2个）</span><span class="wq-card-badge">常规监测</span></div>
                        <div class="wq-card-line">清江利川段、清江恩施段</div>
                        <div class="wq-card-line">总磷、氨氮阶段性波动，保持常规监测</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ft"><span>2026年5月生态环境月度专报</span><span>提示：仅供汇报使用</span></div>
</div>
</body>
</html>
