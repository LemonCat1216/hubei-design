<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖北省水生态环境形势分析 - 目录</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
/* 目录项目区域 */
.toc-body {
  flex: 1;
  padding: 10px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  position: relative;
  z-index: 1;
}

/* 覆盖全局 .toc-item 样式 */
.toc-item {
  gap: 8px !important;
  padding: 8px 20px !important;
}

/* 页码标 */
.toc-page-num {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,.3);
  letter-spacing: .5px;
  flex-shrink: 0;
  padding-left: 12px;
}

/* 底部水波纹（仿封面） */
.toc-container::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 28%;
  background: linear-gradient(180deg, rgba(5,150,105,0) 0%, rgba(5,150,105,.04) 40%, rgba(5,150,105,.06) 100%);
  clip-path: polygon(0 55%, 3% 50%, 6% 60%, 9% 48%, 12% 62%, 15% 44%, 18% 66%, 21% 46%, 24% 64%, 27% 50%, 30% 60%, 33% 46%, 36% 62%, 39% 50%, 42% 58%, 45% 44%, 48% 64%, 51% 48%, 54% 60%, 57% 42%, 60% 66%, 63% 48%, 66% 62%, 69% 50%, 72% 58%, 75% 44%, 78% 64%, 81% 48%, 84% 60%, 87% 46%, 90% 62%, 93% 44%, 96% 66%, 100% 55%, 100% 100%, 0 100%);
  pointer-events: none;
}
</style>
</head>
<body>

<div class="toc-container" style="position:relative;">

    
    <div class="ppt-header">
        <span class="ppt-title">目 录</span>
        <span class="nav-page-num">P02</span>
    </div>
    

    <!-- 目录主体：5 个板块 -->
    <div class="toc-body" id="toc-container"></div>

    <!-- 底部：简化落款 -->
    <div class="ft" style="border-top-color:rgba(255,255,255,.08);background:rgba(0,0,0,.08);color:rgba(255,255,255,.35);position:relative;z-index:1;">
        <span>2026年5月生态环境月度专报</span>
        <span>仅供汇报使用</span>
    </div>

    <!-- 底部水波纹装饰 -->
</div>

<script>
var ITS = [
    ["国控水环境质量形势", "国控断面全国排位 · 波动态势 · CWQI城市排名",               "P03-P04A"],
    ["省控市州达标分析",   "省控断面市州达标（当前月 / 累计月）",                         "P05-P06"],
    ["流域湖库分析",   "三大流域 · 重点湖库 · 丹江口水库",                           "P11-P20A"],
    ["风险断面攻坚",   "重点风险断面督办 · 污染因子根因分析 · 劣V类清零攻坚",        "P20B-P20D"],
    ["排污口排查整治", "入河排污口排查 · 溯源整治 · 日常监管",                        "P21-P24, P26, P29"],
    ["其他业务",   "饮用水水源地管理 · 资金项目调度 · 黑臭水体整治",                 "P25, P27-P28"],
    ["问题聚焦与督办", "重点问题清单 · 线索跟踪处置",                                 "P30-P31"],
    ["总结与展望",     "本月工作回顾 · 下月工作部署",                                 "P32"]
];
var c = document.getElementById("toc-container");
var h = "";
for (var i = 0; i < ITS.length; i++) {
    h += '<div class="toc-item">' +
         '<span class="idx">' + (i + 1) + '</span>' +
         '<div style="display:flex;flex-direction:row;gap:8px;align-items:baseline;white-space:nowrap;">' +
         '<span class="item-main">' + ITS[i][0] + '</span>' +
         '<span class="item-sub">' + ITS[i][1] + '</span>' +
         '</div>' +
         '<span class="toc-page-num">' + ITS[i][2] + '</span>' +
         '</div>';
}
c.innerHTML = h;
</script>

</body>
</html>
