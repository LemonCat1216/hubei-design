<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖北省水生态环境形势分析 - 目录</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
/* 目录项目区域 */
.toc-body {
  flex: 1;
  padding: 18px 36px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 0;
  position: relative;
  z-index: 1;
}

/* 覆盖全局 .toc-item 样式 */
.toc-item {
  gap: 10px !important;
  padding: 11px 20px !important;
  min-height: 44px;
}

.toc-item .idx {
  width: 26px !important;
  height: 26px !important;
  font-size: 12px !important;
}
.toc-item .item-main {
  font-size: 12.6px !important;
  font-weight: 700 !important;
}
.toc-item .item-sub {
  font-size: 10.2px !important;
  opacity: .68;
}
/* 页码标 */
.toc-page-num {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,.3);
  letter-spacing: .5px;
  flex-shrink: 0;
  padding-left: 12px;
}

/* 底部水波纹（仿封面） */
.toc-container::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 28%;
  background: linear-gradient(180deg, rgba(4,120,87,0) 0%, rgba(4,120,87,.04) 40%, rgba(4,120,87,.06) 100%);
  clip-path: polygon(0 55%, 3% 50%, 6% 60%, 9% 48%, 12% 62%, 15% 44%, 18% 66%, 21% 46%, 24% 64%, 27% 50%, 30% 60%, 33% 46%, 36% 62%, 39% 50%, 42% 58%, 45% 44%, 48% 64%, 51% 48%, 54% 60%, 57% 42%, 60% 66%, 63% 48%, 66% 62%, 69% 50%, 72% 58%, 75% 44%, 78% 64%, 81% 48%, 84% 60%, 87% 46%, 90% 62%, 93% 44%, 96% 66%, 100% 55%, 100% 100%, 0 100%);
  pointer-events: none;
}
</style>
</head>
<body>

<div class="toc-container" style="position:relative;">

    
    <div class="ppt-header">
        <span class="ppt-title">目 录</span>
        <span class="nav-page-num">P02</span>
    </div>
    

    <!-- 目录主体：6 个板块 -->
    <div class="toc-body" id="toc-container"></div>

    <!-- 底部：简化落款 -->
    <div class="ft" style="border-top-color:rgba(255,255,255,.08);background:rgba(0,0,0,.08);color:rgba(255,255,255,.35);position:relative;z-index:1;">
        <span>2026年5月生态环境月度专报</span>
        <span>仅供汇报使用</span>
    </div>

    <!-- 底部水波纹装饰 -->
</div>

<script>
var ITS = [
    ["国控水环境质量形势", "国控断面全国排位 · 波动态势 · CWQI城市排名",                  "P03-P04A"],
    ["省控市州达标分析",   "省控断面市州达标（当前月 / 累计月）",                          "P05-P06"],
    ["流域湖库分析",       "一级流域概览 · 二级流域详情 · 重点湖库专项分析",                "P11-P20A"],
    ["风险断面攻坚",       "重点风险断面督办 · 污染因子根因分析 · 劣V类断面动态跟踪",        "P20B-P20D"],
    ["数据实时分析",       "省控自动站超标分布 · 超标因子分析 · 重点关注站点",              "P20E-P20H"],
    ["排污口排查整治",     "入河排污口排查整治总览 · 各市州进展 · 重点河湖排口分布",        "P21-P23"]
];
var c = document.getElementById("toc-container");
var h = "";
for (var i = 0; i < ITS.length; i++) {
    h += '<div class="toc-item">' +
         '<span class="idx">' + (i + 1) + '</span>' +
         '<div style="display:flex;flex-direction:row;gap:8px;align-items:baseline;white-space:nowrap;">' +
         '<span class="item-main">' + ITS[i][0] + '</span>' +
         '<span class="item-sub">' + ITS[i][1] + '</span>' +
         '</div>' +
         '<span class="toc-page-num">' + ITS[i][2] + '</span>' +
         '</div>';
}
c.innerHTML = h;
</script>

</body>
</html>
