<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
<div class="slide-container">
    <div class="ppt-header"><span class="ppt-title">国控水环境质量形势：全省国控断面水环境质量排位（累计月）</span><span class="nav-page-num">P03</span></div>

    <div class="bd">

            <div class="kpi-row">

            </div>
            <div class="chart-wrapper">

                        <div class="legend-item"><span class="legend-dot" style="background:#fbbf24;"></span>III类</div>
                    </div>
                </div>
                <div class="chart-container" id="chart1"></div>
            </div>

        </div>
    </div>
    <div class="ft"><span>2026年5月生态环境月度专报</span><span>提示：仅供汇报使用</span></div>
</div>
<script>

d.forEach(function(p){var t=p.i+p.ii+p.iii,hl=p.h?" highlight":"";

c.innerHTML=h;
</script>
<script>
var cityData = [
    {n:"\u795e\u519c\u67b6\u6797\u533a",v:100},{n:"\u9102\u5dde\u5e02",v:98.2},{n:"\u5341\u5830\u5e02",v:96.8},{n:"\u6069\u65bd\u5dde",v:95.5},

    {n:"\u5b5d\u611f\u5e02",v:82.4},{n:"\u4ed9\u6843\u5e02",v:80.1},{n:"\u6f5c\u6c5f\u5e02",v:78.6},{n:"\u8346\u5dde\u5e02",v:76.3},{n:"\u5929\u95e8\u5e02",v:74.5}
];
var c = echarts.init(document.getElementById("chart-city"));

    yAxis:{type:"category",data:cityData.map(function(d){return d.n;}).reverse(),axisLabel:{fontSize:9,fontWeight:600,color:"#334155"},axisTick:{show:false},axisLine:{show:false}},

    }],

</html>
