<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PPT页面预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
body.presentation-mode{background:#020617}

/* 顶部工具栏 */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0;gap:12px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.toolbar-title{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:1px}
.toolbar-badge{background:#2B4C7E;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.toolbar-center{display:flex;align-items:center;gap:8px}
.toolbar-right{display:flex;align-items:center;gap:6px}

/* 按钮 */
.btn{background:#334155;color:#e2e8f0;border:1px solid #475569;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s}
.btn:hover{background:#475569;border-color:#64748b}
.btn:active{background:#1e293b}
.btn.primary{background:#1A3A5C;border-color:#2B4C7E;color:#fff}
.btn.primary:hover{background:#2B4C7E}
.btn.presentation{background:#1A3A5C;border-color:#1A3A5C;color:#fff}
.btn.presentation:hover{background:#2B4C7E;border-color:#2B4C7E}
.btn:disabled{opacity:.4;cursor:not-allowed}
.page-indicator{font-size:13px;font-weight:600;color:#94a3b8;min-width:80px;text-align:center}

/* 搜索框 */





/* 主体布局 */
.main{display:flex;flex:1;overflow:hidden}

/* 左侧目录 */
.sidebar{width:220px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-header{padding:10px 14px;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #334155}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.sidebar-list::-webkit-scrollbar{width:4px}
.sidebar-list::-webkit-scrollbar-thumb{background:#475569;border-radius:2px}

.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:#cbd5e1;transition:all .12s;border:1px solid transparent}
.nav-item:hover{background:#334155}
.nav-item.active{background:#1E4470;border-color:#2B4C7E;color:#6B8FA3}
.nav-num{background:#334155;color:#94a3b8;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;min-width:24px;text-align:center;flex-shrink:0}
.nav-item.active .nav-num{background:#1A3A5C;color:#fff}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav-section{padding:6px 10px 2px;font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:1px;margin-top:4px}

/* 右侧预览区 */
.preview {
    flex: 1;
    display: flex;
    align-items: center;       /* 关键：垂直居中 */
    justify-content: center;   /* 关键：水平居中 */
    background: #cbd5e1;       /* 改用深一点的背景色，让 PPT 卡片更凸显 */
    overflow: hidden;
    position: relative;
}

/* 核心画框：设定为固定的虚拟分辨率 */
.preview-frame {
    border: none;
    background: #f0f4f8;
    /* 根据你子页面 860px 宽度 * 1.75 放大率精确计算出的完美画布尺寸 */
    width: 1575px;
    height: 917px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* 增加真实的阴影立体感 */
    transform-origin: center center;          /* 缩放中心改为正中央 */
    flex-shrink: 0;
    transition: transform 0.15s ease-out;     /* 窗口拉伸时加入平滑动画 */
}

/* 全屏演示模式 */
.presentation-mode .toolbar{display:none}
.presentation-mode .main{height:100vh}
.presentation-mode .sidebar{display:none}
.presentation-mode .preview{background:#020617}
.presentation-mode .preview-frame{box-shadow:none}
.presentation-hud{
    position:fixed;
    top:16px;
    right:16px;
    z-index:20;
    display:none;
    align-items:center;
    gap:6px;
    padding:6px;
    border:1px solid rgba(148,163,184,.24);
    border-radius:8px;
    background:rgba(15,23,42,.74);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    backdrop-filter:blur(12px);
}
.presentation-mode .presentation-hud{display:flex}
.hud-page{min-width:70px;text-align:center;font-size:12px;font-weight:700;color:#e2e8f0}
.hud-btn{
    width:30px;
    height:30px;
    border:1px solid rgba(148,163,184,.32);
    border-radius:6px;
    background:rgba(30,41,59,.88);
    color:#e2e8f0;
    font-size:14px;
    line-height:1;
    cursor:pointer;
}
.hud-btn:hover{background:rgba(51,65,85,.96);border-color:rgba(203,213,225,.56)}
.hud-btn:disabled{opacity:.4;cursor:not-allowed}

/* 加载提示 */
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:#64748b;font-size:14px}

/* 键盘提示 */
.kbd{background:#334155;border:1px solid #475569;padding:1px 5px;border-radius:3px;font-size:10px;color:#94a3b8;font-family:monospace}
</style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-left">
        <span class="toolbar-title">📊 PPT页面预览</span>
        <span class="toolbar-badge" id="pageCount">加载中...</span>
    </div>
    <div class="toolbar-center">
        <button class="btn" id="btnFirst" title="第一页">⏮</button>
        <button class="btn" id="btnPrev" title="上一页 (←)">◀ 上一页</button>
        <span class="page-indicator" id="pageIndicator">-- / --</span>
        <button class="btn" id="btnNext" title="下一页 (→)">下一页 ▶</button>
        <button class="btn" id="btnLast" title="最后一页">⏭</button>
    </div>
    <div class="toolbar-right">
        <button class="btn presentation" id="btnPresent" title="全屏演示 (F)">⛶ 全屏演示</button>
        <span style="font-size:10px;color:#64748b;margin-left:8px"><span class="kbd">←</span> <span class="kbd">→</span> 翻页</span>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-header">页面目录</div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>
    <div class="preview">
        <iframe class="preview-frame" id="previewFrame" src="about:blank"></iframe>
    </div>
</div>
<div class="presentation-hud" id="presentationHud" aria-hidden="true">
    <button class="hud-btn" id="hudPrev" title="上一页">◀</button>
    <span class="hud-page" id="presentationIndicator">-- / --</span>
    <button class="hud-btn" id="hudNext" title="下一页">▶</button>
    <button class="hud-btn" id="btnExitPresentation" title="退出全屏">×</button>
</div>
    <script type="text/javascript">
    // ============================================
        var pages = [
      { file: "Page1.html",  label: "P01 封面", idx: 0 },
      { file: "Page2.html",  label: "P02 目录 / 分析框架", idx: 1 },
      { file: "Page2a.html", label: "P02A 月度核心研判", idx: 2 },
      // --- 第一幕：国控水环境质量形势 ---
      { section: "一、国控水环境质量形势" },
      { file: "Page3.html",  label: "P03 全省国控断面水环境质量排位", idx: 3 },
      { file: "Page4.html",  label: "P04 全省水环境波动态势", idx: 4 },
      { file: "Page04A.html",  label: "P04A 城市CWQI排位", idx: 5 },
      // --- 第二幕：省控市州达标分析 ---
      { section: "二、省控市州达标分析" },
      { file: "Page5.html",  label: "P05 省控断面累计月市州达标", idx: 6 },
      { file: "Page6.html",  label: "P06 省控断面当前月市州达标", idx: 7 },
      // --- 第三幕：流域湖库分析 ---
      { section: "三、流域湖库分析" },
      { file: "Page11.html", label: "P11 一级流域概览", idx: 11 },
      { file: "Page12.html", label: "P12 二级流域详情", idx: 12 },
      { file: "Page13.html", label: "P13 长江流域分析", idx: 13 },
      { file: "Page14.html", label: "P14 汉江流域分析", idx: 14 },
      { file: "Page15.html", label: "P15 清江流域分析", idx: 15 },
      { file: "Page16.html", label: "P16 重点湖泊水质总览", idx: 16 },
      { file: "Page17.html", label: "P17 洪湖专项监测分析", idx: 17 },
      { file: "Page18.html", label: "P18 梁子湖专项监测分析", idx: 18 },
      { file: "Page19.html", label: "P19 斧头湖专项监测分析", idx: 19 },
      { file: "Page20.html", label: "P20 丹江口水库及同比分析", idx: 20 },
      { file: "Page20a.html", label: "P20A 流域湖库·本章小结", idx: 21 },
      // --- 第四幕：风险断面攻坚 ---
      { section: "四、风险断面攻坚" },
      { file: "Page20B.html",  label: "P20B 重点风险断面督办清单", idx: 22 },
      { file: "Page20C.html",  label: "P20C 重点污染因子根因分析", idx: 23 },
      { file: "Page20D.html", label: "P20D 劣Ⅴ类断面\u201C清零\u201D攻坚战况", idx: 24 },
      // --- 第五幕：排污口排查整治 ---
      { section: "五、排污口排查整治" },
      { file: "Page21.html", label: "P21 入河排污口排查整治总览", idx: 25 },
      { file: "Page22.html", label: "P22 各市州排污口排查进展", idx: 26 },
      { file: "Page23.html", label: "P23 不达标断面对应排口清单", idx: 27 },
      { file: "Page24.html", label: "P24 污染溯源预警分析", idx: 28 },
      { file: "Page26.html", label: "P26 入河排污口闭环进度", idx: 30 },
      { file: "Page29.html", label: "P29 排污口日常监管运行", idx: 33 },
      // --- 第六幕：其他业务 ---
      { section: "六、其他业务" },
      { file: "Page28.html", label: "P28 中央水污染防治资金项目调度", idx: 32 },
      { file: "Page27.html", label: "P27 饮用水水源地管理与督办", idx: 31 },
      { file: "Page25.html", label: "P25 黑臭水体整治与督办", idx: 29 },
      // --- 第七幕：问题聚焦与督办 ---
      { section: "七、问题聚焦与督办" },
      { file: "Page30.html", label: "P30 重点问题清单与整改进展", idx: 34 },
      { file: "Page31.html", label: "P31 问题线索跟踪处置", idx: 35 },
      // --- 第八幕：总结与展望 ---
      { section: "八、总结与展望" },
      { file: "Page32.html", label: "P32 总结与展望", idx: 36 },
    ];

// ============================================
// 核心逻辑（不需要修改）
// ============================================
(function() {
    var currentIdx = 0;
    var frameEl = document.getElementById("previewFrame");
    var indicatorEl = document.getElementById("pageIndicator");
    var presentationIndicatorEl = document.getElementById("presentationIndicator");
    var countEl = document.getElementById("pageCount");
    var listEl = document.getElementById("sidebarList");
    var btnPresent = document.getElementById("btnPresent");
    var btnExitPresentation = document.getElementById("btnExitPresentation");
    var hudPrev = document.getElementById("hudPrev");
    var hudNext = document.getElementById("hudNext");

    function renderSidebar() {
        listEl.innerHTML = "";
        var fileCount = 0;
        for (var i = 0; i < pages.length; i++) {
            var pageObj = pages[i];
            if (pageObj.section) {
                var sec = document.createElement("div");
                sec.className = "nav-section";
                sec.textContent = pageObj.section;
                listEl.appendChild(sec);
                continue;
            }
            fileCount++;
            var nav = document.createElement("div");
            nav.className = "nav-item";
            nav.setAttribute("data-idx", i);
            nav.innerHTML = '<span class="nav-num">' + fileCount + "</span>" +
                '<span class="nav-label">' + pageObj.label + "</span>";
            nav.onclick = (function(idx) {
                return function() { goTo(idx); };
            })(i);
            listEl.appendChild(nav);
        }
        countEl.textContent = fileCount + " 页";
        updateNav();
    }

    function findPageIndex(startIdx, step) {
        for (var i = startIdx; i >= 0 && i < pages.length; i += step) {
            if (pages[i] && pages[i].file) return i;
        }
        return currentIdx;
    }

    function getFirstPageIndex() {
        return findPageIndex(0, 1);
    }

    function getLastPageIndex() {
        return findPageIndex(pages.length - 1, -1);
    }

    function goPrev() {
        goTo(findPageIndex(currentIdx - 1, -1));
    }

    function goNext() {
        goTo(findPageIndex(currentIdx + 1, 1));
    }

    function goTo(idx) {
        if (idx < 0 || idx >= pages.length) return;
        var target = pages[idx];
        if (!target || !target.file) return;
        currentIdx = idx;
        frameEl.src = target.file;

        var items = listEl.querySelectorAll(".nav-item");
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle("active", parseInt(items[i].getAttribute("data-idx")) === currentIdx);
        }

        var activeEl = listEl.querySelector(".nav-item.active");
        if (activeEl) activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
        updateNav();
    }

    function updateNav() {
        var idx = currentIdx;
        var fileIdx = 0;
        var totalFiles = 0;
        for (var i = 0; i < pages.length; i++) {
            if (pages[i].file) {
                totalFiles++;
                if (i == currentIdx) fileIdx = totalFiles;
            }
        }
        indicatorEl.textContent = fileIdx + " / " + totalFiles;
        presentationIndicatorEl.textContent = fileIdx + " / " + totalFiles;

        var atFirst = currentIdx === getFirstPageIndex();
        var atLast = currentIdx === getLastPageIndex();
        document.getElementById("btnFirst").disabled = atFirst;
        document.getElementById("btnPrev").disabled = atFirst;
        document.getElementById("btnNext").disabled = atLast;
        document.getElementById("btnLast").disabled = atLast;
        hudPrev.disabled = atFirst;
        hudNext.disabled = atLast;
    }

    document.getElementById("btnFirst").onclick = function() { goTo(getFirstPageIndex()); };
    document.getElementById("btnPrev").onclick = goPrev;
    document.getElementById("btnNext").onclick = goNext;
    document.getElementById("btnLast").onclick = function() { goTo(getLastPageIndex()); };
    hudPrev.onclick = goPrev;
    hudNext.onclick = goNext;
    btnPresent.onclick = startPresentation;
    btnExitPresentation.onclick = stopPresentation;

    function isEditableTarget(target) {
        if (!target || !target.tagName) return false;
        var tagName = target.tagName.toUpperCase();
        return tagName === "INPUT" || tagName === "TEXTAREA" || tagName === "SELECT" || target.isContentEditable;
    }

    function isFullscreenActive() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreen(el) {
        if (el.requestFullscreen) return el.requestFullscreen();
        if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
        if (el.msRequestFullscreen) return el.msRequestFullscreen();
        return null;
    }

    function exitFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        if (document.msExitFullscreen) return document.msExitFullscreen();
        return null;
    }

    function setPresentationMode(active) {
        document.body.classList.toggle("presentation-mode", active);
        document.getElementById("presentationHud").setAttribute("aria-hidden", active ? "false" : "true");
        btnPresent.textContent = active ? "退出演示" : "⛶ 全屏演示";
        btnPresent.title = active ? "退出全屏" : "全屏演示 (F)";
        setTimeout(autoScalePreview, 50);
    }

    function syncPresentationMode() {
        setPresentationMode(isFullscreenActive());
    }

    function startPresentation() {
        setPresentationMode(true);
        var request = requestFullscreen(document.documentElement);
        if (request && request.catch) {
            request.catch(function() {
                setPresentationMode(true);
            });
        }
        setTimeout(function() {
            try { frameEl.focus(); } catch (err) {}
        }, 80);
    }

    function stopPresentation() {
        if (isFullscreenActive()) {
            var request = exitFullscreen();
            if (request && request.catch) {
                request.catch(function() {
                    setPresentationMode(false);
                });
            }
        } else {
            setPresentationMode(false);
        }
    }

    function handleKeydown(e) {
        if (isEditableTarget(e.target)) return;
        if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
            e.preventDefault();
            goPrev();
        }
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown" || (e.key === " " && document.body.classList.contains("presentation-mode"))) {
            e.preventDefault();
            goNext();
        }
        if (e.key === "Home") {
            e.preventDefault();
            goTo(getFirstPageIndex());
        }
        if (e.key === "End") {
            e.preventDefault();
            goTo(getLastPageIndex());
        }
        if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            if (document.body.classList.contains("presentation-mode")) stopPresentation();
            else startPresentation();
        }
        if (e.key === "Escape" && document.body.classList.contains("presentation-mode") && !isFullscreenActive()) {
            e.preventDefault();
            setPresentationMode(false);
        }
    }

    function wireFrameKeys() {
        try {
            var doc = frameEl.contentDocument || frameEl.contentWindow.document;
            doc.addEventListener("keydown", handleKeydown);
        } catch (err) {}
    }

    document.addEventListener("keydown", handleKeydown);
    frameEl.addEventListener("load", wireFrameKeys);
    document.addEventListener("fullscreenchange", syncPresentationMode);
    document.addEventListener("webkitfullscreenchange", syncPresentationMode);
    document.addEventListener("MSFullscreenChange", syncPresentationMode);

    renderSidebar();
    goTo(0);

    function autoScalePreview() {
        var previewArea = document.querySelector('.preview');
        var iframe = document.getElementById('previewFrame');
        if (!previewArea || !iframe) return;
        var inset = document.body.classList.contains('presentation-mode') ? 0 : 40;
        var availWidth = previewArea.clientWidth - inset;
        var availHeight = previewArea.clientHeight - inset;
        var frameWidth = 1575;
        var frameHeight = 917;
        var scale = Math.min(availWidth / frameWidth, availHeight / frameHeight);
        iframe.style.transform = 'scale(' + scale + ')';
    }

    window.addEventListener('resize', autoScalePreview);
    setTimeout(autoScalePreview, 50);
})();

</script>
</body>
</html>
