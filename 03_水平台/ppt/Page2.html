<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖北省水生态环境形势分析 - 目录</title>
<link rel="stylesheet" href="ppt-style.css">
</head>
<body>

<div class="toc-container">
    <div class="ppt-header">
        <span class="ppt-title">目录 / 分析框架</span>
        <span class="nav-page-num">P02</span>
    </div>
    
    <div style="flex:1;padding:20px 36px;display:flex;flex-direction:column;justify-content:center;">
        <div class="toc-title">分 析 框 架</div>
        <div style="display:flex;flex-direction:column;gap:10px;" id="toc-container"></div>
    </div>
    
    <div class="ft" style="border-top-color:rgba(255,255,255,.1);background:rgba(0,0,0,.1);color:rgba(255,255,255,.5);">
        <span>2026年5月生态环境月度专报</span>
        <span>提示：仅供汇报使用</span>
    </div>
</div>

<script>
var ITS = [
    ["排名情况", "国/省控断面排位 · 波动态势 · 17市州详情"],
    ["全省态势", "市州达标率 · 风险预警 · 月度趋势 · 污染因子"],
    ["流域湖库", "五大水系概览 · 12片区详情 · 重点湖库专项监测"],
    ["排口信息", "排污口排查整治 · 不达标清单 · 溯源预警 · 黑臭水体"],
    ["压实举措", "督办交办 · 资金调度 · 饮用水源 · 考核排名"]
];
var c = document.getElementById("toc-container");
var h = "";
for (var i = 0; i < ITS.length; i++) {
    h += '<div class="toc-item">' +
         '<span class="idx">' + (i + 1) + '</span>' +
         '<div style="display:flex;flex-direction:column;gap:2px;">' +
         '<span class="item-main">' + ITS[i][0] + '</span>' +
         '<span class="item-sub">' + ITS[i][1] + '</span>' +
         '</div></div>';
}
c.innerHTML = h;
</script>

</body>
</html>
