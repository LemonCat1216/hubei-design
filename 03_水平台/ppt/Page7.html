<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全省态势 - 国控断面水质等级结构分析（17市州）</title>
<link rel="stylesheet" href="ppt-style.css">
<style>
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hbar .city{width:60px;font-size:9px;font-weight:700;color:#334155;text-align:right;flex-shrink:0}
.hbar .bar-track{flex:1;height:18px;background:#F1F5F9;border-radius:3px;overflow:hidden;display:flex;position:relative}
.hbar .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;min-width:20px;transition:width .3s}
.hbar .seg.s1{background:#059669}.hbar .seg.s2{background:#3b82f6}.hbar .seg.s3{background:#fbbf24;color:#0F172A}
.hbar .seg.s4{background:#f97316}.hbar .seg.s5{background:#DC2626}
.hbar .cnt{width:40px;font-size:8px;color:#64748B;text-align:center;flex-shrink:0}
.hbar.hl .city{color:#DC2626;font-size:10px}
.hbar.hl .bar-track{outline:2px solid #DC2626;outline-offset:1px}
.legend-row{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.legend-row .li{display:flex;align-items:center;gap:4px;font-size:9px;color:#475569;font-weight:600}
.legend-row .dot{width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>
<div class="slide-container">
    <div class="ppt-header"><span class="ppt-title">全省态势：国控断面水质等级结构分析（17市州）</span><span class="nav-page-num">P07</span></div>
    <div class="core-bar">▎ 167个国控断面中，Ⅰ-Ⅲ类占87.6%，Ⅳ-Ⅴ类占5.4%，劣Ⅴ类占7.0%。潜江(28.6%)、天门(23.1%)、荆州(15.6%)劣Ⅴ类占比最高，结构性问题突出。</div>
    <div class="bd">
        <div class="left-column">
            <div class="kpi-block highlight"><div class="kpi-title">Ⅰ-Ⅲ类占比</div><div class="kpi-num">87.6%</div><div class="kpi-sub">146个断面</div></div>
            <div class="kpi-block"><div class="kpi-title">Ⅳ-Ⅴ类占比</div><div class="kpi-num" style="color:#D97706;">5.4%</div><div class="kpi-sub">9个断面</div></div>
            <div class="kpi-block alert"><div class="kpi-title">劣Ⅴ类占比</div><div class="kpi-num">7.0%</div><div class="kpi-sub">12个断面</div></div>
            <div class="kpi-block"><div class="kpi-title">劣Ⅴ类城市</div><div class="kpi-num" style="font-size:16px;">6个</div><div class="kpi-sub">潜江/天门/荆州等</div></div>
        </div>
        <div class="right-column">
            <div class="legend-row">
                <div class="li"><span class="dot" style="background:#059669;"></span>Ⅰ-Ⅱ类(优)</div>
                <div class="li"><span class="dot" style="background:#3b82f6;"></span>Ⅲ类(良)</div>
                <div class="li"><span class="dot" style="background:#fbbf24;"></span>Ⅳ类(轻度)</div>
                <div class="li"><span class="dot" style="background:#f97316;"></span>Ⅴ类(中度)</div>
                <div class="li"><span class="dot" style="background:#DC2626;"></span>劣Ⅴ类(重度)</div>
            </div>
            <div style="flex:1;overflow-y:auto;" id="hbarChart"></div>
        </div>
    </div>
    <div class="ft"><span>2026年5月生态环境月度专报</span><span>提示：仅供汇报使用</span></div>
</div>
<script>
var data=[
    {c:"神农架",t:8,a:6,b:2,c3:0,c4:0,c5:0},
    {c:"鄂州市",t:18,a:10,b:8,c3:0,c4:0,c5:0},
    {c:"十堰市",t:67,a:42,b:22,c3:3,c4:0,c5:0},
    {c:"宜昌市",t:32,a:18,b:12,c3:2,c4:0,c5:0},
    {c:"襄阳市",t:28,a:16,b:10,c3:2,c4:0,c5:0},
    {c:"黄石市",t:22,a:12,b:8,c3:2,c4:0,c5:0},
    {c:"荆州市",t:45,a:14,b:16,c3:6,c4:2,c5:7,hl:1},
    {c:"武汉市",t:52,a:22,b:22,c3:5,c4:1,c5:2},
    {c:"黄冈市",t:50,a:20,b:23,c3:4,c4:1,c5:2},
    {c:"咸宁市",t:18,a:8,b:7,c3:2,c4:1,c5:0},
    {c:"恩施州",t:20,a:10,b:6,c3:3,c4:1,c5:0},
    {c:"荆门市",t:16,a:6,b:6,c3:2,c4:0,c5:2},
    {c:"孝感市",t:40,a:14,b:16,c3:5,c4:2,c5:3},
    {c:"随州市",t:12,a:5,b:4,c3:2,c4:1,c5:0},
    {c:"潜江市",t:14,a:3,b:4,c3:2,c4:1,c5:4,hl:1},
    {c:"仙桃市",t:8,a:2,b:2,c3:2,c4:1,c5:1},
    {c:"天门市",t:13,a:2,b:4,c3:2,c4:1,c5:4,hl:1}
];
var h="",c=document.getElementById("hbarChart");
data.forEach(function(d){
    var p1=Math.round(d.a/d.t*100),p2=Math.round(d.b/d.t*100),p3=Math.round(d.c3/d.t*100),p4=Math.round(d.c4/d.t*100),p5=100-p1-p2-p3-p4;
    var cls=d.hl?"hbar hl":"hbar";
    h+='<div class="'+cls+'">'+
       '<div class="city">'+d.c+'</div>'+
       '<div class="bar-track">'+
       (d.a?'<div class="seg s1" style="width:'+p1+'%;">'+(p1>8?p1+'%':'')+'</div>':'')+
       (d.b?'<div class="seg s2" style="width:'+p2+'%;">'+(p2>8?p2+'%':'')+'</div>':'')+
       (d.c3?'<div class="seg s3" style="width:'+p3+'%;">'+(p3>8?p3+'%':'')+'</div>':'')+
       (d.c4?'<div class="seg s4" style="width:'+p4+'%;">':'')+'</div>'+
       (d.c5?'<div class="seg s5" style="width:'+p5+'%;">'+(p5>5?p5+'%':'')+'</div>':'')+
       '</div>'+
       '<div class="cnt">'+d.c5>0?('<span class="badge-r">'+d.c5+'个</span>'):('<span class="badge-g">0</span>')+'</div></div>';
});
c.innerHTML=h;
</script>
</body>
</html>
