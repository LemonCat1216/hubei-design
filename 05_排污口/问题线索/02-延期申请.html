<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>延期申请 - 湖北省排污口综合监管系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/clue-common.css">
</head>
<body>
<div class="viewport">
    <div class="app-shell" id="appShell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">鄂</span>
                <span>湖北省排污口综合监管系统</span>
            </div>
            <nav class="top-nav" aria-label="主导航">
                <button type="button" data-nav="首页"><i class="fa-solid fa-house"></i><span>首页</span></button>
                <button type="button" data-nav="一张图"><i class="fa-regular fa-image"></i><span>一张图</span></button>
                <button type="button" class="active" data-nav="业务管理"><i class="fa-regular fa-clipboard"></i><span>业务管理</span></button>
                <button type="button" data-nav="一口一档"><i class="fa-regular fa-file-lines"></i><span>一口一档</span></button>
                <button type="button" data-nav="水污染源"><i class="fa-solid fa-list-check"></i><span>水污染源</span></button>
                <button type="button" data-nav="综合统计"><i class="fa-solid fa-gavel"></i><span>综合统计</span></button>
            </nav>
            <div class="user">
                <div class="role-switch" id="roleSwitch" role="group" aria-label="省市角色切换">
                    <button type="button" data-role="province" class="active">省级</button>
                    <button type="button" data-role="city">市级</button>
                </div>
                <i class="fa-regular fa-user"></i><span>王羽鹏</span>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar" aria-label="业务菜单">
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口管理</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
                <div class="side-group">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口监管</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children">
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-dot side-icon"></i><span>日常监管</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-chart-bar side-icon"></i><span>在线监控</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-flag side-icon"></i><span>盯办帮扶</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-info side-icon"></i><span>日常监管监测预警</span></button>
                        <div class="side-child-branch">
                            <button type="button" class="side-item side-child branch-toggle on">
                                <i class="fa-regular fa-circle-pause side-icon"></i><span>问题线索</span><i class="fa-solid fa-chevron-up chevron"></i>
                            </button>
                            <div class="side-grandchildren">
                                <button type="button" class="side-item side-grandchild" data-page="clue"><i class="fa-regular fa-file-lines side-icon"></i><span>问题线索</span></button>
                                <button type="button" class="side-item side-grandchild active" data-page="defer"><i class="fa-solid fa-hourglass-half side-icon"></i><span>延期申请</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="sms"><i class="fa-regular fa-comment-dots side-icon"></i><span>短信通知记录</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="contact"><i class="fa-solid fa-address-book side-icon"></i><span>联系人设置</span></button>
                            </div>
                        </div>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-bell side-icon"></i><span>水功能区纳污统计</span></button>
                    </div>
                </div>
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口设置审批</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
            </aside>

            <main class="main-panel">
                <div class="notice-bar warn one-line"><i class="fa-solid fa-circle-exclamation"></i>
                    <span>延期申请规则：因管网改造、工程施工等客观因素确需延期的，须在<strong>整改期满前10个工作日</strong>提交延期申请、说明理由、补充工程可行性方案，并明确整改完成时限；经省级审核<strong>通过</strong>后方可延期，审核<strong>不通过的予以驳回</strong>，地市可补正材料后重新申请。</span>
                </div>

                <form class="filter-bar" id="deferFilterForm">
                    <label class="field select" id="fCityWrap" style="width:134px" hidden><select id="fCity" aria-label="所属地市">
                        <option value="">所属地市</option>
                    </select></label>
                    <label class="field select" style="width:132px"><select id="fCategory" aria-label="延期类型">
                        <option value="">延期类型</option><option>管网改造</option><option>工程施工</option><option>其他</option>
                    </select></label>
                    <label class="field select" style="width:132px"><select id="fType" aria-label="问题类型">
                        <option value="">问题类型</option><option>重大问题</option><option>突出问题</option><option>一般问题</option><option>其他问题</option>
                    </select></label>
                    <label class="field" style="width:250px"><input id="fKw" type="search" placeholder="问题标题 / 编号" aria-label="关键词"></label>
                    <button class="filter-btn search" type="submit"><i class="fa-solid fa-magnifying-glass"></i><span>搜索</span></button>
                    <button class="filter-btn reset" id="deferReset" type="button"><i class="fa-solid fa-rotate-left"></i><span>重置</span></button>
                </form>

                <div class="toolbar-row">
                    <span class="d-tabs" id="viewTabs" style="border-bottom:0"></span>
                    <span class="spacer"></span>
                    <button class="filter-btn export" id="exportBtn" type="button"><i class="fa-regular fa-file-lines"></i><span>数据导出</span></button>
                </div>

                <div class="table-wrap">
                    <div class="table-scroll">
                        <table aria-label="延期申请列表">
                            <colgroup id="tableCols"></colgroup>
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 延期申请弹窗 -->
                <div class="modal-backdrop" id="applyModal" role="dialog" aria-modal="true" aria-labelledby="applyTitle">
                    <section class="modal w-lg">
                        <header class="modal-header"><span id="applyTitle">延期申请</span>
                            <button class="modal-close" type="button" data-close="applyModal" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button></header>
                        <div class="modal-body">
                            <div class="notice-bar" style="margin-top:0"><i class="fa-solid fa-circle-info"></i>请在整改期满前10个工作日内提交，须说明延期理由、补充工程可行性方案，并明确整改完成时限。</div>
                            <div class="info-grid" style="margin-top:14px" id="applyClueInfo"></div>
                            <div class="form-grid" style="margin-top:14px">
                                <div class="form-item col-2">
                                    <label class="form-label">原计划到期时间</label>
                                    <input class="form-input mono" id="applyOldDue" readonly>
                                </div>
                                <div class="form-item col-2">
                                    <label class="form-label">申请延期至<i class="req">*</i></label>
                                    <input class="form-input" type="date" id="applyNewDue">
                                </div>
                                <div class="form-item col-2">
                                    <label class="form-label">延期类型<i class="req">*</i></label>
                                    <select class="form-select" id="applyCategory">
                                        <option value="">请选择延期类型</option>
                                        <option>管网改造</option>
                                        <option>工程施工</option>
                                        <option>其他</option>
                                    </select>
                                </div>
                                <div class="form-item col-2">
                                    <label class="form-label">备注</label>
                                    <textarea class="form-textarea" id="applyRemark" rows="2" placeholder="选填"></textarea>
                                </div>
                                <div class="form-item col-4">
                                    <label class="form-label">延期理由（说明客观因素及具体原因）<i class="req">*</i></label>
                                    <textarea class="form-textarea" id="applyReason" rows="3" placeholder="如：因管网改造、工程施工等客观因素，原期限内无法完成整改……"></textarea>
                                </div>
                                <div class="form-item col-4">
                                    <label class="form-label">工程可行性方案<i class="req">*</i>（上传 1 份）</label>
                                    <div class="upload-box" id="applyFileUpload">
                                        <div class="upload-add" data-add="file"><i class="fa-solid fa-file-arrow-up"></i>点击上传</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="modal-footer">
                            <span class="foot-hint">提交后由省级生态环境部门审核，审核通过后整改期限自动顺延。</span>
                            <button class="btn ghost" data-close="applyModal" type="button">取 消</button>
                            <button class="btn primary" id="applySubmit" type="button"><i class="fa-solid fa-paper-plane"></i>提交申请</button>
                        </footer>
                    </section>
                </div>

                <!-- 省级审核弹窗 -->
                <div class="modal-backdrop" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
                    <section class="modal w-lg">
                        <header class="modal-header"><span id="reviewTitle">延期申请审核</span>
                            <button class="modal-close" type="button" data-close="reviewModal" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button></header>
                        <div class="modal-body">
                            <div class="info-grid" id="reviewInfo"></div>
                            <div class="block-label">延期理由</div>
                            <div class="desc-block" id="reviewReason"></div>
                            <div class="block-label">工程可行性方案</div>
                            <div class="file-list" style="grid-template-columns:1fr" id="reviewFiles"></div>
                            <div class="block-label">省级审核意见<i class="req" style="color:#e0342f;font-style:normal">*</i></div>
                            <textarea class="form-textarea" id="reviewNote" rows="3" placeholder="请填写审核意见（驳回时须说明补正要求）"></textarea>
                        </div>
                        <footer class="modal-footer">
                            <span class="foot-hint" id="reviewHint">审核通过后，问题线索整改期限将自动顺延并通知地市；驳回后将通知地市补正材料重新申请。</span>
                            <button class="btn ghost" data-close="reviewModal" type="button">取 消</button>
                            <button class="btn danger" id="reviewReject" type="button"><i class="fa-solid fa-ban"></i>驳 回</button>
                            <button class="btn success" id="reviewPass" type="button"><i class="fa-solid fa-check"></i>审核通过</button>
                        </footer>
                    </section>
                </div>

                <!-- 申请详情弹窗 -->
                <div class="modal-backdrop" id="applyViewModal" role="dialog" aria-modal="true" aria-labelledby="applyViewTitle">
                    <section class="modal w-md">
                        <header class="modal-header"><span id="applyViewTitle">延期申请详情</span>
                            <button class="modal-close" type="button" data-close="applyViewModal" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button></header>
                        <div class="modal-body" id="applyViewBody"></div>
                        <footer class="modal-footer">
                            <button class="btn primary" data-close="applyViewModal" type="button">关 闭</button>
                        </footer>
                    </section>
                </div>

                <div class="toast" id="toast" role="status"></div>
            </main>
        </div>
    </div>
</div>

<script src="assets/clue-data.js"></script>
<script src="assets/clue-map.js"></script>
<script src="assets/clue-shell.js"></script>
<script src="assets/clue-defer.js"></script>
</body>
</html>
