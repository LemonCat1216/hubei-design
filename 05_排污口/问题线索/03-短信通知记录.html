<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信通知记录 - 湖北省排污口综合监管系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/clue-common.css">
</head>
<body>
<div class="viewport">
    <div class="app-shell" id="appShell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">鄂</span>
                <span>湖北省排污口综合监管系统</span>
            </div>
            <nav class="top-nav" aria-label="主导航">
                <button type="button" data-nav="首页"><i class="fa-solid fa-house"></i><span>首页</span></button>
                <button type="button" data-nav="一张图"><i class="fa-regular fa-image"></i><span>一张图</span></button>
                <button type="button" class="active" data-nav="业务管理"><i class="fa-regular fa-clipboard"></i><span>业务管理</span></button>
                <button type="button" data-nav="一口一档"><i class="fa-regular fa-file-lines"></i><span>一口一档</span></button>
                <button type="button" data-nav="水污染源"><i class="fa-solid fa-list-check"></i><span>水污染源</span></button>
                <button type="button" data-nav="综合统计"><i class="fa-solid fa-gavel"></i><span>综合统计</span></button>
            </nav>
            <div class="user">
                <div class="role-switch" id="roleSwitch" role="group" aria-label="省市角色切换">
                    <button type="button" data-role="province" class="active">省级</button>
                    <button type="button" data-role="city">市级</button>
                </div>
                <i class="fa-regular fa-user"></i><span>王羽鹏</span>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar" aria-label="业务菜单">
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口管理</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
                <div class="side-group">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口监管</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children">
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-dot side-icon"></i><span>日常监管</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-chart-bar side-icon"></i><span>在线监控</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-flag side-icon"></i><span>盯办帮扶</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-info side-icon"></i><span>日常监管监测预警</span></button>
                        <div class="side-child-branch">
                            <button type="button" class="side-item side-child branch-toggle on">
                                <i class="fa-regular fa-circle-pause side-icon"></i><span>问题线索</span><i class="fa-solid fa-chevron-up chevron"></i>
                            </button>
                            <div class="side-grandchildren">
                                <button type="button" class="side-item side-grandchild" data-page="clue"><i class="fa-regular fa-file-lines side-icon"></i><span>问题线索</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="defer"><i class="fa-solid fa-hourglass-half side-icon"></i><span>延期申请</span></button>
                                <button type="button" class="side-item side-grandchild active" data-page="sms"><i class="fa-regular fa-comment-dots side-icon"></i><span>短信通知记录</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="contact"><i class="fa-solid fa-address-book side-icon"></i><span>联系人设置</span></button>
                            </div>
                        </div>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-bell side-icon"></i><span>水功能区纳污统计</span></button>
                    </div>
                </div>
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口设置审批</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
            </aside>

            <main class="main-panel">
                <section class="summary" aria-label="短信通知概览">
                    <article class="stat t-cyan">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-regular fa-paper-plane"></i></span>
                        <div class="stat-copy">
                            <div class="stat-label">累计发送</div>
                            <div class="stat-number-line"><span class="stat-number" id="statTotal">0</span><span class="stat-unit">条</span></div>
                        </div>
                    </article>
                    <article class="stat t-green">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-regular fa-circle-check"></i></span>
                        <div class="stat-copy">
                            <div class="stat-label">发送成功</div>
                            <div class="stat-number-line"><span class="stat-number" id="statOk">0</span><span class="stat-unit">条</span></div>
                        </div>
                    </article>
                    <article class="stat t-red">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-regular fa-circle-xmark"></i></span>
                        <div class="stat-copy">
                            <div class="stat-label">发送失败</div>
                            <div class="stat-number-line"><span class="stat-number" id="statFail">0</span><span class="stat-unit">条</span></div>
                        </div>
                    </article>
                    <article class="stat t-orange">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-regular fa-calendar-day"></i></span>
                        <div class="stat-copy">
                            <div class="stat-label">今日发送</div>
                            <div class="stat-number-line"><span class="stat-number" id="statToday">0</span><span class="stat-unit">条</span></div>
                        </div>
                    </article>
                    <article class="stat">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-solid fa-percent"></i></span>
                        <div class="stat-copy">
                            <div class="stat-label">发送成功率</div>
                            <div class="stat-number-line"><span class="stat-number" id="statRate">0</span><span class="stat-unit">%</span></div>
                        </div>
                    </article>
                </section>

                <div class="notice-bar"><i class="fa-solid fa-circle-info"></i>
                    <span>短信通知规则：系统每日 <strong>08:30</strong> 自动向相关地市联系人发送问题线索<strong>到期提醒</strong>（5日内到期）；对<strong>过期未办结</strong>线索每日提醒；<strong>延期申请审核结果</strong>实时通知。发送失败的短信将自动重发，重发记录一并留存。</span>
                </div>

                <form class="filter-bar" id="filterForm">
                    <label class="field select" style="width:140px"><select id="categoryFilter" aria-label="通知类型">
                        <option value="">通知类型</option><option>到期提醒</option><option>过期提醒</option><option>延期提醒</option>
                    </select></label>
                    <label class="field select" style="width:122px"><select id="statusFilter" aria-label="发送状态">
                        <option value="">发送状态</option><option>成功</option><option>失败</option>
                    </select></label>
                    <label class="field select" style="width:134px"><select id="cityFilter" aria-label="所属地市">
                        <option value="">所属地市</option>
                    </select></label>
                    <label class="field" style="width:152px"><input id="dateFrom" type="date" aria-label="发送时间起"></label>
                    <span style="color:#8290a4">至</span>
                    <label class="field" style="width:152px"><input id="dateTo" type="date" aria-label="发送时间止"></label>
                    <label class="field" style="width:250px"><input id="kwFilter" type="search" placeholder="接收人 / 短信编号 / 线索编号" aria-label="关键词"></label>
                    <button class="filter-btn search" type="submit"><i class="fa-solid fa-magnifying-glass"></i><span>搜索</span></button>
                    <button class="filter-btn reset" id="resetBtn" type="button"><i class="fa-solid fa-rotate-left"></i><span>重置</span></button>
                    <span class="spacer"></span>
                    <button class="filter-btn export" id="exportBtn" type="button"><i class="fa-regular fa-file-lines"></i><span>数据导出</span></button>
                </form>

                <div class="table-wrap">
                    <div class="table-scroll">
                        <table aria-label="短信通知记录列表">
                            <colgroup>
                                <col style="width:5%"><col style="width:13%"><col style="width:8%"><col style="width:8%"><col style="width:10%">
                                <col style="width:9%"><col style="width:14%"><col style="width:15%"><col style="width:8%"><col style="width:10%">
                            </colgroup>
                            <thead>
                            <tr>
                                <th class="center">序号</th><th>短信编号</th><th class="center">通知类型</th><th class="center">接收人</th>
                                <th class="center">联系电话</th><th class="center">所属地市</th><th>关联问题线索</th>
                                <th class="center">发送时间</th><th class="center">发送状态</th><th class="center">操作</th>
                            </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>

                <!-- 短信详情弹窗 -->
                <div class="modal-backdrop" id="smsModal" role="dialog" aria-modal="true" aria-labelledby="smsTitle">
                    <section class="modal w-md">
                        <header class="modal-header">
                            <div class="head-title"><span id="smsTitle">短信详情</span></div>
                            <button class="modal-close" type="button" data-close="smsModal" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
                        </header>
                        <div class="modal-body" id="smsBody"></div>
                        <footer class="modal-footer">
                            <span class="foot-hint">短信由系统按通知规则自动触发发送。</span>
                            <button class="btn primary" data-close="smsModal" type="button">关 闭</button>
                        </footer>
                    </section>
                </div>

                <div class="toast" id="toast" role="status"></div>
            </main>
        </div>
    </div>
</div>

<script src="assets/clue-data.js"></script>
<script src="assets/clue-shell.js"></script>
<script src="assets/clue-sms.js"></script>
</body>
</html>
