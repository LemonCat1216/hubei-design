<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系人设置 - 湖北省排污口综合监管系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/clue-common.css">
    <link rel="stylesheet" href="assets/clue-contact.css">
</head>
<body>
<div class="viewport">
    <div class="app-shell" id="appShell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">鄂</span>
                <span>湖北省排污口综合监管系统</span>
            </div>
            <nav class="top-nav" aria-label="主导航">
                <button type="button" data-nav="首页"><i class="fa-solid fa-house"></i><span>首页</span></button>
                <button type="button" data-nav="一张图"><i class="fa-regular fa-image"></i><span>一张图</span></button>
                <button type="button" class="active" data-nav="业务管理"><i class="fa-regular fa-clipboard"></i><span>业务管理</span></button>
                <button type="button" data-nav="一口一档"><i class="fa-regular fa-file-lines"></i><span>一口一档</span></button>
                <button type="button" data-nav="水污染源"><i class="fa-solid fa-list-check"></i><span>水污染源</span></button>
                <button type="button" data-nav="综合统计"><i class="fa-solid fa-gavel"></i><span>综合统计</span></button>
            </nav>
            <div class="user"><i class="fa-regular fa-user"></i><span>王羽鹏</span></div>
        </header>

        <div class="workspace">
            <aside class="sidebar" aria-label="业务菜单">
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口管理</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
                <div class="side-group">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口监管</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children">
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-dot side-icon"></i><span>日常监管</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-chart-bar side-icon"></i><span>在线监控</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-flag side-icon"></i><span>盯办帮扶</span></button>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-circle-info side-icon"></i><span>日常监管监测预警</span></button>
                        <div class="side-child-branch">
                            <button type="button" class="side-item side-child branch-toggle on">
                                <i class="fa-regular fa-circle-pause side-icon"></i><span>问题线索</span><i class="fa-solid fa-chevron-up chevron"></i>
                            </button>
                            <div class="side-grandchildren">
                                <button type="button" class="side-item side-grandchild" data-page="clue"><i class="fa-regular fa-file-lines side-icon"></i><span>问题线索</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="defer"><i class="fa-solid fa-hourglass-half side-icon"></i><span>延期申请</span></button>
                                <button type="button" class="side-item side-grandchild" data-page="sms"><i class="fa-regular fa-comment-dots side-icon"></i><span>短信通知记录</span></button>
                                <button type="button" class="side-item side-grandchild active" data-page="contact"><i class="fa-solid fa-address-book side-icon"></i><span>联系人设置</span></button>
                            </div>
                        </div>
                        <button type="button" class="side-item side-child"><i class="fa-regular fa-bell side-icon"></i><span>水功能区纳污统计</span></button>
                    </div>
                </div>
                <div class="side-group collapsed">
                    <button type="button" class="side-item side-parent">
                        <i class="fa-solid fa-sliders side-icon"></i><span>排污口设置审批</span><i class="fa-solid fa-chevron-up chevron"></i>
                    </button>
                    <div class="side-children"></div>
                </div>
            </aside>

            <main class="main-panel">
                <div class="toolbar-row">
                    <div class="seg" id="stateSeg">
                        <button type="button" class="active" data-state="all">全部地市</button>
                        <button type="button" data-state="set">已设置</button>
                        <button type="button" data-state="unset">未设置</button>
                    </div>
                </div>

                <div class="contact-layout">
                    <aside class="city-panel" aria-label="地市列表">
                        <div class="panel-head">
                            <i class="fa-solid fa-list-ul"></i><span>地市列表</span>
                            <span class="panel-count" id="panelCount">已设置 0 / 17</span>
                        </div>
                        <div class="city-list" id="cityList"></div>
                    </aside>

                    <section class="detail-panel" aria-label="联系人设置">
                        <div class="detail-head">
                            <span class="dh-city" id="detailCity">武汉市</span>
                            <span class="cc-pill empty" id="detailPill">未设置</span>
                            <span class="dh-time" id="detailTime">尚未设置</span>
                        </div>
                        <div class="detail-body" id="detailBody"></div>
                        <div class="detail-foot">
                            <span class="foot-hint">联系人须从系统人员库中选择：点击「选择联系人」，输入人员姓名搜索并点击即可返回；每个地市仅保留 1 名联系人，保存后自动生效。</span>
                            <button class="btn ghost" id="resetBtn" type="button"><i class="fa-solid fa-rotate-left"></i>重 置</button>
                            <button class="btn primary" id="saveBtn" type="button"><i class="fa-solid fa-floppy-disk"></i>保存联系人</button>
                        </div>
                    </section>
                </div>

                <!-- 选择联系人弹窗 -->
                <div class="modal-backdrop" id="pickerModal" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
                    <section class="modal w-md">
                        <header class="modal-header">
                            <div class="head-title"><span id="pickTitle">选择联系人</span></div>
                            <button class="modal-close" type="button" data-close="pickerModal" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
                        </header>
                        <div class="modal-body">
                            <div class="notice-bar" style="margin-top:0"><i class="fa-solid fa-circle-info"></i>
                                <span>输入人员姓名或手机号并点击「搜索」，在列表中选中人员后点击「确定」，即可作为「<strong id="pickCity">—</strong>」联系人返回并填充表单。</span>
                            </div>
                            <div class="dir-search" style="margin-top:14px">
                                <label style="flex:1"><input class="kv-input" id="pickSearch" type="search" placeholder="请输入人员姓名或手机号" autocomplete="off"></label>
                                <button class="btn primary pick-search-btn" id="pickSearchBtn" type="button"><i class="fa-solid fa-magnifying-glass"></i>搜 索</button>
                                <span style="color:#8290a4;font-size:14px" id="pickCount"></span>
                            </div>
                            <div class="dir-scroll">
                                <table class="mini-table pick-table">
                                    <thead>
                                    <tr>
                                        <th style="width:25%">姓名</th>
                                        <th style="width:30%">登录名</th>
                                        <th style="width:27%" class="mono">手机号</th>
                                        <th style="width:18%" class="center">性别</th>
                                    </tr>
                                    </thead>
                                    <tbody id="pickBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <footer class="modal-footer">
                            <span class="foot-hint">系统人员库共维护 <strong id="pickTotal">0</strong> 人，选中人员后点击「确定」即可返回。</span>
                            <button class="btn ghost" data-close="pickerModal" type="button">取 消</button>
                            <button class="btn primary" id="pickConfirmBtn" type="button"><i class="fa-solid fa-check"></i>确 定</button>
                        </footer>
                    </section>
                </div>

                <div class="toast" id="toast" role="status"></div>
            </main>
        </div>
    </div>
</div>

<script src="assets/clue-data.js"></script>
<script src="assets/clue-shell.js"></script>
<script src="assets/clue-contact.js"></script>
</body>
</html>
